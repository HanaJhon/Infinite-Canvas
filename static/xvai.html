<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png?v=1.3.7" type="image/png">
    <title>小抽AI</title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/tailwindcss-cdn.js?v=1.3.7.1767196800"></script>
    <script src="/static/vendor/js/lucide.js?v=1.3.7.1767196800"></script>
    <script src="/static/js/theme.js?v=1.3.7.1793681298"></script>
    <script src="/static/js/i18n.js?v=1.3.7.1794291244"></script>
    <link rel="stylesheet" href="/static/css/xvai-agent.css?v=1.3.7.1794379737">
    <style>
        @import url('/static/vendor/css/fonts.css?v=1.3.7.1767196800');
        :root {
            --accent:#111827; --bg:#f9fafb; --card:#fff; --line:#edf0f3; --muted:#94a3b8;
            --easing:cubic-bezier(0.4,0,0.2,1);
        }
        html.studio-theme-dark {
            --accent:#f1f5f9; --bg:#0b0f14; --card:#141a21; --line:#232b35; --muted:#7d8b9c;
        }
        /* 页头/输入区固定在上下，只有聊天区滚动 */
        html, body { height:100%; margin:0; overflow:hidden; overscroll-behavior:none; }
        body { background:var(--bg); color:var(--accent); font-family:'Inter',-apple-system,sans-serif; -webkit-font-smoothing:antialiased; }
        .xv-shell { display:flex; height:100%; overflow:hidden; }
        .xv-main { flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }
        .xv-head { flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:14px 22px; border-bottom:1px solid var(--line); background:var(--card); }
        /* 标题与副标题并成一行（老板 2026-11-11：图1 那两块别叠两行） */
        .xv-brand { display:flex; align-items:baseline; gap:8px; min-width:0; }
        .xv-title { font-size:15px; font-weight:800; letter-spacing:-.01em; flex:0 0 auto; }
        .xv-sub { font-size:10px; font-weight:700; color:var(--muted); letter-spacing:.04em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .xv-head-right { margin-left:auto; display:flex; align-items:center; gap:8px; }
        .xv-btn { height:32px; display:inline-flex; align-items:center; gap:6px; padding:0 12px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--accent); font-size:11px; font-weight:700; cursor:pointer; transition:all .2s var(--easing); white-space:nowrap; }
        .xv-btn:hover { border-color:var(--accent); }
        .xv-balance { height:28px; display:inline-flex; align-items:center; gap:5px; padding:0 10px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--accent); font-size:11px; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
        .xv-cost { margin-top:7px; font-size:10.5px; font-weight:700; color:var(--muted); letter-spacing:.01em; }
        .xv-send-credit { font-size:10.5px; font-weight:800; color:var(--muted); letter-spacing:.01em; margin-right:8px; font-variant-numeric:tabular-nums; white-space:nowrap; }
        .xv-badge { min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:var(--accent); color:var(--card); font-size:10px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; }
        .xv-thread { flex:1 1 auto; min-height:0; overflow-y:auto; padding:26px 22px 10px; display:flex; flex-direction:column; gap:16px; }
        .xv-msg { display:flex; gap:10px; max-width:860px; width:100%; margin:0 auto; }
        .xv-msg.user { flex-direction:row-reverse; }
        .xv-avatar { width:26px; height:26px; border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; background:#eef2ff; color:#4338ca; }
        .xv-msg.user .xv-avatar { background:var(--accent); color:var(--card); }
        .xv-bubble { padding:12px 15px; border-radius:16px; background:var(--card); border:1px solid var(--line); font-size:13px; line-height:1.65; white-space:pre-wrap; word-break:break-word; }
        .xv-msg.user .xv-bubble { background:var(--accent); color:var(--card); border-color:var(--accent); }
        /* 附件胶囊直接嵌在输入框里（照画布 Agent 的 .agent-inline-chip，老板 2026-11-11 图2） */
        .xv-agent .agent-input-rich .xv-chip { display:inline-flex; align-items:center; gap:3px; height:20px; max-width:180px; padding:0 3px 0 7px;
            margin:0 3px; border-radius:999px; border:1px solid var(--line); background:var(--soft); font-size:10.5px; font-weight:650; line-height:1;
            vertical-align:middle; cursor:default; user-select:none; }
        .xv-chip-name { max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .xv-chip-x { display:inline-flex; align-items:center; justify-content:center; width:14px; height:14px; border-radius:50%; color:var(--muted); cursor:pointer; font-size:11px; line-height:1; }
        .xv-chip-x:hover { background:rgba(15,23,42,.14); color:var(--text); }

        /* 技能面板 */
        .xv-skill-panel { min-width:320px; max-width:min(440px, calc(100vw - 60px)); padding:10px; gap:8px; }
        .xv-skill-tabs { display:flex; gap:4px; }
        .xv-skill-tab { flex:1; height:26px; border-radius:9px; border:1px solid transparent; background:var(--soft); color:var(--muted); font-size:10.5px; font-weight:750; cursor:pointer; }
        .xv-skill-tab.active { border-color:var(--strong); color:var(--text); background:var(--card); }
        .xv-skill-body { display:flex; flex-direction:column; gap:6px; }
        .xv-skill-list { display:flex; flex-direction:column; gap:5px; max-height:260px; overflow-y:auto; }
        .xv-skill-item { display:flex; align-items:center; gap:6px; padding:6px 8px; border:1px solid var(--line); border-radius:10px; background:var(--card); }
        .xv-skill-item-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
        .xv-skill-item-name { font-size:10.5px; font-weight:750; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .xv-skill-item-sub { font-size:9.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .xv-skill-item button { height:22px; padding:0 8px; border-radius:8px; border:1px solid var(--line); background:var(--soft); color:var(--text); font-size:9.5px; font-weight:700; cursor:pointer; flex:0 0 auto; }
        .xv-skill-item button:hover { border-color:var(--strong); }
        .xv-skill-item button.primary { background:var(--strong); border-color:var(--strong); color:var(--strong-text); }
        .xv-skill-search { display:flex; gap:4px; }
        .xv-skill-search input, .xv-skill-create input, .xv-skill-create textarea { width:100%; box-sizing:border-box; border:1px solid var(--line); border-radius:9px; background:var(--soft); color:var(--text); font-size:10.5px; padding:6px 8px; outline:none; font-family:inherit; }
        .xv-skill-search input:focus, .xv-skill-create input:focus, .xv-skill-create textarea:focus { border-color:var(--strong); }
        .xv-skill-search button { height:26px; padding:0 10px; border-radius:9px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:10px; font-weight:700; cursor:pointer; flex:0 0 auto; }
        .xv-skill-create { display:flex; flex-direction:column; gap:6px; }
        .xv-skill-create textarea { resize:vertical; }
        .xv-msg-tools { display:flex; gap:6px; margin-top:6px; }
        .xv-typing { display:flex; align-items:center; gap:5px; padding:15px 16px; }
        .xv-typing span { width:6px; height:6px; border-radius:50%; background:var(--muted); animation:xvBlink 1.2s infinite ease-in-out; }
        .xv-typing span:nth-child(2) { animation-delay:.18s; }
        .xv-typing span:nth-child(3) { animation-delay:.36s; }
        @keyframes xvBlink { 0%,80%,100% { opacity:.25; transform:translateY(0); } 40% { opacity:1; transform:translateY(-2px); } }
        .xv-mini { border:none; background:transparent; color:var(--muted); cursor:pointer; padding:2px; border-radius:6px; display:inline-flex; }
        .xv-mini svg { width:16px; height:16px; }
        .xv-mini:hover { color:var(--accent); background:var(--bg); }
        .xv-img-card { position:relative; margin-top:10px; border:1px solid var(--line); border-radius:16px; padding:10px; background:var(--bg); max-width:300px; }
        .xv-img-card img { width:100%; border-radius:12px; display:block; cursor:zoom-in; background:#0b0f14; }
        /* 模型名与操作按钮只在悬浮图片时出现，静态隐藏 */
        .xv-img-model { position:absolute; left:14px; top:14px; z-index:2; padding:3px 9px; border-radius:999px;
            background:rgba(2,6,23,.62); color:#f8fafc; font-size:10px; font-weight:700; backdrop-filter:blur(6px);
            opacity:0; pointer-events:none; transition:opacity .18s var(--easing); }
        .xv-img-actions { position:absolute; left:12px; right:12px; bottom:12px; z-index:2; display:flex; flex-wrap:wrap; gap:6px;
            padding:8px; border-radius:14px; background:rgba(2,6,23,.55); backdrop-filter:blur(8px);
            opacity:0; pointer-events:none; transition:opacity .18s var(--easing); }
        .xv-img-actions button { height:28px; padding:0 10px; border-radius:10px; border:1px solid rgba(248,250,252,.28); background:rgba(248,250,252,.12); color:#f8fafc; font-size:10px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:4px; }
        .xv-img-actions button:hover { background:rgba(248,250,252,.24); }
        .xv-img-card:hover .xv-img-model, .xv-img-card:hover .xv-img-actions,
        .xv-img-card:focus-within .xv-img-model, .xv-img-card:focus-within .xv-img-actions { opacity:1; pointer-events:auto; }
        .xv-ref-edit-layer { position:fixed; inset:0; z-index:90; display:flex; align-items:center; justify-content:center; background:rgba(2,6,23,.5); padding:14px; }
        .xv-ref-edit-frame { position:relative; width:100%; height:100%; border-radius:18px; overflow:hidden; background:#fff; box-shadow:0 30px 80px rgba(2,6,23,.45); }
        .xv-ref-edit-close { display:none; }
        .xv-ref-edit-frame iframe { width:100%; height:100%; border:0; display:block; }
        .xv-ref-edit-close { position:absolute; right:10px; top:10px; z-index:2; width:28px; height:28px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--accent); font-size:16px; line-height:1; cursor:pointer; }
        .xv-empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--muted); font-size:12px; font-weight:600; }
        .xv-composer { flex:0 0 auto; border-top:1px solid var(--line); background:var(--card); padding:12px 22px 14px; }
        .xv-composer-inner { max-width:880px; margin:0 auto; }
        .xv-hint { max-width:880px; margin:6px auto 0; font-size:10px; color:var(--muted); text-align:center; font-weight:600; min-height:14px; }
        .xv-spin { width:10px; height:10px; border:2px solid var(--muted); border-top-color:transparent; border-radius:50%; animation:xvspin .8s linear infinite; display:inline-block; vertical-align:-1px; margin-right:5px; }
        @keyframes xvspin { to { transform:rotate(360deg); } }
        .xv-drawer { width:0; overflow:hidden; border-left:1px solid var(--line); background:var(--card); transition:width .28s var(--easing); display:flex; flex-direction:column; }
        .xv-drawer.open { width:300px; }
        .xv-drawer-head { flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:16px; border-bottom:1px solid var(--line); font-size:12px; font-weight:800; white-space:nowrap; }
        .xv-drawer-head .xv-close { margin-left:auto; cursor:pointer; color:var(--muted); background:none; border:none; padding:4px; }
        .xv-out-list { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
        .xv-out { border:1px solid var(--line); border-radius:14px; padding:10px; display:flex; gap:10px; align-items:center; background:var(--bg); }
        .xv-out-thumb { width:44px; height:44px; border-radius:10px; object-fit:cover; background:#e2e8f0; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
        .xv-out-meta { min-width:0; flex:1; }
        .xv-out-name { font-size:11px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .xv-out-kind { font-size:9px; font-weight:700; color:var(--muted); letter-spacing:.04em; text-transform:uppercase; }
        .xv-out-actions { display:flex; gap:4px; }
        .xv-icon-btn { width:26px; height:26px; border-radius:9px; border:1px solid var(--line); background:var(--card); color:var(--accent); display:flex; align-items:center; justify-content:center; cursor:pointer; }
        .xv-icon-btn:hover { border-color:var(--accent); }
        .xv-out-empty { color:var(--muted); font-size:11px; text-align:center; padding:26px 10px; line-height:1.7; }
        .xv-modal { position:fixed; inset:0; background:rgba(8,12,18,.62); display:none; align-items:center; justify-content:center; z-index:80; padding:28px; }
        .xv-modal.open { display:flex; }
        .xv-modal-card { background:var(--card); color:var(--accent); border-radius:18px; max-width:min(920px,92vw); max-height:86vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.35); }
        .xv-modal-head { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); font-size:12px; font-weight:800; }
        .xv-modal-body { overflow:auto; padding:14px; display:flex; justify-content:center; }
        .xv-modal-body img { max-width:100%; max-height:64vh; border-radius:12px; display:block; }
        .xv-modal-body pre { margin:0; font-size:12px; line-height:1.6; white-space:pre-wrap; word-break:break-word; max-height:64vh; overflow:auto; min-width:min(640px,80vw); }

        /* 历史对话抽屉：左侧滑出，点条目换对话 */
        .xv-hist-mask { position:fixed; inset:0; z-index:70; background:rgba(2,6,23,.28); opacity:0; pointer-events:none; transition:opacity .18s; }
        .xv-hist-mask.open { opacity:1; pointer-events:auto; }
        .xv-hist { position:fixed; left:0; top:0; bottom:0; z-index:71; width:min(320px,78vw); background:var(--card);
            border-right:1px solid var(--line); box-shadow:18px 0 50px rgba(2,6,23,.18); display:flex; flex-direction:column;
            transform:translateX(-102%); transition:transform .2s; }
        .xv-hist.open { transform:none; }
        .xv-hist-head { flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:14px 16px; border-bottom:1px solid var(--line); }
        .xv-hist-head b { font-size:13px; font-weight:800; }
        .xv-hist-close { margin-left:auto; width:26px; height:26px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--muted); display:grid; place-items:center; cursor:pointer; }
        .xv-hist-list { flex:1 1 auto; min-height:0; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:4px; }
        .xv-hist-item { position:relative; border:1px solid transparent; background:transparent; border-radius:12px; display:flex; align-items:center; }
        .xv-hist-item:hover { background:var(--soft); }
        .xv-hist-item.active { background:var(--soft); border-color:var(--line); }
        .xv-hist-main { flex:1 1 auto; min-width:0; text-align:left; background:transparent; border:none; color:inherit; font:inherit; border-radius:12px; padding:9px 11px; cursor:pointer; display:flex; flex-direction:column; gap:3px; }
        .xv-hist-del { flex:0 0 auto; margin-right:6px; border:none; background:transparent; color:var(--muted); cursor:pointer; padding:5px; border-radius:8px; display:inline-flex; opacity:0; transition:opacity .15s ease, color .15s ease, background .15s ease; }
        .xv-hist-item:hover .xv-hist-del, .xv-hist-del:focus-visible { opacity:1; }
        .xv-hist-del:hover { color:#ef4444; background:var(--bg); }
        @media (hover:none) { .xv-hist-del { opacity:1; } }
        .xv-hist-title { font-size:12.5px; font-weight:700; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .xv-hist-sub { font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .xv-hist-empty { padding:22px 14px; font-size:12px; color:var(--muted); text-align:center; }
    </style>
</head>
<body>
<div class="xv-shell">
    <div class="xv-main">
        <div class="xv-head">
            <div class="xv-brand">
                <span class="xv-title" data-i18n="xvai.title">小抽AI</span>
                <span class="xv-sub" data-i18n="xvai.subtitle">对话生成 · 产物实时预览</span>
            </div>
            <div class="xv-head-right">
                <span class="xv-balance" id="xvBalance" title="积分余额"><i data-lucide="wallet" style="width:13px;height:13px"></i><span id="xvBalanceNum">--</span></span>
                <button class="xv-btn" type="button" id="xvHistory" title="历史对话">
                    <i data-lucide="history"></i><span>历史</span>
                </button>
                <button class="xv-btn" type="button" id="xvNew" title="新对话">
                    <i data-lucide="plus"></i><span data-i18n="xvai.newChat">新对话</span>
                </button>
                <button class="xv-btn" type="button" id="xvOutToggle">
                    <i data-lucide="panel-right"></i><span data-i18n="xvai.outputs">输出</span>
                    <span class="xv-badge" id="xvOutCount">0</span>
                </button>
            </div>
        </div>
        <div class="xv-thread" id="xvThread">
            <div class="xv-empty" id="xvEmpty">
                <i data-lucide="sparkles"></i>
                <span data-i18n="xvai.empty">问点什么，产物会收进右侧「输出」。</span>
            </div>
        </div>
        <div class="xv-composer xv-agent">
            <div class="xv-composer-inner">
                <div class="agent-input-area">
                    <div id="xvSlashPalette" class="xv-slash" hidden></div>
                    <div class="agent-onebox">
                        <div class="agent-topbar">
                            <div class="agent-toolbar-dropdown-wrap">
                                <button id="agentModelBtn" class="agent-toolbar-btn" type="button" title="理解模型 · 点击切换"><i data-lucide="cpu"></i><span id="agentModelLabel">理解</span><i data-lucide="chevron-down"></i></button>
                                <button id="agentGenModelBtn" class="agent-toolbar-btn" type="button" title="生图模型 · 点击切换"><i data-lucide="image"></i><span id="agentGenModelLabel">生图</span><i data-lucide="chevron-down"></i></button>
                                <div id="agentModelPanel" class="agent-dropdown-panel" hidden>
                                    <div class="agent-dropdown-row"><label>理解</label><div class="agent-dropdown-selects">
                                        <select id="xvChatProvider"></select>
                                        <select id="xvChatModel"></select>
                                    </div></div>
                                    <div class="agent-dropdown-row"><label>生图</label><div class="agent-dropdown-selects">
                                        <select id="xvImgProvider"></select>
                                        <select id="xvImgModel"></select>
                                    </div></div>
                                </div>
                            </div>
                            <button id="agentReasoningBtn" class="agent-toolbar-btn" type="button" title="思考强度 · 点击切换"><i data-lucide="brain"></i><span id="agentReasoningLabel">自动</span><i data-lucide="chevron-down"></i></button>
                                <button id="agentSkillBtn" class="agent-toolbar-btn" type="button" title="技能 · 已安装 / 市场 / 新建" hidden><i data-lucide="sparkles"></i><span>技能</span></button>
                        </div>
                        <div id="xvStyleCard" class="xv-style-card" hidden>
                            <div class="xv-style-main">
                                <div class="xv-style-title">风格：<span id="xvStyleName"></span></div>
                                <div class="xv-style-sub"><span id="xvStyleCount"></span> 张参考图</div>
                            </div>
                            <button id="xvStyleClear" class="xv-style-x" type="button" title="取消风格">×</button>
                        </div>
                        <div id="agentInput" class="agent-input-rich" contenteditable="true" role="textbox" aria-multiline="true"
                             data-i18n-placeholder="xvai.placeholder" placeholder="输入需求，可附参考图…" data-empty="1"></div>
                        <div class="agent-toolbar">
                            <button id="agentAttachBtn" class="agent-toolbar-icon" type="button" title="添加参考图"><i data-lucide="paperclip"></i></button>
                            <button id="agentParamsBtn" class="agent-toolbar-btn agent-params-btn" type="button" title="出图参数 · 点击调整">
                                <i data-lucide="ruler"></i><span id="agentParamsLabel">1:1 · 4K · 高</span><i data-lucide="chevron-down"></i>
                            </button>
                            <div class="agent-toolbar-spacer"></div>
                            <span id="xvSendCredit" class="xv-send-credit" hidden></span>
                            <button id="agentSendBtn" class="agent-send-btn" type="button" title="发送"><i data-lucide="send"></i></button>
                        </div>
                    </div>
                    <div id="agentParamsPanel" class="agent-dropdown-panel agent-params-panel" hidden>
                        <div class="agent-params-section">
                            <div class="agent-params-title">比例</div>
                            <div class="agent-ratio-grid" id="agentRatioGrid"></div>
                        </div>
                        <div class="agent-params-section">
                            <div class="agent-params-title">分辨率</div>
                            <div class="agent-res-grid" id="agentResGrid"></div>
                        </div>
                        <div class="agent-params-section">

                                <input id="xvSkillName" type="text" placeholder="名称，例如：胶片人像">
                                <textarea id="xvSkillText" rows="8" placeholder="SKILL.md 正文：写清这个 Skill 什么时候用、具体怎么做。已安装后 Agent 每轮都会读到。"></textarea>
                                <div style="display:flex;justify-content:flex-end"><button type="button" id="xvSkillCreateBtn">保存并安装</button></div>

    <aside class="xv-drawer" id="xvDrawer">

            <i data-lucide="folder-open"></i>

        </div>
        <div class="xv-out-list" id="xvOutList">
            <div class="xv-out-empty" data-i18n="xvai.noOutputs">还没有产物。让 AI 出图或生成文件后会出现在这里。</div>

    <div class="xv-hist-head">
        <b>历史对话</b>
        <button class="xv-hist-close" type="button" id="xvHistClose"><i data-lucide="x"></i></button>
    </div>
    <div class="xv-hist-list" id="xvHistList"><div class="xv-hist-empty">还没有历史对话</div></div>

<script>
(function(){
    const $ = id => document.getElementById(id);
    const OUT_RE = /(?:^|[\s("'=])((?:\/output|\/assets|\/api\/storage-files)\/[^\s)"'<>]+)/g;
    const IMG_MD_RE = /!\[[^\]]*\]\(([^)\s]+)\)/g;
    const RATIOS = [
        ['square','1:1',1], ['landscape','3:2',3/2], ['portrait','2:3',2/3], ['landscape43','4:3',4/3],
        ['portrait43','3:4',3/4], ['wide','16:9',16/9], ['story','9:16',9/16]
    ];
    const RES_LONG_SIDE = {'1k':1536,'2k':2048,'4k':3840};
    const RES_PIXEL_LIMIT = {'1k':1572864,'2k':4194304,'4k':8294400};
    const QUALITIES = [['','自动'],['high','高'],['medium','中'],['low','低']];
    const state = {
        convId: localStorage.getItem('xvai_conv_id') || '',
        chatProvider: localStorage.getItem('xvai_provider') || '',
        chatModel: localStorage.getItem('xvai_model') || '',
        imgProvider: localStorage.getItem('xvai_img_provider') || '',
        imgModel: localStorage.getItem('xvai_img_model') || '',
        params: { ratio:'square', res:'4k', quality:'high', think:'auto' },
        messages: [],
        outputs: [],
        sending: false,
        pending: false,
        rewindId: '',
        skills: [],
        activeStyle: null,
        chatOptions: [],
        imgOptions: [],
        providers: []
    };
    try { Object.assign(state.params, JSON.parse(localStorage.getItem('xvai_params') || '{}')); } catch(e) {}

    function esc(text){
        return String(text == null ? '' : text)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function isImage(url){ return /\.(png|jpe?g|gif|webp|avif|bmp|svg)(\?|#|$)/i.test(String(url || '')); }
    function fileName(url){
        try {
            const clean = String(url).split('?')[0].split('#')[0];
            return decodeURIComponent(clean.split('/').pop() || 'file');
        } catch(e){ return 'file'; }
    }
    function icons(){ try { window.lucide?.createIcons(); } catch(e) {} }
    function setHint(text, busy){
        $('xvHint').innerHTML = (busy ? '<span class="xv-spin"></span>' : '') + esc(text || '');
    }
    function closePanels(except){
        [$('agentModelPanel'), $('agentParamsPanel'), $('xvSkillPanel'), $('agentReasoningPanel')].forEach(el => { if(el && el !== except) el.hidden = true; });
        ['agentModelBtn','agentGenModelBtn','agentParamsBtn','agentSkillBtn'].forEach(id => $(id)?.classList.remove('active'));
    }

    // 比例 + 分辨率 → WxH，与画布 apiImageSize 同一套约束（长边 + 像素上限），16 对齐
    function computeSize(){
        const [, , ratio] = RATIOS.find(r => r[0] === state.params.ratio) || RATIOS[0];
        const longSide = RES_LONG_SIDE[state.params.res] || 3840;
        const pixelLimit = RES_PIXEL_LIMIT[state.params.res] || 8294400;
        const w = Math.min(ratio >= 1 ? longSide : longSide * ratio, Math.sqrt(pixelLimit * ratio));
        const h = Math.min(ratio >= 1 ? longSide / ratio : longSide, Math.sqrt(pixelLimit / ratio));
        return `${Math.round(w / 16) * 16}x${Math.round(h / 16) * 16}`;
    }

    // ---------- 参数 ----------
    $('agentRatioGrid').innerHTML = RATIOS.map(r =>
        `<button class="agent-ratio-btn" type="button" data-ratio="${r[0]}"><span class="agent-ratio-icon" style="aspect-ratio:${r[2]}"></span>${r[1]}</button>`
    ).join('');
    $('agentResGrid').innerHTML = ['1k','2k','4k'].map(r => `<button class="agent-res-btn" type="button" data-res="${r}">${r.toUpperCase()}</button>`).join('');
    $('agentQualitySeg').innerHTML = QUALITIES.map(q => `<button class="agent-quality-btn" type="button" data-quality="${q[0]}">${q[1]}</button>`).join('');

    function syncParamsLabel(){
        const ratioLabel = (RATIOS.find(r => r[0] === state.params.ratio) || RATIOS[0])[1];
        const qualityLabel = (QUALITIES.find(q => q[0] === state.params.quality) || QUALITIES[0])[1];
        $('agentParamsLabel').textContent = `${ratioLabel} · ${String(state.params.res).toUpperCase()} · ${qualityLabel}`;
        document.querySelectorAll('#agentRatioGrid .agent-ratio-btn').forEach(b => b.classList.toggle('active', b.dataset.ratio === state.params.ratio));
        document.querySelectorAll('#agentResGrid .agent-res-btn').forEach(b => b.classList.toggle('active', b.dataset.res === state.params.res));
        document.querySelectorAll('#agentQualitySeg .agent-quality-btn').forEach(b => b.classList.toggle('active', b.dataset.quality === state.params.quality));
    }
    function persistParams(){ localStorage.setItem('xvai_params', JSON.stringify(state.params)); }

    $('agentRatioGrid').addEventListener('click', ev => {
        const btn = ev.target.closest('[data-ratio]'); if(!btn) return;
        state.params.ratio = btn.dataset.ratio;
        if(btn.dataset.ratio === 'ultrawide' || btn.dataset.ratio === 'ultratall') state.params.ratio = btn.dataset.ratio;
        persistParams(); syncParamsLabel();
    });
    $('agentResGrid').addEventListener('click', ev => {
        const btn = ev.target.closest('[data-res]'); if(!btn) return;
        state.params.res = btn.dataset.res; persistParams(); syncParamsLabel();
    });
    $('agentQualitySeg').addEventListener('click', ev => {
        const btn = ev.target.closest('[data-quality]'); if(!btn) return;
        state.params.quality = btn.dataset.quality; persistParams(); syncParamsLabel();
    });
    const THINK_LABELS = {auto:'自动', minimal:'最低', low:'低', medium:'中', high:'高'};
    function syncThinkLabel(){
        const v = String(state.params.think || 'auto');
        $('agentReasoningLabel').textContent = THINK_LABELS[v] || '自动';
        $('agentReasoningLabel').title = v === 'auto' ? '思考强度：跟随模型默认' : `思考强度：${THINK_LABELS[v]}（reasoning_effort=${v}）`;
    }
    $('agentReasoningBtn').addEventListener('click', ev => {
        ev.stopPropagation();
        const panel = $('agentReasoningPanel');
        const open = panel.hidden;
        closePanels(open ? panel : null);
        panel.hidden = !open;
        $('agentReasoningBtn').classList.toggle('active', open);
    });
    $('agentReasoningPanel').addEventListener('click', ev => {
        const btn = ev.target.closest('[data-reasoning]'); if(!btn) return;
        state.params.think = btn.dataset.reasoning || 'auto';
        persistParams(); syncThinkLabel();
        $('agentReasoningPanel').hidden = true;
        $('agentReasoningBtn').classList.remove('active');
    });
    syncThinkLabel();
    $('agentParamsBtn').addEventListener('click', ev => {
        ev.stopPropagation();
        const panel = $('agentParamsPanel');
        const open = panel.hidden;
        closePanels(open ? panel : null);
        panel.hidden = !open;
        $('agentParamsBtn').classList.toggle('active', open);
    });

    // ---------- 模型 ----------
    function providerById(pid){ return state.providers.find(p => p.id === pid) || null; }
    function modelsOf(pid, kind){
        const p = providerById(pid);
        if(!p) return [];
        return kind === 'chat' ? (p.chat_models || []) : (p.image_models || []);
    }
    function fillModelSelects(){
        const chatList = state.chatOptions;
        const imgList = state.imgOptions;
        const chatPs = [...new Set(chatList.map(o => o.provider))];
        const imgPs = [...new Set(imgList.map(o => o.provider))];

        $('xvChatProvider').innerHTML = chatPs.map(pid => {
            const p = providerById(pid);
            return `<option value="${esc(pid)}">${esc(p?.name || pid)}</option>`;
        }).join('') || '<option value="">未配置</option>';
        if(!chatPs.includes(state.chatProvider) && chatPs.length) state.chatProvider = chatPs[0];
        $('xvChatProvider').value = state.chatProvider;

        $('xvChatModel').innerHTML = modelsOf(state.chatProvider, 'chat').map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('') || '<option value="">—</option>';
        if(!modelsOf(state.chatProvider, 'chat').includes(state.chatModel)) state.chatModel = modelsOf(state.chatProvider, 'chat')[0] || '';
        $('xvChatModel').value = state.chatModel;

        $('xvImgProvider').innerHTML = imgPs.map(pid => {
            const p = providerById(pid);
            return `<option value="${esc(pid)}">${esc(p?.name || pid)}</option>`;
        }).join('') || '<option value="">未配置</option>';
        if(!imgPs.includes(state.imgProvider) && imgPs.length) state.imgProvider = imgPs[0];
        $('xvImgProvider').value = state.imgProvider;

        $('xvImgModel').innerHTML = modelsOf(state.imgProvider, 'image').map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('') || '<option value="">—</option>';
        if(!modelsOf(state.imgProvider, 'image').includes(state.imgModel)) state.imgModel = modelsOf(state.imgProvider, 'image')[0] || '';
        $('xvImgModel').value = state.imgModel;

        $('agentModelLabel').textContent = state.chatModel || '理解';
        $('agentGenModelLabel').textContent = state.imgModel || '生图';
    }
    async function loadProviders(){
        try {
            const res = await fetch('/api/providers');
            const data = await res.json();
            state.providers = (data.providers || []).filter(p => p && p.enabled !== false);
        } catch(e) { state.providers = []; }
        state.chatOptions = [];
        state.imgOptions = [];
        state.providers.forEach(p => {
            (p.chat_models || []).forEach(m => state.chatOptions.push({ provider:p.id, model:m }));
            (p.image_models || []).forEach(m => state.imgOptions.push({ provider:p.id, model:m }));
        });
        fillModelSelects();
        if(!state.chatOptions.length) setHint('没找到可用的对话通道，请先在 API 设置里配好 chat 模型。');
    }
    ['xvChatProvider','xvChatModel'].forEach(id => $(id).addEventListener('change', () => {
        state.chatProvider = $('xvChatProvider').value;
        state.chatModel = $('xvChatModel').value;
        localStorage.setItem('xvai_provider', state.chatProvider);
        localStorage.setItem('xvai_model', state.chatModel);
        fillModelSelects();
        scheduleSendCredit();
    }));
    ['xvImgProvider','xvImgModel'].forEach(id => $(id).addEventListener('change', () => {
        state.imgProvider = $('xvImgProvider').value;
        state.imgModel = $('xvImgModel').value;
        localStorage.setItem('xvai_img_provider', state.imgProvider);
        localStorage.setItem('xvai_img_model', state.imgModel);
        fillModelSelects();
        scheduleSendCredit();
    }));

    $('agentModelBtn').addEventListener('click', ev => {
        ev.stopPropagation();
        const panel = $('agentModelPanel');
        const open = panel.hidden;
        closePanels(open ? panel : null);
        panel.hidden = !open;
    });
    $('agentGenModelBtn').addEventListener('click', ev => {
        ev.stopPropagation();
        const panel = $('agentModelPanel');
        const open = panel.hidden;
        closePanels(open ? panel : null);
        panel.hidden = !open;
        panel.querySelectorAll('.agent-dropdown-row')[1]?.scrollIntoView({block:'nearest'});
    });
    document.addEventListener('click', ev => {
        if(!ev.target.closest('.agent-toolbar-dropdown-wrap') && !ev.target.closest('.agent-params-panel') && !ev.target.closest('#agentParamsBtn')
            && !ev.target.closest('#xvSkillPanel') && !ev.target.closest('#agentSkillBtn')
            && !ev.target.closest('#agentReasoningPanel') && !ev.target.closest('#agentReasoningBtn')) closePanels();
    });

    // ---------- 附件：内联进输入框（照画布 Agent：文件是句子里的胶囊，不是下面的卡片） ----------
    function chipNode(ref){
        const chip = document.createElement('span');
        chip.className = 'xv-chip';
        chip.contentEditable = 'false';
        chip.dataset.url = ref.url;
        chip.dataset.name = ref.name || fileName(ref.url);
        chip.innerHTML = `<span class="xv-chip-name">${esc(chip.dataset.name)}</span><span class="xv-chip-x" role="button" title="移除">×</span>`;
        return chip;
    }
    // 附件就是以 DOM 胶囊为准（删除、拖走、退格删到头，状态自动跟着变，不会残留幽灵附件）
    function inputRefs(){
        return Array.from($('agentInput').querySelectorAll('.xv-chip'))
            .map(chip => ({ url: chip.dataset.url, name: chip.dataset.name, kind:'image' }));
    }
    function addRef(ref){
        const input = $('agentInput');
        input.appendChild(document.createTextNode(input.childNodes.length ? ' ' : ''));
        input.appendChild(chipNode(ref));
        syncInputEmpty(); scheduleSendCredit();
    }
    async function uploadRefs(files){
        for(const file of files){
            try {
                const form = new FormData();
                form.append('files', file, file.name);
                const res = await fetch('/api/ai/upload', { method:'POST', body: form });
                const data = await res.json();
                const first = (data.files || [])[0];
                if(first && first.url) addRef({ url:first.url, name:first.name || file.name });
            } catch(e) { setHint('参考图上传失败：' + (e.message || e)); }
        }
    }
    $('agentAttachBtn').addEventListener('click', () => $('xvFileInput').click());
    $('xvFileInput').addEventListener('change', ev => {
        const files = Array.from(ev.target.files || []);
        if(files.length) uploadRefs(files);
        ev.target.value = '';
    });
    $('agentInput').addEventListener('click', ev => {
        const x = ev.target.closest('.xv-chip-x');
        if(x){
            x.closest('.xv-chip')?.remove();
            syncInputEmpty(); scheduleSendCredit();
            return;
        }
        const chip = ev.target.closest('.xv-chip');
        if(chip && chip.dataset.url) openPreview(chip.dataset.url, chip.dataset.name);
    });

    // ---------- 拖入 / 粘贴文件（照画布 Agent：整页可拖，附件落成胶囊） ----------
    function filesFromPaste(dt){
        const out = [];
        Array.from((dt && dt.items) || []).forEach(it => {
            if(it.kind !== 'file') return;
            const f = it.getAsFile();
            if(f) out.push(f);
        });
        if(!out.length && dt && dt.files) out.push(...Array.from(dt.files));
        return out;
    }
    $('agentInput').addEventListener('paste', ev => {
        const files = filesFromPaste(ev.clipboardData);
        if(!files.length) return;
        ev.preventDefault();
        uploadRefs(files);
        focusInputEnd();
    });
    const composerEl = document.querySelector('.xv-composer');
    let dragDepth = 0;
    ['dragenter', 'dragover'].forEach(type => document.addEventListener(type, ev => {
        if(!Array.from((ev.dataTransfer && ev.dataTransfer.types) || []).includes('Files')) return;
        ev.preventDefault();
        if(type === 'dragenter') dragDepth++;
        composerEl?.classList.add('xv-drag-over');
    }));
    document.addEventListener('dragleave', () => {
        dragDepth -= 1;
        if(dragDepth <= 0){ dragDepth = 0; composerEl?.classList.remove('xv-drag-over'); }
    });
    document.addEventListener('drop', ev => {
        const files = Array.from((ev.dataTransfer && ev.dataTransfer.files) || []);
        if(!files.length) return;
        ev.preventDefault();
        dragDepth = 0; composerEl?.classList.remove('xv-drag-over');
        uploadRefs(files);
        focusInputEnd();
    });

    // ---------- / 斜杠命令：调用已安装 Skill（后端 /api/chat/agent 自己解析 /skill xxx） ----------
    let slashSkills = null, slashItems = [], slashIndex = 0, slashOpen = false;
    const slashEl = $('xvSlashPalette');
    async function loadSlashSkills(){
        if(slashSkills) return slashSkills;
        try {
            const res = await fetch('/api/skills/installed', { cache:'no-store' });
            const data = await res.json();
            slashSkills = Array.isArray(data.skills) ? data.skills : [];
        } catch(e){ slashSkills = []; }
        return slashSkills;
    }
    function renderSlashPalette(){
        if(!slashItems.length){ closeSlashPalette(); return; }
        slashEl.innerHTML = '<div class="xv-slash-head">可调用指令</div>' + slashItems.map((it, i) =>
            '<div class="xv-slash-item' + (i === slashIndex ? ' active' : '') + '" data-slash="' + i + '">'
            + '<div class="xv-slash-label">' + esc(it.label) + '</div>'
            + '<div class="xv-slash-desc">' + esc(it.desc) + '</div></div>').join('');
        slashEl.hidden = false;
        slashOpen = true;
    }
    function closeSlashPalette(){ slashOpen = false; slashEl.hidden = true; slashEl.innerHTML = ''; }
    async function openSlashPalette(query){
        const skills = await loadSlashSkills();
        const q = String(query || '').toLowerCase();
        // 内置指令（照画布 Agent 的「可调用指令」区）：压缩上下文走后端 /compress，清空=开新对话
        const builtins = [
            { label:'压缩上下文', desc:'只留最近几条对话，早期的折叠成一行说明', insert:'/compress', keys:'compress 压 压缩' },
            { label:'清空上下文', desc:'清空本次对话记录（Skill 与附件不受影响）', clear:true, keys:'clear 清 清空' }
        ].filter(b => !q || b.label.toLowerCase().includes(q) || b.keys.includes(q));
        slashItems = builtins.concat(skills
            .filter(s => !q || String(s.name || s.title || s.id || '').toLowerCase().includes(q))
            .slice(0, 8)
            .map(s => ({ label: s.title || s.name || s.id, id: s.id, desc: '激活这个 Skill', insert: '/skill ' + (s.name || s.id) })));
        slashItems.push({ label: '关闭主动 Skill', desc: '/skill off', insert: '/skill off' });
        // 同名 Skill 装过多次时只留一条，免得列表里两个一模一样的选项
        const seen = new Set();
        slashItems = slashItems.filter(it => (seen.has(it.label) ? false : (seen.add(it.label), true)));
        slashIndex = 0;
        renderSlashPalette();
    }
    function pickSlashItem(){
        const it = slashItems[slashIndex];
        if(!it) return;
        closeSlashPalette();
        if(it.clear){
            setInputContent('', []);
            resetChat();
            setHint('已开新对话，上下文清空了；旧对话还在「历史」里');
            return;
        }
        // 命令必须自成一条消息（后端只认以 / 开头的整句），所以先摘掉正文末尾的 /xxx，发完再把原文放回输入栏
        const rest = readInput().replace(/(?:^|\s)\/[^\s]*$/, '').trim();
        const refs = inputRefs();
        send(it.insert);
        setInputContent(rest, refs);
        // 风格库建出来的 Skill（id = style-xxx）→ 挂成风格卡片，生图时带参考图
        if(String(it.id || '').startsWith('style-')) activateStyleSkill(it.id, it.label);
    }
    slashEl.addEventListener('mousedown', ev => {
        const node = ev.target.closest('[data-slash]');
        if(!node) return;
        ev.preventDefault();
        slashIndex = parseInt(node.dataset.slash, 10) || 0;
        pickSlashItem();
    });
    $('agentInput').addEventListener('input', () => {
        // 光标处的「/」开头词才弹面板：句中的 /、路径里的 / 不打扰
        const m = /(?:^|\s)\/([^\s]*)$/.exec(readInput());
        if(m) openSlashPalette(m[1]); else closeSlashPalette();
    });
    document.addEventListener('click', ev => {
        if(slashOpen && !ev.target.closest('#xvSlashPalette') && !ev.target.closest('#agentInput')) closeSlashPalette();
    });

    // ---------- 风格 Skill：挂上后显示参考图卡片，生图自动带参考图（照画布 Agent） ----------
    const STYLE_REF_LIMIT = 3;
    function renderStyleCard(){
        const card = $('xvStyleCard');
        if(!card) return;
        const st = state.activeStyle;
        card.hidden = !(st && st.urls && st.urls.length);
        if(card.hidden) return;
        $('xvStyleName').textContent = st.name || '';
        $('xvStyleCount').textContent = String(st.urls.length);
    }
    function saveStyle(){ try { localStorage.setItem('xvai_style', JSON.stringify(state.activeStyle || null)); } catch(e){} }
    async function activateStyleSkill(skillId, title){
        let style = null;
        const pool = [];
        for(const scope of ['personal', 'team']){
            try {
                const res = await fetch('/api/style-library?scope=' + scope, { cache:'no-store' });
                const data = await res.json();
                (data.styles || []).forEach(s => pool.push(s));
            } catch(e){}
        }
        style = pool.find(s => String(s.skill_id || '') === String(skillId));
        /* 同一个风格可能被装过多次（旧 Skill 已失效、只留下同名条目），
           按 skill_id 找不到就退一步按名字认，否则用户选中的那条永远挂不上卡片。 */
        if(!style && title){
            const t = String(title);
            style = pool.find(s => {
                const name = String(s.name || '');
                return name && (t.includes(name) || name.includes(t));
            }) || null;
        }
        if(!style || !(style.images || []).length){ setHint(`「${title || skillId}」在风格库里没有参考图，先在风格库补几张`); return; }
        state.activeStyle = {
            id: style.id, skillId, name: style.name || title,
            urls: style.images.map(i => i.url).filter(Boolean).slice(0, STYLE_REF_LIMIT)
        };
        saveStyle(); renderStyleCard();
        setHint(`已挂上风格「${state.activeStyle.name}」，生图会自动带 ${state.activeStyle.urls.length} 张参考图`);
    }
    function clearStyle(tellServer){
        state.activeStyle = null; saveStyle(); renderStyleCard();
        if(tellServer) send('/skill off');
    }
    // 手打 /skill <名称|id> 时也能挂卡片：从已安装列表里找到 id 再查风格库
    async function activateStyleFromArg(arg){
        const skills = await loadSlashSkills();
        const hit = skills.find(s => s.id === arg || s.name === arg || s.title === arg);
        if(hit && String(hit.id || '').startsWith('style-')) activateStyleSkill(hit.id, hit.title || hit.name);
    }
    $('xvStyleClear')?.addEventListener('click', () => clearStyle(true));
    try { state.activeStyle = JSON.parse(localStorage.getItem('xvai_style') || 'null'); } catch(e) { state.activeStyle = null; }
    renderStyleCard();

    // ---------- 输出收集 ----------
    function addOutput(list, url, kind){
        if(!url) return;
        const clean = String(url).replace(/[.,，。]+$/, '');
        if(!clean || list.some(o => o.url === clean)) return;
        list.push({ url: clean, kind: kind || (isImage(clean) ? 'image' : 'file'), name: fileName(clean) });
    }
    function collectOutputs(messages){
        const out = [];
        (messages || []).forEach(msg => {
            if(!msg || msg.role !== 'assistant') return;
            (msg.image_urls || []).forEach(url => addOutput(out, url, 'image'));
            (msg.attachments || []).forEach(item => { if(item && item.url && isImage(item.url)) addOutput(out, item.url, 'image'); });
            const text = String(msg.content || '');
            let m;
            IMG_MD_RE.lastIndex = 0;
            while((m = IMG_MD_RE.exec(text))) addOutput(out, m[1], 'image');
            OUT_RE.lastIndex = 0;
            while((m = OUT_RE.exec(text))) addOutput(out, m[1]);
            (msg.tool_events || []).forEach(ev => {
                const args = ev && ev.args || {};
                ['path', 'file_path', 'filepath', 'filename', 'url'].forEach(k => {
                    const v = args[k];
                    if(typeof v === 'string' && v.trim()) addOutput(out, v.trim());
                });
            });
        });
        return out;
    }
    function renderOutputs(){
        state.outputs = collectOutputs(state.messages);
        $('xvOutCount').textContent = String(state.outputs.length);
        const list = $('xvOutList');
        if(!state.outputs.length){
            list.innerHTML = `<div class="xv-out-empty">${esc((window.t && t('xvai.noOutputs')) || '还没有产物。让 AI 出图或生成文件后会出现在这里。')}</div>`;
            return;
        }
        list.innerHTML = state.outputs.map((o, i) => {
            const thumb = o.kind === 'image'
                ? `<img class="xv-out-thumb" src="${esc(o.url)}" alt="" loading="lazy">`
                : `<div class="xv-out-thumb"><i data-lucide="file-text" style="color:#94a3b8"></i></div>`;
            return `<div class="xv-out">
                ${thumb}
                <div class="xv-out-meta">
                    <div class="xv-out-name" title="${esc(o.url)}">${esc(o.name)}</div>
                    <div class="xv-out-kind">${o.kind === 'image' ? 'IMAGE' : 'FILE'}</div>
                </div>
                <div class="xv-out-actions">
                    <button class="xv-icon-btn" type="button" data-xv-preview="${i}" title="预览"><i data-lucide="eye"></i></button>
                    <a class="xv-icon-btn" href="${esc(o.url)}" download="${esc(o.name)}" title="下载"><i data-lucide="download"></i></a>
                </div>
            </div>`;
        }).join('');
        icons();
    }

    // ---------- 消息渲染 ----------
    function imageCard(url, model){
        return `<div class="xv-img-card">
            <img src="${esc(url)}" alt="" loading="lazy" data-xv-zoom="${esc(url)}">
            <div class="xv-img-model">${esc(model || '')}</div>
            <div class="xv-img-actions">
                <button type="button" data-xv-act="edit"><i data-lucide="pencil"></i>修改</button>
                <button type="button" data-xv-act="vary"><i data-lucide="layers"></i>变体</button>
                <button type="button" data-xv-act="reverse"><i data-lucide="scan-eye"></i>反推</button>
            </div>
        </div>`;
    }
    // 本次消耗（后端 chat_agent 显式扣费后写进消息里，见 main.py「小抽AI 计费」块）
    function creditsChip(msg){
        const c = msg && msg.credits;
        if(!c || !c.charged) return '';
        return `<div class="xv-cost">本次消耗 ${esc(String(c.credits))} 积分 · 余额 ${esc(String(c.balance))}</div>`;
    }
    async function refreshBalance(){
        try {
            const res = await fetch('/api/credits/balance');
            if(!res.ok) return;
            const data = await res.json();
            const num = $('xvBalanceNum');
            if(num) num.textContent = String(data.balance ?? '--');
        } catch(e) {}
    }
    function renderThread(){
        const thread = $('xvThread');
        if(!state.messages.length){
            thread.innerHTML = `<div class="xv-empty" id="xvEmpty">
                <i data-lucide="sparkles"></i>
                <span>${esc((window.t && t('xvai.empty')) || '问点什么，产物会收进右侧「输出」。')}</span>
            </div>`;
            icons();
            return;
        }
        thread.innerHTML = state.messages.map((msg, idx) => {
            const mine = msg.role === 'user';
            const cards = !mine && (msg.image_urls || []).length
                ? (msg.image_urls || []).map(u => imageCard(u, msg.model)).join('')
                : '';
            const tools = !mine ? `<div class="xv-msg-tools">
                <button class="xv-mini" type="button" data-xv-copy="${idx}" title="复制回复"><i data-lucide="copy"></i></button>
                <button class="xv-mini" type="button" data-xv-retry="${idx}" title="重试上一条"><i data-lucide="rotate-ccw"></i></button>
            </div>` : `<div class="xv-msg-tools">
                <button class="xv-mini" type="button" data-xv-copy="${idx}" title="复制"><i data-lucide="copy"></i></button>
                <button class="xv-mini" type="button" data-xv-edit-msg="${idx}" title="回到这条消息继续编辑重发"><i data-lucide="pencil"></i></button>
            </div>`;
            const atts = mine && (msg.attachments || []).length
                ? `<div class="xv-msg-atts">${(msg.attachments || []).map(a =>
                    `<img src="${esc(a.url)}" alt="${esc(a.name || '')}" loading="lazy" data-xv-zoom="${esc(a.url)}">`).join('')}</div>`
                : '';
            const bubble = `<div class="xv-bubble">${esc(msg.content || '')}${atts}${cards}${creditsChip(msg)}</div>`;
            return `<div class="xv-msg ${mine ? 'user' : 'assistant'}">
                <div class="xv-avatar">${mine ? '我' : 'AI'}</div>
                ${bubble}
                ${tools}
            </div>`;
        }).join('');

        if(state.pending){
            thread.innerHTML += `<div class="xv-msg assistant xv-bubble-pending">
                <div class="xv-avatar">AI</div>
                <div class="xv-bubble xv-typing"><span></span><span></span><span></span></div>
            </div>`;
        }
        icons();
        thread.scrollTop = thread.scrollHeight;
    }

    // ---------- 预览 ----------
    async function openPreview(url, name){
        const body = $('xvModalBody');
        $('xvModalTitle').textContent = name || fileName(url);
        $('xvModalDownload').href = url;
        $('xvModalDownload').setAttribute('download', name || fileName(url));
        body.innerHTML = '<div style="color:#94a3b8;font-size:12px">加载中…</div>';
        $('xvModal').classList.add('open');
        if(isImage(url)){
            const img = new Image();
            img.src = url;
            img.alt = name || '';
            await new Promise(r => { img.onload = r; img.onerror = r; });
            body.innerHTML = '';
            body.appendChild(img);
            return;
        }
        try {
            const res = await fetch(url);
            const text = await res.text();
            body.innerHTML = `<pre>${esc(text.slice(0, 200000))}</pre>`;
        } catch(e) {
            body.innerHTML = `<div style="color:#94a3b8;font-size:12px">打不开这个文件，直接下载看看。</div>`;
        }
    }
    function closePreview(){ $('xvModal').classList.remove('open'); $('xvModalBody').innerHTML = ''; }

    // ---------- 输入 ----------
    /* 读正文时要跳过附件胶囊：胶囊隐藏后 innerText 就不含它们的名字了。
       不用 cloneNode —— 脱离文档的元素取 innerText 会丢掉换行。 */
    function readInput(){
        const input = $('agentInput');
        const chips = Array.from(input.querySelectorAll('.xv-chip'));
        chips.forEach(chip => { chip.style.display = 'none'; });
        const text = (input.innerText || '').replace(/\u00a0/g, ' ').trim();
        chips.forEach(chip => { chip.style.display = ''; });
        return text;
    }
    function clearInput(){ $('agentInput').innerHTML = ''; syncInputEmpty(); updateSendCredit(); }
    // 回溯用：正文 + 当时的附件一起放回输入栏
    function setInputContent(text, refs){
        const input = $('agentInput');
        input.innerHTML = '';
        if(text) input.appendChild(document.createTextNode(text));
        (refs || []).filter(ref => ref && ref.url).forEach(ref => {
            if(input.childNodes.length) input.appendChild(document.createTextNode(' '));
            input.appendChild(chipNode(ref));
        });
        syncInputEmpty(); updateSendCredit();
    }
    function focusInputEnd(){
        const input = $('agentInput');
        input.focus();
        try {
            const range = document.createRange();
            range.selectNodeContents(input);
            range.collapse(false);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
        } catch(e) {}
    }
    // 回溯：点「编辑」= 把这条 user 消息（正文 + 附件）搬回输入栏，后面的对话先在本地位上退掉，
    // 发送时带上 rewind_message_id 让后端同样截断并落盘（照画布 Agent 的 agentBeginEditMessage）
    function beginEditMessage(idx){
        if(state.sending) return;
        const msg = state.messages[idx];
        if(!msg || msg.role !== 'user') return;
        const dropped = state.messages.length - idx - 1;
        state.rewindId = msg.id || '';
        state.messages = state.messages.slice(0, idx);
        setInputContent(msg.content || '', msg.attachments || []);
        renderThread();
        focusInputEnd();
        setHint(dropped > 0 ? `已回到这条消息，后面 ${dropped} 条已回退；改完直接发送` : '已回到这条消息，改完直接发送');
    }
    // 只有附件胶囊也算"有内容"：否则占位提示会和胶囊挤在同一行
    function syncInputEmpty(){
        $('agentInput').dataset.empty = (readInput() || inputRefs().length) ? '0' : '1';
    }
    $('agentInput').addEventListener('input', () => { syncInputEmpty(); scheduleSendCredit(); });
    $('agentInput').addEventListener('keydown', ev => {
        if(slashOpen){
            if(ev.key === 'ArrowDown' || ev.key === 'ArrowUp'){
                ev.preventDefault();
                slashIndex = (slashIndex + (ev.key === 'ArrowDown' ? 1 : -1) + slashItems.length) % slashItems.length;
                renderSlashPalette();
                return;
            }
            if(ev.key === 'Enter' || ev.key === 'Tab'){ ev.preventDefault(); pickSlashItem(); return; }
            if(ev.key === 'Escape'){ ev.preventDefault(); closeSlashPalette(); return; }
        }
        if(ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing){ ev.preventDefault(); send(); }
    });

    /* 发送前的积分预估（老板 m03745：和画布 agent 一样，在发送键左边显示「约 x 积分」）
       画布那套是本地读单价表算的；这里没有单价表，直接问后端同一个估算接口，
       省得两边算法漂移。 */
    let creditTimer = 0, creditSeq = 0;
    function fmtCredits(n){
        const v = Number(n) || 0;
        if(!(v > 0)) return '';
        if(v >= 100) return String(Math.round(v));
        if(v >= 1) return String(Math.round(v * 10) / 10);
        return String(Math.round(v * 10000) / 10000);
    }
    function looksLikeImageRequest(text){
        return /(画|绘制|生成|出图|生图|图生图|参考图|头像|海报|壁纸|插画|修图|改图|编辑这张|gif|动图)/i.test(String(text || ''));
    }
    async function postEstimate(payload){
        const res = await fetch('/api/credits/estimate', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload), cache: 'no-store'
        });
        if(!res.ok) return { configured: false, credits: 0 };
        return res.json();
    }
    async function updateSendCredit(){
        const badge = $('xvSendCredit');
        if(!badge) return;
        const text = readInput();
        if(!text){ badge.hidden = true; badge.textContent = ''; return; }
        const seq = ++creditSeq;
        const wantImage = looksLikeImageRequest(text);
        let data;
        try {
            data = wantImage
                ? await postEstimate({ model: state.imgModel, provider: state.imgProvider, kind: 'image', count: 1 })
                : await postEstimate({ model: state.chatModel, provider: state.chatProvider, kind: 'llm', input_text: text });
            if(seq !== creditSeq) return;
            /* 生图模型没配单价时，退回去按对话 token 给个参考价 */
            if(wantImage && !data.configured){
                data = await postEstimate({ model: state.chatModel, provider: state.chatProvider, kind: 'llm', input_text: text });
                if(seq !== creditSeq) return;
            }
        } catch(e){ if(seq === creditSeq){ badge.hidden = true; } return; }
        const label = data && data.configured ? fmtCredits(data.credits) : '';
        badge.textContent = label ? (`约 ${label} 积分`) : '';
        badge.hidden = !badge.textContent;
    }
    function scheduleSendCredit(){
        clearTimeout(creditTimer);
        creditTimer = setTimeout(updateSendCredit, 300);
    }
    async function send(message, opts){
        const text = (message != null ? message : readInput()).trim();
        if(!text || state.sending) return;
        if(!state.chatProvider || !state.chatModel){ setHint('还没有可用的对话通道，先去 API 设置。'); return; }
        const rewindId = (opts && opts.rewindId) || state.rewindId || '';
        // /skill 命令：不管从 / 面板选还是手打，都把风格卡片挂起来（后端只负责注入 Skill 文本）
        if(/^\/skill\b/i.test(text)){
            const arg = text.replace(/^\/skill\s*/i, '').trim();
            if(!arg || /^(off|clear|exit|关闭)$/i.test(arg)) clearStyle(false);
            else activateStyleFromArg(arg);
        }
        const refs = inputRefs();
        state.sending = true;
        $('agentSendBtn').disabled = true;
        if(message == null) clearInput();
        state.rewindId = '';
        state.messages.push({ role:'user', content:text, attachments: refs });
        state.pending = true;
        renderThread();
        setHint('小抽AI 正在思考…', true);
        try {
            const payload = {
                message: text,
                conversation_id: state.convId || '',
                provider: state.chatProvider,
                model: state.chatModel,
                image_provider: state.imgProvider,
                image_model: state.imgModel,
                size: computeSize(),
                quality: state.params.quality || 'auto',
                reasoning_effort: (String(state.params.think || 'auto') !== 'auto') ? state.params.think : '',
                mode: 'agent',
                reference_images: [
                    ...((state.activeStyle && state.activeStyle.urls) || []).map((url, i) =>
                        ({ url, name: `${(state.activeStyle && state.activeStyle.name) || 'style'}-${i + 1}.png`, kind:'image' })),
                    ...refs.map(r => ({ url:r.url, name:r.name || '', kind:'image' }))
                ],
                rewind_message_id: rewindId
            };
            const res = await fetch('/api/chat/agent', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json().catch(() => ({}));
            if(!res.ok) throw new Error(data.detail || `请求失败（${res.status}）`);
            const conversation = data.conversation || {};
            state.convId = conversation.id || state.convId;
            if(state.convId) localStorage.setItem('xvai_conv_id', state.convId);
            state.messages = conversation.messages ? normalizeMessages(conversation.messages) : state.messages;
            renderThread();
            renderOutputs();
            if(data.credits) refreshBalance();
            setHint('');
        } catch(err) {
            state.messages.push({ role:'assistant', content:`出错了：${err.message || err}` });
            renderThread();
            setHint('');
        } finally {
            state.pending = false;
            state.sending = false;
            $('agentSendBtn').disabled = false;
            renderThread();
            if(document.getElementById('xvHist').classList.contains('open')) loadHistory();
        }
    }
    $('agentSendBtn').addEventListener('click', () => send());

    // 对话记录在后端（data/conversations/<user>/*.json），页面打开时按上次的 id 取回；
    // 换设备/清缓存就退化成"取最近一条有内容的对话"，保证刷新和重启都不丢。
    function normalizeMessages(list){
        return (list || []).filter(m => m && m.role && m.role !== 'system').map(m => ({
            id: m.id,
            role: m.role,
            content: m.content,
            model: m.model,
            image_urls: m.image_urls || (m.image_url ? [m.image_url] : []),
            attachments: m.attachments,
            tool_events: m.tool_events,
            credits: m.credits
        }));
    }
    async function loadConversationById(id){
        if(!id) return false;
        try {
            const res = await fetch('/api/conversations/' + encodeURIComponent(id), { cache:'no-store' });
            if(!res.ok) return false;
            const data = await res.json();
            const conv = data.conversation || {};
            state.convId = conv.id || id;
            localStorage.setItem('xvai_conv_id', state.convId);
            state.messages = normalizeMessages(conv.messages);
            renderThread();
            renderOutputs();
            return true;
        } catch(e) { return false; }
    }
    async function restoreConversation(){
        if(state.messages.length) return;
        if(await loadConversationById(state.convId)) return;
        state.convId = '';
        localStorage.removeItem('xvai_conv_id');
        try {
            const res = await fetch('/api/conversations', { cache:'no-store' });
            const data = await res.json();
            const list = (data.conversations || []).filter(c => c && c.id)
                .sort((a, b) => (b.updated_at || 0) - (a.updated_at || 0));
            for(const item of list){
                if(await loadConversationById(item.id)) return;
            }
        } catch(e) {}
    }

    function resetChat(){
        state.rewindId = '';
        state.convId = '';
        state.messages = [];
        localStorage.removeItem('xvai_conv_id');
        clearInput();
        renderThread();
        renderOutputs();
        setHint('');
    }

    // ---------- 其他事件 ----------
    $('xvNew').addEventListener('click', resetChat);
    $('xvOutToggle').addEventListener('click', () => $('xvDrawer').classList.toggle('open'));
    $('xvOutClose').addEventListener('click', () => $('xvDrawer').classList.remove('open'));
    $('xvModalClose').addEventListener('click', closePreview);
    $('xvModal').addEventListener('click', ev => { if(ev.target === $('xvModal')) closePreview(); });
    document.addEventListener('keydown', ev => { if(ev.key === 'Escape'){ closePreview(); closePanels(); } });

    $('xvOutList').addEventListener('click', ev => {
        const btn = ev.target.closest('[data-xv-preview]');
        if(!btn) return;
        const item = state.outputs[Number(btn.dataset.xvPreview)];
        if(item) openPreview(item.url, item.name);
    });
    $('xvThread').addEventListener('click', ev => {
        const zoom = ev.target.closest('[data-xv-zoom]');
        if(zoom){ openPreview(zoom.dataset.xvZoom, fileName(zoom.dataset.xvZoom)); return; }
        // 回溯：点「编辑」把这条 user 消息（含附件）搬回输入栏，改完直接发送
        const editMsg = ev.target.closest('[data-xv-edit-msg]');
        if(editMsg){ beginEditMessage(Number(editMsg.dataset.xvEditMsg)); return; }
        const act = ev.target.closest('[data-xv-act]');
        if(act){
            if(act.dataset.xvAct === 'edit'){
                // 修改 = 打开在线生图那套参考图编辑面板（扩图/遮罩/视角/画笔），改完自动进参考图
                const card = ev.target.closest('.xv-img-card');
                const img = card && card.querySelector('img');
                openRefEditorForImage(img ? (img.dataset.xvZoom || img.src) : '');
            }
            if(act.dataset.xvAct === 'vary') send('以最新一张图为参考，生成 3 个不同方向的变体。');
            if(act.dataset.xvAct === 'reverse') send('反推最新一张图的中文提示词，只要提示词本身。');
            return;
        }
        const copy = ev.target.closest('[data-xv-copy]');
        if(copy){
            const msg = state.messages[Number(copy.dataset.xvCopy)];
            if(msg) navigator.clipboard?.writeText(String(msg.content || '')).catch(() => {});
            return;
        }
        const retry = ev.target.closest('[data-xv-retry]');
        if(retry){
            const idx = Number(retry.dataset.xvRetry);
            for(let i = idx - 1; i >= 0; i--){
                if(state.messages[i] && state.messages[i].role === 'user'){ send(state.messages[i].content); break; }
            }
        }
    });

    // ---------- 复用在线生图的参考图编辑面板（iframe + postMessage） ----------
    function openRefEditorForImage(url){
        if(!url) return;
        const layer = document.createElement('div');
        layer.className = 'xv-ref-edit-layer';
        const frameSrc = '/static/online.html?editor=1&src=' + encodeURIComponent(url);
        layer.innerHTML = `<div class="xv-ref-edit-frame">
            <button type="button" class="xv-ref-edit-close" aria-label="关闭">×</button>
            <iframe src="${frameSrc}" title="参考图编辑"></iframe>
        </div>`;
        document.body.appendChild(layer);
        const onMsg = ev => {
            const data = ev.data || {};
            if(data.type === 'xvai-ref-editor-closed'){ close(); return; }
            if(data.type !== 'xvai-ref-edited') return;
            close();
            if(!data.url) return;
            addRef({ url:data.url, name:'edited.png' });
            state.messages.push({ role:'assistant', content:'已把编辑结果放进参考图，可以直接说要把这块改成什么。', image_urls:[data.url] });
            renderThread();
            renderOutputs();
        };
        function close(){
            window.removeEventListener('message', onMsg);
            layer.remove();
        }
        layer.querySelector('.xv-ref-edit-close').addEventListener('click', close);
        layer.addEventListener('click', ev => { if(ev.target === layer) close(); });
        window.addEventListener('message', onMsg);
    }

    // ---------- 技能：已安装 / 市场 / 自建（装完立刻进系统提示词，不用重启） ----------
    let skillInstalled = [];
    let skillMarketRows = [];
    function openTextPreview(title, text){
        $('xvModalTitle').textContent = title;
        $('xvModalDownload').removeAttribute('href');
        $('xvModalDownload').removeAttribute('download');
        $('xvModalBody').innerHTML = `<pre>${esc(text || '（空）')}</pre>`;
        $('xvModal').classList.add('open');
    }
    function renderInstalledSkills(){
        const box = $('xvSkillInstalled');
        if(!skillInstalled.length){
            box.innerHTML = '<div class="xv-skill-item-sub">还没有安装 Skill。去「市场」挑一个，或在「新建」里写一个。</div>';
            return;
        }
        box.innerHTML = skillInstalled.map(s => `<div class="xv-skill-item">
            <div class="xv-skill-item-main">
                <span class="xv-skill-item-name">${esc(s.title || s.name || s.id)}</span>
                <span class="xv-skill-item-sub">${esc(s.summary || s.category || s.id)}</span>
            </div>
            <button type="button" data-skill-view="${esc(s.id)}">查看</button>
            <button type="button" data-skill-del="${esc(s.id)}">卸载</button>
        </div>`).join('');
    }
    async function loadInstalledSkills(){
        try {
            const res = await fetch('/api/skills/installed', { cache:'no-store' });
            const data = await res.json();
            skillInstalled = data.skills || [];
        } catch(e) { skillInstalled = []; }
        renderInstalledSkills();
    }
    function renderMarketRows(rows){
        const box = $('xvSkillMarketList');
        if(!rows.length){ box.innerHTML = '<div class="xv-skill-item-sub">没搜到，换个关键词试试。</div>'; return; }
        box.innerHTML = rows.slice(0, 40).map((r, i) => `<div class="xv-skill-item">
            <div class="xv-skill-item-main">
                <span class="xv-skill-item-name">${esc(r.title || r.name || r.id)}</span>
                <span class="xv-skill-item-sub">${esc(r.summary_zh || r.summary || r.repo || '')}</span>
            </div>
            ${r.installed ? '<button type="button" disabled>已装</button>' : `<button type="button" class="primary" data-skill-install="${i}">安装</button>`}
        </div>`).join('');
    }
    async function loadMarketSkills(q){
        const box = $('xvSkillMarketList');
        box.innerHTML = '<div class="xv-skill-item-sub">加载中…</div>';
        try {
            const url = q ? '/api/skills/search?q=' + encodeURIComponent(q) : '/api/skills/market';
            const res = await fetch(url, { cache:'no-store' });
            const data = await res.json();
            skillMarketRows = data.skills || [];
        } catch(e) {
            skillMarketRows = [];
            box.innerHTML = '<div class="xv-skill-item-sub">市场打不开，检查一下网络。</div>';
            return;
        }
        renderMarketRows(skillMarketRows);
    }
    async function installSkillRow(row){
        if(!row) return;
        setHint('正在安装 Skill…', true);
        try {
            const res = await fetch('/api/skills/install', {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ id: row.id, raw_url: row.raw_url || '', name: row.name || '',
                    title: row.title || '', summary: row.summary || '', repo: row.repo || '' })
            });
            const data = await res.json().catch(() => ({}));
            if(!res.ok) throw new Error(data.detail || `安装失败（${res.status}）`);
            skillInstalled = data.installed || skillInstalled;
            row.installed = true;
            renderInstalledSkills(); renderMarketRows(skillMarketRows);
            setHint(`已安装「${row.title || row.name || row.id}」，下一句起就会生效`);
        } catch(err){ setHint(err.message || '安装失败'); }
    }
    async function uninstallSkill(id){
        if(!id) return;
        if(!window.confirm('卸载这个 Skill？卸载后 Agent 就不再读它了。')) return;
        try {
            const res = await fetch('/api/skills/uninstall', {
                method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id })
            });
            const data = await res.json().catch(() => ({}));
            if(!res.ok) throw new Error(data.detail || `卸载失败（${res.status}）`);
            skillInstalled = data.installed || [];
            renderInstalledSkills();
            setHint('已卸载');
        } catch(err){ setHint(err.message || '卸载失败'); }
    }
    async function viewSkill(id){
        try {
            const res = await fetch('/api/skills/' + encodeURIComponent(id) + '/content', { cache:'no-store' });
            const data = await res.json();
            openTextPreview(id, data.content || '（这个 Skill 没有可读内容）');
        } catch(e){ setHint('读取 Skill 失败'); }
    }
    async function createSkillEditor(){
        const name = ($('xvSkillName').value || '').trim();
        const content = ($('xvSkillText').value || '').trim();
        if(!name){ setHint('先给这个 Skill 起个名字'); return; }
        if(!content){ setHint('Skill 内容不能为空'); return; }
        setHint('正在保存 Skill…', true);
        try {
            const res = await fetch('/api/skills/create', {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ name, content })
            });
            const data = await res.json().catch(() => ({}));
            if(!res.ok) throw new Error(data.detail || `保存失败（${res.status}）`);
            skillInstalled = data.installed || [];
            $('xvSkillText').value = '';
            renderInstalledSkills();
            setHint(`已保存并安装「${name}」，Agent 每轮都会读到它`);
        } catch(err){ setHint(err.message || '保存失败'); }
    }
    function bindSkillPanel(){
        $('agentSkillBtn').addEventListener('click', ev => {
            ev.stopPropagation();
            const panel = $('xvSkillPanel');
            const open = panel.hidden;
            closePanels(open ? panel : null);
            panel.hidden = !open;
            if(open) loadInstalledSkills();
        });
        $('xvSkillPanel').querySelectorAll('[data-skill-tab]').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.skillTab;
                $('xvSkillPanel').querySelectorAll('[data-skill-tab]')
                    .forEach(b => b.classList.toggle('active', b === btn));
                $('xvSkillInstalled').hidden = tab !== 'installed';
                $('xvSkillMarket').hidden = tab !== 'market';
                $('xvSkillCreate').hidden = tab !== 'create';
                if(tab === 'installed') loadInstalledSkills();
                if(tab === 'market' && !skillMarketRows.length) loadMarketSkills('');
            });
        });
        $('xvSkillInstalled').addEventListener('click', ev => {
            const view = ev.target.closest('[data-skill-view]');
            if(view){ viewSkill(view.dataset.skillView); return; }
            const del = ev.target.closest('[data-skill-del]');
            if(del) uninstallSkill(del.dataset.skillDel);
        });
        $('xvSkillMarketList').addEventListener('click', ev => {
            const ins = ev.target.closest('[data-skill-install]');
            if(ins) installSkillRow(skillMarketRows[Number(ins.dataset.skillInstall)]);
        });
        $('xvSkillSearchBtn').addEventListener('click', () => loadMarketSkills(($('xvSkillQuery').value || '').trim()));
        $('xvSkillQuery').addEventListener('keydown', ev => {
            if(ev.key === 'Enter'){ ev.preventDefault(); loadMarketSkills(($('xvSkillQuery').value || '').trim()); }
        });
        $('xvSkillCreateBtn').addEventListener('click', createSkillEditor);
    }


    window.addEventListener('studio-theme-change', () => icons());
    window.addEventListener('message', ev => {
        if(ev.data && ev.data.type === 'studio-theme'){
            const dark = ev.data.theme === 'dark';
            document.documentElement.classList.toggle('studio-theme-dark', dark);
            document.documentElement.classList.toggle('theme-dark', dark);
        }
    });

    bindSkillPanel();
    icons();
    syncInputEmpty();
    syncParamsLabel();
    renderThread();
    renderOutputs();
    let histItems = [];
    function fmtHistTime(ms){
        if(!ms) return '';
        const d = new Date(Number(ms));
        const pad = n => String(n).padStart(2, '0');
        return `${d.getMonth()+1}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    async function loadHistory(){
        try {
            const res = await fetch('/api/conversations', { cache:'no-store' });
            const data = await res.json().catch(() => ({}));
            histItems = (data.conversations || []).filter(c => c && c.id)
                .sort((a, b) => (b.updated_at || 0) - (a.updated_at || 0));
        } catch(e) { histItems = []; }
        renderHistory();
    }
    function renderHistory(){
        const box = document.getElementById('xvHistList');
        if(!box) return;
        if(!histItems.length){ box.innerHTML = '<div class="xv-hist-empty">还没有历史对话</div>'; return; }
        box.innerHTML = histItems.map(c => {
            const active = c.id === state.convId ? ' active' : '';
            const sub = c.last_message ? esc(c.last_message).slice(0, 60) : '';
            // 不把 id 拼进 onclick：id 里万一有引号就会串味，统一走事件委托
            return `<div class="xv-hist-item${active}">
                <button type="button" class="xv-hist-main" data-conv="${esc(c.id)}">
                    <span class="xv-hist-title">${esc(c.title || '新对话')}</span>
                    <span class="xv-hist-sub">${esc(fmtHistTime(c.updated_at))}${sub ? ' · ' + sub : ''}</span>
                </button>
                <button type="button" class="xv-hist-del" data-del-conv="${esc(c.id)}" title="删除这段对话"><i data-lucide="trash-2"></i></button>
            </div>`;
        }).join('');
        icons();
    }
    async function deleteConversation(id){
        if(!id) return;
        const item = histItems.find(c => c.id === id);
        const name = (item && item.title) || '这段对话';
        if(!window.confirm(`删除「${name}」？删了就找不回来了（画布/资产里的图不受影响）。`)) return;
        try {
            const res = await fetch('/api/conversations/' + encodeURIComponent(id), { method:'DELETE', cache:'no-store' });
            if(!res.ok) throw new Error(`删除失败（${res.status}）`);
        } catch(err){ window.alert(err.message || '删除失败'); return; }
        histItems = histItems.filter(c => c.id !== id);
        if(state.convId === id) resetChat();
        renderHistory();
    }
    document.getElementById('xvHistList').addEventListener('click', e => {
        const del = e.target.closest('[data-del-conv]');
        if(del){ e.stopPropagation(); deleteConversation(del.getAttribute('data-del-conv')); return; }
        const btn = e.target.closest('[data-conv]');
        if(btn) switchConversation(btn.getAttribute('data-conv'));
    });
    function openHistory(){
        document.getElementById('xvHistMask').classList.add('open');
        document.getElementById('xvHist').classList.add('open');
        loadHistory();
    }
    function closeHistory(){
        document.getElementById('xvHistMask').classList.remove('open');
        document.getElementById('xvHist').classList.remove('open');
    }
    async function switchConversation(id){
        if(!id) return;
        if(state.sending) return;
        await loadConversationById(id);
        renderHistory();
        closeHistory();
        setHint('');
    }
    document.getElementById('xvHistory').addEventListener('click', openHistory);
    document.addEventListener('keydown', e => { if(e.key === 'Escape') closeHistory(); });

    // 历史抽屉在 <body> 末尾，主脚本先于它解析 ⇒ 必须等 DOM 建好再绑
    document.addEventListener('DOMContentLoaded', () => {
        $('xvHistMask').addEventListener('click', closeHistory);
        $('xvHistClose').addEventListener('click', closeHistory);
    });

    (async () => { await loadProviders(); await restoreConversation(); refreshBalance(); })();
})();
</script>
