                    document.documentElement.classList.add('theme-dark');
                }

    <style>
        @import url('/static/vendor/css/fonts.css?v=1.3.7.1767196800');
        :root { --accent:#111827; --bg:#f9fafb; --card:#fff; --easing:cubic-bezier(0.4,0,0.2,1); }
        body { background:var(--bg); font-family:'Inter',-apple-system,sans-serif; color:var(--accent); -webkit-font-smoothing:antialiased; }
        .container-box { max-width:1280px; margin:0 auto; padding:0 40px; margin-top:50px; }
        .nano-input { background:var(--card); border:1px solid #eef0f2; transition:all .3s var(--easing); }
        .nano-input:focus { border-color:#000; box-shadow:0 0 0 1px #000; }
        .upload-item { background:var(--card); border:1px dashed #e2e8f0; transition:all .4s var(--easing); position:relative; overflow:hidden; }
        .upload-item:hover,.upload-item.drag-over { border-color:#000; transform:translateY(-2px); }
        .preview-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; animation:fadeIn .5s var(--easing); }
        /* 遮罩预览是「涂过=半透明红、没涂=透明」的叠加层，天然不透明（alpha 在图里），不用 fadeIn */
        .preview-img.ref-mask { animation:none; }
        .glass-btn { background:#111827; transition:all .3s var(--easing); }
        .glass-btn:hover { background:#000; transform:translateY(-1px); box-shadow:0 12px 24px rgba(0,0,0,.1); }
        .result-frame { background:#fff; border-radius:32px; border:1px solid #f1f5f9; box-shadow:0 2px 15px rgba(0,0,0,.02); }
        .tool-panel { background:#fff; border:1px solid #edf0f3; border-radius:24px; padding:12px; display:flex; flex-direction:column; gap:10px; }
        .model-pill { background:#f8fafc; border:1px solid #edf2f7; border-radius:999px; padding:3px; display:grid; grid-template-columns:1fr 1fr; gap:2px; }
        .model-option { border-radius:999px; height:34px; display:flex; align-items:center; justify-content:center; gap:6px; color:#64748b; font-size:10px; font-weight:600; letter-spacing:.02em; transition:all .25s var(--easing); }
        .model-option.active { background:#fff; color:#111827; box-shadow:0 1px 3px rgba(15,23,42,.08); }
        .control-panel { background:#fff; border:1px solid #edf0f3; border-radius:24px; padding:12px; display:flex; flex-direction:column; gap:10px; }
        .control-label { display:flex; align-items:center; gap:6px; color:#94a3b8; font-size:10px; font-weight:600; letter-spacing:.04em; }
        .size-row { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; align-items:start; }
        .size-field { min-width:0; display:flex; flex-direction:column; gap:6px; }
        .size-select,.size-custom { width:100%; min-width:0; max-width:100%; height:34px; border:1px solid #edf2f7; border-radius:14px; background:#f8fafc; color:#111827; outline:none; padding:0 10px; font-size:11px; font-weight:700; }
        .size-select { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .size-select:disabled { opacity:.55; cursor:not-allowed; }
        .size-custom { display:none; background:#fff; }
        .size-field.custom .size-custom { display:block; }
        .size-pair { display:none; grid-template-columns:1fr 1fr; gap:6px; }
        .size-field.custom .size-pair { display:grid; }
        .size-pair .size-custom { display:block; }
        .size-pair.with-fit { grid-template-columns:1fr 1fr auto; align-items:center; }
        .size-fit-btn { height:34px; border:1px solid #edf2f7; border-radius:14px; background:#fff; color:#111827; padding:0 10px; font-size:10px; font-weight:800; white-space:nowrap; }
        .size-fit-btn:disabled { opacity:.45; cursor:not-allowed; }
        .mode-badge { font-size:9px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:#0f172a; background:#eef2ff; border:1px solid #e0e7ff; padding:2px 8px; border-radius:999px; }
        .masonry-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:20px; }
        @media (min-width:768px){ .masonry-grid{ grid-template-columns:repeat(4,1fr); } }
        @media (max-width:640px){ .size-row{ grid-template-columns:1fr; } }
        .masonry-item { aspect-ratio:1/1; border-radius:24px; overflow:hidden; background:#fff; border:1px solid #f1f5f9; transition:all .5s var(--easing); }
        .masonry-item:hover { transform:translateY(-6px); box-shadow:0 20px 40px rgba(0,0,0,.08); }
        .gallery-lightbox { background:rgba(255,255,255,.99); backdrop-filter:blur(22px) saturate(1.05); }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    </style>

    <link rel="stylesheet" href="/static/css/liquid-glass.css?v=1.3.7.1793776698">
    <style>
        /* ── 参考图工具（扩图 / 遮罩 / 视角 / 画笔）与风格选择 2026-11-09 ── */
        .ref-tools{position:absolute;left:6px;right:6px;bottom:6px;display:flex;gap:4px;justify-content:center;z-index:12;opacity:1;transition:opacity .2s var(--easing)}
        .upload-item:hover .ref-tools,.upload-item:focus-within .ref-tools{opacity:1}
        .ref-tools button{width:26px;height:26px;border-radius:999px;background:rgba(17,24,39,.82);color:#fff;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer}
        .ref-tools button:hover{background:#000}
        .ref-tools button svg{width:13px;height:13px}
        .ref-badge{position:absolute;top:6px;left:6px;z-index:12;background:#111827;color:#fff;font-size:9px;font-weight:800;letter-spacing:.04em;padding:2px 7px;border-radius:999px}
        /* 遮罩预览：涂过的地方泛红、原图仍然看得见。用半透明彩色 mask 图（白=红/黑=透明），
           不依赖 mask-image —— 后者在部分环境里整个遮罩层会退化成实心矩形，直接盖死原图。 */
        /* 层级：预览图 < 红色叠加(6) < 删除按钮(10) / 工具条，叠加层不能挡住按钮 */
        .ref-mask{position:absolute;inset:0;z-index:6;width:100%;height:100%;object-fit:cover;pointer-events:none;border-radius:inherit}
        .re-cursor{position:fixed;z-index:90;border:1px solid rgba(0,0,0,.8);box-shadow:0 0 0 1px rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.6);border-radius:50%;pointer-events:none;display:none;margin:0;box-sizing:border-box}
        /* 桥接（小抽AI「修改」）时只显示编辑弹窗，页面本体全隐藏 */
        body.re-solo > *{visibility:hidden}
        body.re-solo #refEditModal{visibility:visible}
        body.re-solo{background:#0b0f14}
        /* theme.js 的全局 UI 缩放会给 body 加 transform:scale，fixed 弹窗跟着缩、顶部还留一条黑边；
           桥接模式是整窗编辑器，这里必须把缩放彻底关掉 */
        html.studio-ui-scaled body.re-solo.re-solo{transform:none !important;width:100% !important;min-height:100vh !important;height:100vh !important;margin:0 !important;overflow:hidden !important}
        body.re-solo #refEditModal{position:fixed;inset:0;width:100vw;height:100vh}
        /* 桥接时整窗就是编辑器：面板占满，不再留深色底 */
        body.re-solo .re-overlay{padding:0;background:#fff;backdrop-filter:none}
        body.re-solo .re-panel{width:100%;max-width:none;height:100%;max-height:none;border-radius:0;box-shadow:none}
        body.re-solo .re-stage{flex:1 1 auto;min-height:0;max-height:none;margin:0 22px 8px}
        body.re-solo .re-head{border-bottom:1px solid #eef2f7}

        body.re-open{transform:none !important;width:100% !important;min-height:100vh !important}
        .re-overlay{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px}
        .re-panel{background:#fff;border-radius:26px;width:min(920px,96vw);max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(15,23,42,.28)}
        .re-head{display:flex;align-items:flex-start;gap:12px;padding:18px 22px 10px}
        .re-head h3{font-size:15px;font-weight:800;margin:0}
        .re-head p{margin:2px 0 0;font-size:11px;color:#94a3b8}
        .re-head .re-close{margin-left:auto;width:30px;height:30px;border-radius:999px;border:1px solid #eef2f7;background:#fff;color:#64748b;cursor:pointer}
        .re-tabs{display:flex;gap:6px;padding:0 22px 10px;flex-wrap:wrap}
        .re-tabs button{height:30px;padding:0 12px;border-radius:999px;border:1px solid #eef2f7;background:#f8fafc;color:#64748b;font-size:11px;font-weight:700;cursor:pointer}
        .re-tabs button.active{background:#111827;border-color:#111827;color:#fff}
        /* flex 纵向容器里 width:auto 会被内容撑窄（视角卡片就居中缩成一小块），所以按容器宽 100% */
        .re-stage{position:relative;flex:0 0 auto;width:100%;box-sizing:border-box;min-height:240px;max-height:min(62vh,640px);background:#f1f5f9;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:0 22px;border-radius:18px}
        .re-stage.empty::after{content:'正在载入图片…';font-size:12px;color:#94a3b8}
        .re-stage.loaded{aspect-ratio:var(--re-ratio,1)}
        /* 位置由 layoutRefCanvases 写 left/top（px），这里只保留 box-sizing，避免与 CSS 的 50% 冲突 */
        .re-stage canvas{position:absolute;box-sizing:border-box;touch-action:none}
        /* 扩图：整块舞台就是扩展后的画布，原图能在里面自由拖动；边框 + 五条手柄与画布一致 */
        .re-outpaint-frame{position:absolute;inset:0;z-index:4;display:none;border:2px solid #f8fafc;border-radius:14px;box-shadow:0 0 0 1px rgba(15,23,42,.28),0 12px 30px rgba(15,23,42,.16);pointer-events:auto}
        .re-stage.re-mode-outpaint .re-outpaint-frame{display:block;cursor:move}
        .re-stage.re-mode-outpaint .re-outpaint-frame{pointer-events:none}
        .re-stage.re-mode-outpaint .re-oh{pointer-events:auto}
        .re-stage.re-mode-outpaint #reCanvas,.re-stage.re-mode-outpaint #rePaint{pointer-events:auto;cursor:move}
        .re-oh{position:absolute;z-index:6;background:#fff;border:2px solid #f8fafc;box-shadow:0 3px 12px rgba(15,23,42,.24)}
        .re-oh[data-re-oh="top"],.re-oh[data-re-oh="bottom"]{left:50%;width:34px;height:10px;margin-left:-17px;border-radius:999px;cursor:ns-resize}
        .re-oh[data-re-oh="top"]{top:-6px}
        .re-oh[data-re-oh="bottom"]{bottom:-6px}
        .re-oh[data-re-oh="left"],.re-oh[data-re-oh="right"]{top:50%;width:10px;height:34px;margin-top:-17px;border-radius:999px;cursor:ew-resize}
        .re-oh[data-re-oh="left"]{left:-6px}
        .re-oh[data-re-oh="right"]{right:-6px}
        .re-oh[data-re-oh="corner"]{right:-8px;bottom:-8px;width:18px;height:18px;border-radius:999px;cursor:nwse-resize}
        /* 视角：3D 卡片（正面受光 / 背面背光），图片跟着机位转 */
        .re-angle-card{position:absolute;inset:0;z-index:4;display:none;align-items:center;justify-content:center;perspective:1400px;pointer-events:none}
        .re-stage.re-mode-angle .re-angle-card{display:flex}
        /* 🚨 舞台 flex 居中 + .re-angle-card 是 absolute 的，两者一叠加卡片会多偏一次；
           卡片位置只由 syncRefAngleCardSize() 的像素值决定，外层必须回到 left:0;top:0 */
        .re-stage.re-mode-angle .re-angle-card{left:0;top:0;width:100%;height:100%;display:block}
        .re-stage:not(.re-mode-angle) #reAngleCard{display:none}
        .re-stage.re-mode-angle{cursor:ew-resize;background:linear-gradient(160deg,#eef2f7,#dde5ef)}
        /* 🚨 视角模式要先把舞台撑开：舞台按图片比例收缩时只剩一条缝，卡片会被 overflow:hidden 裁掉一半 */
        .re-stage.re-mode-angle{flex:1 1 auto;min-height:min(48vh,420px);aspect-ratio:auto!important}
        .re-text{pointer-events:auto}
        .re-stage.re-mode-angle .re-outpaint-frame{display:none}
        .re-ac-card[data-face="front"] .re-ac-back{display:none}
        .re-ac-card[data-face="back"] .re-ac-front{display:none}
        .re-ac-card{position:relative;transform-style:preserve-3d;transform-origin:center center;transition:transform .1s linear;will-change:transform}
        .re-ac-face{position:absolute;inset:0;border-radius:12px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 18px 40px rgba(15,23,42,.28)}
        .re-ac-face img{width:100%;height:100%;object-fit:cover;display:block}
        .re-ac-edge{position:absolute;top:0;width:9px;height:100%;border-radius:3px;background-image:var(--re-card-img,none);background-size:cover;background-position:center;filter:brightness(.72) saturate(.75);box-shadow:inset 0 0 0 1px rgba(15,23,42,.45)}
        .re-ac-edge.edge-left{left:0;transform-origin:left center;transform:rotateY(-90deg)}
        .re-ac-edge.edge-right{right:0;transform-origin:right center;transform:rotateY(90deg)}
        .re-ac-back img{filter:brightness(.62) saturate(.7)}
        .re-ac-shade{position:absolute;inset:0;background:linear-gradient(160deg,rgba(15,23,42,.30),rgba(15,23,42,.52));mix-blend-mode:multiply}
        .re-ac-sheen{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--sheen-x,50%) var(--sheen-y,36%),rgba(255,255,255,.55),rgba(255,255,255,.12) 38%,rgba(255,255,255,0) 68%);opacity:.9}
        .re-angle-badge{position:absolute;top:12px;left:12px;z-index:6;display:none;align-items:center;height:26px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:800;border:1px solid #eef2f7;background:rgba(255,255,255,.92);color:#111827;box-shadow:0 10px 24px rgba(15,23,42,.16);pointer-events:none}
        .re-stage.re-mode-angle .re-angle-badge{display:flex}
        .re-angle-badge.back{background:#111827;color:#fff;border-color:#111827;border-style:dashed}
        .re-angle-bar{display:flex;flex-direction:column;gap:7px;min-width:0;flex:1 1 100%}
        .re-angle-row{display:flex;align-items:center;gap:8px;min-width:0}
        .re-angle-label{flex:0 0 26px;font-size:11px;font-weight:800;color:#64748b}
        .re-angle-range{flex:1 1 auto;min-width:0;height:18px;accent-color:#111827;cursor:pointer}
        .re-angle-value{flex:0 0 auto;min-width:52px;text-align:right;font-size:11px;font-weight:800;color:#111827;white-space:nowrap}
        .re-angle-scale{display:flex;justify-content:space-between;padding:0 30px 0 34px;margin:-2px 0 2px}
        .re-angle-scale span{font-size:9.5px;font-weight:700;color:#94a3b8}
        .re-angle-scale span:nth-child(1),.re-angle-scale span:nth-child(5){color:#111827}
        .re-angle-deg{margin-left:auto;font-size:11px;font-weight:800;color:#64748b;white-space:nowrap}
        .re-angle-presets{display:flex;flex-wrap:wrap;gap:4px}
        .re-angle-presets button{height:22px;padding:0 8px;border-radius:999px;border:1px solid #eef2f7;background:#f8fafc;color:#64748b;font-size:10.5px;font-weight:800;cursor:pointer;white-space:nowrap}
        .re-angle-presets button.active{background:#111827;border-color:#111827;color:#fff}
        .re-angle-text{flex:1 1 100%;min-height:108px;resize:none;font-size:11px;color:#334155;background:#f8fafc;border:1px solid #eef2f7;border-radius:12px;padding:9px 11px;line-height:1.6;font-weight:600;outline:none}
        #rePaint{cursor:crosshair}
        .re-tools{padding:12px 22px 0;display:flex;gap:10px;flex-wrap:nowrap;align-items:center}
        /* 工具行永远一行：不换行，滑杆吃掉剩余宽度，实在不够再横向滚动，绝不折成两行 */
        .re-tool{display:flex;gap:8px;flex-wrap:nowrap;align-items:center;font-size:11px;color:#64748b;flex:1 1 100%;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
        .re-tool::-webkit-scrollbar{height:0}
        .re-tool > span{white-space:nowrap;flex:0 0 auto}
        .re-tool .re-tip{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
        .re-tool input[type="range"]{width:auto;flex:1 1 70px;min-width:60px;max-width:140px}
        .re-tool.hidden{display:none}
        .re-tool input[type="range"]{width:120px;accent-color:#111827}
        .re-tool input[type="color"]{width:30px;height:28px;padding:0;border:1px solid #eef2f7;border-radius:8px;background:#fff}
        .re-chips{display:inline-flex;gap:4px;flex-wrap:nowrap;flex:0 0 auto}
        .re-tool input[type="color"]{flex:0 0 auto;width:30px;min-width:30px}
        /* 窄屏（竖屏手机）再压一轮间距/内边距，保证一行能完整放下 */
        @media (max-width:560px){
            .re-tool{gap:5px;font-size:10px}
            .re-tool .re-chip{padding:0 7px;font-size:10px}
            .re-tool .re-btn{padding:0 7px}
            .re-tool .re-btn span{display:none}
            .re-tool .re-tip{display:none}
            .re-tool input[type="color"]{width:26px;min-width:26px}
            .re-tool input[type="range"]{flex:1 1 40px;min-width:40px}
        }
        .re-sep{width:1px;height:18px;background:#eef2f7}
        .re-tip{font-size:10.5px;color:#94a3b8}
        .re-btn{height:28px;padding:0 10px;border-radius:999px;border:1px solid #eef2f7;background:#f8fafc;font-size:11px;font-weight:700;color:#475569;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
        .re-btn i,.re-btn svg{width:14px;height:14px}
        .re-btn.active{background:#111827;border-color:#111827;color:#fff}
        .re-chip{height:28px;min-height:28px;padding:0 10px;border-radius:999px;border:1px solid #eef2f7;background:#f8fafc;font-size:11px;font-weight:700;color:#475569;cursor:pointer;display:inline-flex;flex-direction:row !important;align-items:center;gap:5px;white-space:nowrap;flex:0 0 auto;overflow:hidden}.re-chip svg,.re-chip i{width:14px;height:14px;flex:0 0 auto;display:inline-block}.re-chip span{white-space:nowrap;flex:0 0 auto;display:inline-block}
        .re-chip.active{background:#111827;border-color:#111827;color:#fff}
        .re-foot{display:flex;align-items:center;gap:10px;padding:14px 22px 18px}
        .re-foot .re-hint{font-size:11px;color:#94a3b8;flex:1}
        .re-foot button{height:36px;padding:0 16px;border-radius:999px;border:1px solid #eef2f7;background:#fff;font-size:12px;font-weight:700;color:#334155;cursor:pointer}
        .re-foot button.primary{background:#111827;border-color:#111827;color:#fff}
        .re-text-item{position:absolute;z-index:8;padding:2px 4px;border-radius:6px;cursor:move;white-space:pre;font-weight:800;line-height:1.25;outline:none;text-shadow:0 1px 3px rgba(15,23,42,.35);pointer-events:auto}
        .re-text-item[contenteditable="true"]{background:rgba(255,255,255,.92);text-shadow:none;box-shadow:0 0 0 1px #111827}
        .re-seg{display:flex;gap:4px;padding:3px;border-radius:11px;background:#fff;border:1px solid #eef2f7}
        .re-seg button{height:24px;padding:0 10px;border-radius:8px;font-size:11px;font-weight:800;color:#64748b;background:transparent;cursor:pointer;border:0}
        .re-seg button.active{background:#111827;color:#fff}
        .re-toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,12px);z-index:2147483000;max-width:min(560px,86vw);padding:10px 16px;border-radius:999px;background:rgba(17,24,39,.94);color:#fff;font-size:12px;font-weight:700;line-height:1.5;text-align:center;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease}

    <script>
        window.addEventListener('error', e => { document.title = 'JSEERR=' + e.message + ' @' + (e.filename||'') + ':' + (e.lineno||0); });
        lucide.createIcons();
        function tr(key){ return window.StudioI18n ? StudioI18n.t(key) : key; }
        function applyLanguage(lang){
            if(lang && window.StudioI18n) StudioI18n.set(lang);
            document.title = tr('online.title');
            const loader = document.getElementById('loadMoreTrigger');
            if(loader && !isLoading) loader.innerText = tr('online.loadMore');
        }
        window.addEventListener('message', event => {
            if(event.data?.type === 'studio-lang') applyLanguage(event.data.lang);
            // API 设置页通过 postMessage 通知平台/模型变更（iframe 内嵌场景）
            if(event.data?.type === 'providers-changed' || event.data?.type === 'workflows-changed') scheduleProviderRefresh();
        });
        window.addEventListener('studio-lang-change', () => {
            document.title = tr('online.title');
            updateAdaptivePanel();
        });
        let refs = {1:null,2:null,3:null};
        let refDims = {1:null,2:null,3:null};
        let provider = 'comfly';
        let selectedModel = 'gpt-image-2';
        let apiProviders = [];
        let ratio = 'square';
        let resolution = '1k';
        let customRatioWidth = '';

        const PAGE_SIZE = 24;

        function uniqueModels(list){
            const seen = new Set();
            return (list || []).map(item => String(item || '').trim()).filter(item => item && !seen.has(item) && seen.add(item));
        }
        function imageProviders(){
            const list = (apiProviders || []).filter(p => {
                if(p.enabled === false) return false;
                if(p.id === 'modelscope') return false;
                if(p.id === 'runninghub' && !p.has_key && !p.has_wallet_key) return false;
                return (p.image_models || []).length || (p.rh_apps || []).length || (p.rh_workflows || []).length;
            });
            return list.length ? list : [{id:'comfly', name:'Comfly', image_models:[models.gpt, models.nano]}];
        }
        function providerById(id){
            return imageProviders().find(p => p.id === id) || imageProviders()[0];
        }
        function providerModels(id){
            return uniqueModels(providerById(id)?.image_models || [models.gpt]);
        }
        /* ---- RunningHub：同一平台下同步模型 API / 工作流 / AI 应用。
         * 模型 API 直接提交原始模型名；value=app:ID / workflow:ID 走 RH 应用/工作流路径。 */
        function runningHubEntryId(entry, kind){
            if(!entry || typeof entry !== 'object') return '';
            const raw = kind === 'model' ? (entry.model || entry.id || entry.name)
                : kind === 'workflow' ? (entry.workflowId || entry.id)
                : (entry.appId || entry.webappId || entry.id);
            return String(raw || '').trim();
        }
        function runningHubEntries(id){
            const p = providerById(id) || {};
            const collect = (list, kind) => (list || [])
                .filter(e => e && e.enabled !== false && e.hidden !== true)
                .map(e => ({ kind, id: runningHubEntryId(e, kind), title: String(e.title || e.note || '').trim() }))
                .filter(e => e.id);
            const models = uniqueModels(p.image_models || []).map(model => ({kind:'model', id:model, title:model}));
            return [...models, ...collect(p.rh_workflows, 'workflow'), ...collect(p.rh_apps, 'app')];
        }
        function isRunningHubProvider(id){ return providerProtocol(id) === 'runninghub'; }
        function isGrsaiNanoModel(model = selectedModel){
            return String(model || '').trim().toLowerCase() === 'nano-banana-pro';
        }
        function updateModelSpecificControls(){
            const autoOption = document.getElementById('grsaiAutoRatioOption');
            if(!autoOption) return;
            const visible = isGrsaiNanoModel();
            autoOption.hidden = !visible;
            if(!visible && ratio === 'auto') ratio = 'square';
            if(visible && ratio === '') ratio = 'auto';
        }
        function renderProviderControls(){
            const providerSelect = document.getElementById('providerSelect');
            const modelSelect = document.getElementById('modelSelect');
            const providers = imageProviders();
            if(!providers.some(p => p.id === provider)) provider = providers[0]?.id || 'comfly';
            providerSelect.innerHTML = providers.map(p => `<option value="${escapeHtml(p.id)}" ${p.id === provider ? 'selected' : ''}>${escapeHtml(p.name || p.id)}</option>`).join('');
            if(isRunningHubProvider(provider)){
                const entries = runningHubEntries(provider);
                const keys = entries.map(e => e.kind === 'model' ? e.id : `${e.kind}:${e.id}`);
                if(!keys.includes(selectedModel)) selectedModel = keys[0] || '';
                modelSelect.innerHTML = entries.length
                    ? entries.map(e => {
                        const key = e.kind === 'model' ? e.id : `${e.kind}:${e.id}`;
                        const tag = e.kind === 'model' ? '模型 API' : e.kind === 'workflow' ? tr('online.rhWorkflow') : tr('online.rhApp');
                        const label = e.title || e.id;
                        return `<option value="${escapeHtml(key)}" ${key === selectedModel ? 'selected' : ''}>${escapeHtml(`[${tag}] ${label}`)}</option>`;
                    }).join('')
                    : `<option value="">${escapeHtml(tr('online.rhNoEntries'))}</option>`;
            } else {
                const modelsForProvider = providerModels(provider);
                if(!modelsForProvider.includes(selectedModel)) selectedModel = modelsForProvider[0] || models.gpt;
                modelSelect.innerHTML = modelsForProvider.map(m => `<option value="${escapeHtml(m)}" ${m === selectedModel ? 'selected' : ''}>${escapeHtml(m)}</option>`).join('');
            }
            updateModelSpecificControls();
            updateAdaptivePanel();
        }

        /* ---- 协议自适应：根据所选 provider 的 protocol 调整参数栏 ----
         * 后端 /api/online-image → generate_ai_image 已按协议分发，前端只需让
         * 与协议无关的控件随之显隐：质量仅 OpenAI 系（gpt-image）生效，其余协议忽略。 */
        function providerProtocol(id){
            const p = providerById(id) || {};
            const proto = String(p.protocol || '').toLowerCase();
            const pid = String(p.id || '').toLowerCase();
            const base = String(p.base_url || '').toLowerCase();
            if(proto === 'modelscope' || pid === 'modelscope') return 'modelscope';
            if(proto === 'runninghub' || pid === 'runninghub') return 'runninghub';
            if(proto === 'jimeng' || pid === 'jimeng') return 'jimeng';
            if(proto === 'volcengine' || pid === 'volcengine') return 'volcengine';
            if(proto === 'gemini') return 'gemini';
            if(proto === 'apimart' || base.includes('apimart.ai')) return 'apimart';
            return 'api';
        }
        const PROTOCOL_BADGE = {
            api:'online.modeApi', apimart:'online.modeApi', modelscope:'online.modeModelscope',
            runninghub:'online.modeRunningHub', jimeng:'online.modeJimeng',
            volcengine:'online.modeVolcengine', gemini:'online.modeGemini'
        };
        // 仅 OpenAI / APIMart（gpt-image 系）后端会消费 quality；其它协议忽略，隐藏以免误导。
        const QUALITY_PROTOCOLS = new Set(['api','apimart']);
        function updateAdaptivePanel(){
            const proto = providerProtocol(provider);
            const badge = document.getElementById('providerModeBadge');
            if(badge){
                badge.textContent = tr(PROTOCOL_BADGE[proto] || 'online.modeApi');
                badge.style.display = '';
            }
            const qf = document.getElementById('qualityField');
            if(qf) qf.style.display = QUALITY_PROTOCOLS.has(proto) ? '' : 'none';
            const qs = document.getElementById('qualitySelect');
            if(qs) qs.value = quality;
            // RunningHub 每次出图都是一次完整工作流运行，隐藏数量并固定为 1，避免误触发多次昂贵任务。
            if(proto === 'runninghub') outputCount = 1;
            const cf = document.getElementById('countField');
            if(cf) cf.style.display = (proto === 'runninghub') ? 'none' : '';
            const cs = document.getElementById('countSelect');
            if(cs) cs.value = String(outputCount);
            refreshCreditBadge();
        }
        function setQuality(next){ quality = next || 'auto'; }
        function setCount(next){ outputCount = Math.max(1, Math.min(4, parseInt(next, 10) || 1)); refreshCreditBadge(); }

        // ── 生成按钮上的积分估算（真实单价来自 API 设置 → 模型积分额度）
        let creditBadgeUpdate = null;
        function refreshCreditBadge(){
            if(!window.icCredits) return;
            const btn = document.getElementById('genBtn');
            if(!btn) return;
            if(!creditBadgeUpdate){
                creditBadgeUpdate = window.icCredits.mount(btn, () => ({
                    model: selectedModel,
                    provider: provider,
                    kind: 'image',
                    count: outputCount
                }));
            } else {
                creditBadgeUpdate();
            }
        }
        try {
            if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', refreshCreditBadge);
            else setTimeout(refreshCreditBadge, 0);
        } catch(e) {}

        async function initModels(){
            try {
                const cfg = await fetch('/api/config').then(r=>r.json());
                const imageModels = cfg.image_models || [];
                models.nano = imageModels.find(m => m.toLowerCase().includes('nano')) || 'nano-banana-pro';
                models.gpt = imageModels.find(m => !m.toLowerCase().includes('nano')) || cfg.image_model || 'gpt-image-2';
                apiProviders = Array.isArray(cfg.api_providers) ? cfg.api_providers : [];
                selectedModel = providerModels(provider)[0] || models.gpt;
            } catch(e) {}
            renderProviderControls();
        }
        // API 设置页保存后会广播 studio-api 事件；这里重新拉取 /api/config，
        // 尽量保留当前已选的平台/模型，renderProviderControls 会在其不存在时自动回退。
        async function refreshProvidersFromApiSettings(){
            try {
                const cfg = await fetch('/api/config').then(r=>r.json());
                const imageModels = cfg.image_models || [];
                models.nano = imageModels.find(m => m.toLowerCase().includes('nano')) || 'nano-banana-pro';
                models.gpt = imageModels.find(m => !m.toLowerCase().includes('nano')) || cfg.image_model || 'gpt-image-2';
                apiProviders = Array.isArray(cfg.api_providers) ? cfg.api_providers : [];
            } catch(e) { return; }
            renderProviderControls();
        }
        let apiSyncTimer = null;
        function scheduleProviderRefresh(){
            clearTimeout(apiSyncTimer);
            apiSyncTimer = setTimeout(refreshProvidersFromApiSettings, 150);

        try {
            const studioApiChannel = new BroadcastChannel('studio-api');
            studioApiChannel.addEventListener('message', () => scheduleProviderRefresh());
        } catch(e) {}
        // 页面重新可见时也兜底刷新一次（切回标签页 / iframe 重新展示）
        document.addEventListener('visibilitychange', () => { if(!document.hidden) scheduleProviderRefresh(); });

        function setProvider(next){
            provider = next;
            selectedModel = providerModels(provider)[0] || selectedModel;
            renderProviderControls();
            refreshCreditBadge();
        }
        function setModel(next){
            selectedModel = next;
            updateModelSpecificControls();
            updateSizeUI();
            refreshCreditBadge();
        }
        function escapeHtml(str){ return String(str || '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }

        function parseSizeValue(value){
            const match = String(value || '').trim().match(/^(\d+)\s*[xX*]\s*(\d+)$/);
            return match ? {width:match[1], height:match[2]} : null;
        }
        function customRatioValue(){
            const w = Number(customRatioWidth);
            const h = Number(customRatioHeight);
            return w > 0 && h > 0 ? w / h : null;
        }
        function customSizeValue(){
            const w = Number(customWidth);
            const h = Number(customHeight);
            return w > 0 && h > 0 ? `${Math.round(w)}x${Math.round(h)}` : '';
        }
        function getImageDimensions(src){
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve({width:img.naturalWidth, height:img.naturalHeight});
                img.onerror = reject;
                img.src = src;
            });
        }
        function firstReferenceDimension(){
            return [1,2,3].map(id => refDims[id]).find(dim => dim?.width && dim?.height) || null;
        }

        function setRatio(next, preferredSize = ''){
            if(next === 'auto' && !isGrsaiNanoModel()) next = 'square';
            ratio = next;
            if (preferredSize) {
                const match = SIZE_OPTIONS[next]?.find(([value]) => value === preferredSize);
                if (match) resolution = match[1];
            }
            if(next !== 'custom') {
                customRatioWidth = '';
                customRatioHeight = '';
            }
            updateSizeUI();
        }

        function setCustomRatio(){
            customRatioWidth = document.getElementById('ratioCustomWidth').value;
            customRatioHeight = document.getElementById('ratioCustomHeight').value;
            ratio = 'custom';
            updateSizeUI();
        }

        function setCustomSize(){
            customWidth = document.getElementById('sizeCustomWidth').value;
            customHeight = document.getElementById('sizeCustomHeight').value;

        function updateSizeUI(){
            const ratioSelect = document.getElementById('ratioSelect');
            const ratioField = document.getElementById('ratioField');
            updateModelSpecificControls();
            const ratioCustomWidthInput = document.getElementById('ratioCustomWidth');
            const ratioCustomHeightInput = document.getElementById('ratioCustomHeight');
            const resolutionSelect = document.getElementById('resolutionSelect');
            const resolutionField = document.getElementById('resolutionField');
            const sizeCustomWidthInput = document.getElementById('sizeCustomWidth');
            const sizeCustomHeightInput = document.getElementById('sizeCustomHeight');
            const fitImageSizeBtn = document.getElementById('fitImageSizeBtn');
            ratioSelect.value = ratio;
            ratioSelect.disabled = resolution === 'custom';
            ratioField.classList.toggle('custom', ratio === 'custom');
            ratioCustomWidthInput.value = customRatioWidth;
            ratioCustomHeightInput.value = customRatioHeight;
            resolutionSelect.value = resolution;
            resolutionField.classList.toggle('custom', resolution === 'custom');
            sizeCustomWidthInput.value = customWidth;
            sizeCustomHeightInput.value = customHeight;
            if(fitImageSizeBtn) fitImageSizeBtn.disabled = !firstReferenceDimension();
            updateResolutionUI();
        }

        function updateResolutionUI(){}
        function fitCustomSizeToImage(event){
            if(event) event.preventDefault();
            const dim = firstReferenceDimension();
            if(!dim) return;
            resolution = 'custom';
            ratio = '';
            customWidth = dim.width;
            customHeight = dim.height;
            updateSizeUI();
        }

        function currentAspectRatio(){
            if(ratio === 'auto' && isGrsaiNanoModel()) return 'auto';
            if(ratio === 'custom'){
                const width = Number(customRatioWidth);
                const height = Number(customRatioHeight);
                return width > 0 && height > 0 ? `${width}:${height}` : '';
            }
            return {
                square:'1:1',
                portrait:'2:3',
                landscape:'3:2',
                portrait43:'3:4',
                landscape43:'4:3',
                story:'9:16',
                wide:'16:9'
            }[ratio] || '';
        }

        function currentSize(){
            if(resolution === 'custom') return customSizeValue();
            const options = SIZE_OPTIONS[ratio] || SIZE_OPTIONS.square;
            if(ratio === 'custom'){
                const parsed = customRatioValue();
                const longSide = RES_LONG_SIDE[resolution] || 1024;
                if(parsed){
                    const pixelLimit = RES_PIXEL_LIMIT[resolution] || (longSide * longSide);
                    const rawWidth = parsed >= 1 ? longSide : Math.min(longSide * parsed, Math.sqrt(pixelLimit * parsed));
                    const rawHeight = parsed >= 1 ? Math.min(longSide / parsed, Math.sqrt(pixelLimit / parsed)) : longSide;
                    const width = Math.floor(rawWidth / 16) * 16;
                    const height = Math.floor(rawHeight / 16) * 16;
                    return `${Math.max(64, width)}x${Math.max(64, height)}`;
                }
            }
            const match = options.find(([, label]) => label === resolution) || SIZE_OPTIONS.square.find(([, label]) => label === resolution) || SIZE_OPTIONS.square[0];
            return match[0];
        }

        const SLOTS = [1,2,3];
        // 外部页面（小抽AI）复用同一个编辑面板：?editor=1&src=<图片地址>&mode=outpaint|mask|angle|brush
        // ponytail: iframe + postMessage 复用这一套实现，不把 900 行编辑器复制到第二个页面
        const REF_EDITOR_BRIDGE = (() => {
            try {
                const q = new URLSearchParams(location.search);
                if(q.get('editor') !== '1') return null;
                return { src:q.get('src') || '', mode:q.get('mode') || 'outpaint' };
            } catch(e) { return null; }
        })();
        function firstEmptySlot(){ return SLOTS.find(id => !refs[id]) || 1; }
        // 从 start 开始按格子顺序排列（循环），让多张图依次落进 Main / Aux A / Aux B
        function slotOrder(start){
            const i = Math.max(0, SLOTS.indexOf(start));
            return [...SLOTS.slice(i), ...SLOTS.slice(0, i)];
        }
        // 🚨 拖拽 / 粘贴多张图时必须**全部**上传（旧实现只取 files[0] / 第一个 clipboard item），
        //    依次填进格子；超过 3 张只取前 3 张并提示。
        function handleFilesToSlots(files, start){
            const images = [...(files || [])].filter(f => f && String(f.type || '').startsWith('image/'));
            if(!images.length) return;
            const order = slotOrder(start || firstEmptySlot());
            images.slice(0, order.length).forEach((file, i) => handleFile(file, order[i]));
            if(images.length > order.length) alert(tr('online.slotsFull'));
        }
        SLOTS.forEach(id => {
            const zone = document.getElementById(`drop-zone-${id}`);
            zone.ondragover = e => { e.preventDefault(); zone.classList.add('drag-over'); };
            zone.ondragleave = () => zone.classList.remove('drag-over');
            zone.ondrop = e => {
                e.preventDefault();
                zone.classList.remove('drag-over');
                handleFilesToSlots(e.dataTransfer?.files, id);
            };
        });
        window.addEventListener('paste', e => {
            const files = [...(e.clipboardData?.items || [])]
                .filter(x => x.kind === 'file' && String(x.type || '').startsWith('image/'))
                .map(x => x.getAsFile())
                .filter(Boolean);
            if(files.length) handleFilesToSlots(files, firstEmptySlot());
        });

        async function handleFile(file, index){
            if(!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                const prev = document.getElementById(`prev${index}`);
                prev.src = e.target.result; prev.classList.remove('hidden');
                document.getElementById(`del${index}`).classList.remove('hidden');
                getImageDimensions(e.target.result).then(dim => {
                    refDims[index] = dim;
                    updateSizeUI();
                }).catch(() => {});
            };
            reader.readAsDataURL(file);
            const form = new FormData();
            form.append('files', file);
            const data = await fetch('/api/ai/upload', {method:'POST', body:form}).then(r=>r.json());
            refs[index] = data.files[0];
            slotMask[index] = null;
            rePendingMask = null; rePendingMaskUrl = ''; rePendingPreview = '';   // 换了图，未应用的遮罩作废
            refMaskBadge(index);
            refToolBar(index, true);
        }
        function clearSlot(index, ev){
            if(ev) ev.stopPropagation();
            refs[index] = null;
            refDims[index] = null;
            slotMask[index] = null;
            rePendingMask = null; rePendingMaskUrl = ''; rePendingPreview = '';
            document.getElementById(`tools${index}`).classList.add('hidden');
            refMaskBadge(index);
            document.getElementById(`prev${index}`).src = '';
            document.getElementById(`prev${index}`).classList.add('hidden');
            document.getElementById(`del${index}`).classList.add('hidden');
        }

        /* ── 参考图编辑：扩图 / 遮罩 / 视角 / 画笔（语义对齐 smart-canvas.js）─────
           扩图：白底把原图往外扩到目标比例 → 提示词补 'Remove white area and fill the scene'，
                 尺寸切成扩后的像素（画布 applyImageOutpaint 同款做法）。
           遮罩：涂的区域转成黑白 mask（白=要改）→ /api/image-mask-prepare 求框裁切 →
                 生成时带 operation=inpaint，由后端羽化回贴成整图。
           视角：方位/俯仰/景别拼中文句子写进提示词，参考图本身不动。
           画笔：把涂画直接烧进参考图，替换这一格。 */
        const REF_RATIOS = [['source','原图'],['1:1','1:1'],['4:3','4:3'],['3:4','3:4'],['16:9','16:9'],['9:16','9:16'],['3:2','3:2'],['2:3','2:3']];
        const ANGLE_AZIMUTHS = [{deg:0,label:'正面'},{deg:45,label:'右 45°'},{deg:90,label:'右侧面'},{deg:135,label:'右后 135°'},{deg:180,label:'背面'},{deg:-135,label:'左后 135°'},{deg:-90,label:'左侧面'},{deg:-45,label:'左 45°'}];
        // 俯仰/景别都是滑块：elev 连续可调，提示词按区间取最近的说法
        const ANGLE_ELEV_MIN = -30, ANGLE_ELEV_MAX = 60;
        const ANGLE_SHOT_KEYS = ['close', 'mid', 'wide'];
        const ANGLE_SHOT_LABELS = {close:'特写', mid:'中景', wide:'远景'};
        const REF_EDIT_TITLES = {
            outpaint:{title:'扩图', sub:'把原图往外扩，空白由模型补全（白边别自己擦）'},
            mask:{title:'遮罩', sub:'涂出要修改的区域，生成时只改这块、其余保持原样'},
            angle:{title:'视角', sub:'选机位后把视角要求写进提示词，再点生成'},
            brush:{title:'画笔', sub:'直接在参考图上涂画，应用后替换这张参考图'}
        };
        // 遮罩元数据（含 base_url）；参考图被换掉/清掉时必须一起失效，否则会贴歪
        let slotMask = {1:null,2:null,3:null};
        // 还没点「应用」的遮罩涂抹（编辑器里的黑底白掩膜 + 它的半透明红预览），只用于缩略图提示
        let rePendingMask = null, rePendingMaskUrl = '', rePendingPreview = '', refEditSrc = '';
        let refEdit = null;
        let refPaintBinding = false;
        // 画笔工具：与画布同一套 free/rect/ellipse/label/text
        let reBrushTool = 'free';
        let reLabelCounter = 1;
        const RE_BRUSH_TOOLS = [['free','自由','paintbrush'],['rect','矩形','square'],['ellipse','椭圆','circle'],['label','数字','list-ordered'],['text','文字','type']];
        let reTextItems = [];        // 文字标签（不进像素画布，应用时一起合成）
        let reTextDraft = null;
        let reTextSel = '';
        let reDrawUndo = [];
        let reDrawRedo = [];
        let reShape = null;          // rect/ellipse 拖拽中的起点/终点
        let refShapeSnapshot = null; // rect/ellipse 开画前的像素快照
        let reOutDrag = null;        // 扩图拖拽（移动图片 / 拉边）
        let reAngleDrag = null;      // 视角左右拖拽

        function refToolBar(slot, show){
            const box = document.getElementById(`tools${slot}`);
            if(box) box.classList.toggle('hidden', !show);
        }
        function refMaskBadge(slot){
            const meta = slotMask[slot];
            const badge = document.getElementById(`mbadge${slot}`);
            if(badge) badge.classList.toggle('hidden', !meta);
            // 遮罩缩略图：直接用打包好的黑白 mask 叠在参考图上，涂了哪儿一眼可见
            const prev = document.getElementById(`maskprev${slot}`);
            if(prev){
                // 🚨 别直接把 mask（黑底白块）铺在参考图上：纯黑会盖住原图（老板报过「看不到原图」）。
                // 转成「涂过=半透明红、没涂=透明」再叠，只提示涂了哪儿。
                const url = meta?.mask_url || '';
                // 🚨 别直接把 mask（黑底白块）铺在参考图上：纯黑会盖住原图（老板报过「看不到原图」）。
                // 只显示「涂了哪儿」：有已应用遮罩用它的预览，否则用编辑器里还没应用的涂抹。
                const srcUrl = url || rePendingPreview || '';
                // 注意：rePendingMaskUrl 是原始黑白掩膜，只能当数据用，绝不能直接贴到缩略图上
                if(!srcUrl){ prev.classList.add('hidden'); return; }
                applyMaskPreview(prev, srcUrl);
            }
        }
        // mask 图（黑底白块）→ 半透明红色叠加图；按 url 缓存，避免每次重算
        const maskPreviewCache = {};
        function applyMaskPreview(img, url){
            const done = tinted => { img.src = tinted; img.classList.remove('hidden'); };
            if(maskPreviewCache[url]){ done(maskPreviewCache[url]); return; }
            tintMaskPreview(url, tinted => {
                if(!tinted) return;
                maskPreviewCache[url] = tinted;
                if(img.src !== tinted) done(tinted);
            });
        }
        function tintMaskPreview(url, cb){
            if(!url) { cb(''); return; }
            const m = new Image();
            m.onload = () => {
                let w = m.naturalWidth || m.width, h = m.naturalHeight || m.height;
                if(!w || !h){ cb(''); return; }
                // 预览不需要原图分辨率：遮罩动辄上千像素，逐像素转 RGBA 在低端机上会卡，先压到长边 ≤ 512
                const k = Math.min(1, 512 / Math.max(w, h));
                w = Math.max(1, Math.round(w * k)); h = Math.max(1, Math.round(h * k));
                const c = document.createElement('canvas');
                c.width = w; c.height = h;
                const g = c.getContext('2d');
                g.drawImage(m, 0, 0, w, h);
                const data = g.getImageData(0, 0, w, h);
                // 🚨 遮罩是「黑底 + 白选区」。以前用 source-in 整块 fill 红色：白选区保持 alpha=1 → 缩略图整片红、看不到原图。
                // 这里按原遮罩的亮度（黑底取反就是选区）直接写像素：选区半透明红，其余 alpha=0 透出原图。
                const d = data.data;
                for(let i = 0; i < d.length; i += 4){
                    const alpha = ((d[i] + d[i + 1] + d[i + 2]) / 3 / 255) * 214;
                    d[i] = 239; d[i + 1] = 68; d[i + 2] = 68;
                    d[i + 3] = alpha < 12 ? 0 : alpha;
                    if(!d[i + 3]) d[i] = d[i + 1] = d[i + 2] = 0;
                }
                g.putImageData(data, 0, 0);
                cb(c.toDataURL('image/png'));
            };
            m.onerror = () => cb('');
            m.src = url;
        }
        // 编辑器里每涂一笔就更新一次缩略图预览（只提示涂了哪儿，还没点应用也算）
        let rePendingTimer = 0;
        function markPendingMask(){
            if(!refEdit || refEdit.mode !== 'mask') return;
            refEditSrc = refs[refEdit.slot]?.url || refEditSrc;
            const paint = document.getElementById('rePaint');
            if(!paint) return;
            const flat = refMaskCanvas(paint);
            rePendingMask = flat;
            clearTimeout(rePendingTimer);
            rePendingTimer = setTimeout(() => {
                const slot = refEdit?.slot || 1;
                // 🚨 不能直接拿 flat（不透明白黑掩膜）当预览：叠到参考图上就是整块白/红盖死原图
                // 先把原始掩膜存着（关编辑器/切格时要用它清掉），缩略图只用着色后的透明叠加
                rePendingMaskUrl = flat.toDataURL('image/png');
                tintMaskPreview(rePendingMaskUrl, tinted => {
                    rePendingPreview = tinted || '';
                    refMaskBadge(slot);
                });
            }, 160);
        }
        async function applyRefEdit(){
            if(!refEdit || refEdit.busy) return;
            // 🚨 先把 refEdit 钉住：下面有 await（画布转码 / 上传），期间用户关窗或切格会把 refEdit 置 null
            const edit = refEdit;
            const mode = edit.mode;
            if(mode === 'angle'){
                const sentence = refAnglePrompt(refEdit.angle);
                const input = document.getElementById('promptInput');
                const current = input.value.trim();
                input.value = current ? `${current}\n${sentence}` : sentence;
                closeRefEditor();
                return;
            }
            if(mode === 'mask'){
                if(refPaintEmpty()){ alert('先涂出要修改的区域'); return; }
                // 遮罩必须是原图像素、不透明白黑：舞台画布是原图尺寸，文字标签要一起烧进去
                const slot = edit.slot;
                const paint = document.getElementById('rePaint');
                const flat = refMaskCanvas(paint);
                const blob = await canvasToBlob(flat);
                if(!blob){ alert('遮罩生成失败'); return; }
                const file = await uploadRefBlob(blob, `ref_mask_${Date.now()}.png`);
                if(!file?.url){ alert('遮罩上传失败'); return; }
                const baseUrl = refs[slot]?.url || '';
                edit.busy = true;
                document.getElementById('reApplyBtn').disabled = true;
                try {
                    const res = await fetch('/api/image-mask-prepare', {method:'POST', headers:{'Content-Type':'application/json'},
                        body:JSON.stringify({image_url:baseUrl, mask_url:file.url})});
                    if(!res.ok) throw new Error((await res.json()).detail || '遮罩准备失败');
                    const data = await res.json();
                    slotMask[slot] = {
                        slot, base_url:data.base_url || baseUrl, ref_url:baseUrl, mask_url:file.url,
                        crop_url:data.crop_url, crop_mask_url:data.crop_mask_url,
                        bbox:(data.bbox || []).slice(0, 4), base_w:data.base_w || 0, base_h:data.base_h || 0,
                        aspect_ratio:data.aspect_ratio || '', size:data.size || '', feather:data.feather || 0
                    };
                    refMaskBadge(slot);
                    edit.busy = false;
                    closeRefEditor();
                    toastSafe('遮罩已就绪：写清要改什么，直接点生成');
                } catch(err) {
                    alert(err.message || '遮罩准备失败');
                } finally {
                    edit.busy = false;
                    const btn = document.getElementById('reApplyBtn');
                    if(btn) btn.disabled = false;
                }
                return;
            }
            // 扩图 / 画笔：都是本地像素编辑，出图则交给生图链路
            const slot = refEdit.slot;
            const source = document.getElementById('reCanvas');
            let width = source.width, height = source.height;
            let flat = null;
            if(mode === 'brush'){
                flat = document.createElement('canvas');
                flat.width = width; flat.height = height;
                const fctx = flat.getContext('2d');
                fctx.drawImage(source, 0, 0);
                fctx.drawImage(document.getElementById('rePaint'), 0, 0, width, height);
                // 文字标签、数字标记一起烧进像素（跟画布画笔一致）
                drawRefTextsOn(flat);
            } else {
                flat = source;
            }
            const blob = await canvasToBlob(flat);
            if(!blob){ alert('导出图片失败'); return; }
            const name = `${(refs[slot]?.name || 'ref').replace(/\.[^.]+$/, '')}_${mode}.png`;
            const file = await uploadRefBlob(blob, name);
            if(!file?.url){ alert('上传失败'); return; }
            if(!(await replaceRefImage(slot, file, {width, height}))) return;
            if(mode === 'outpaint'){
                // 尺寸切成扩后的像素（16 对齐），提示词补一句让模型把白边画满

                customHeight = snap(height);

                const input = document.getElementById('promptInput');
                const hint = 'Remove white area and fill the scene';
                if(!input.value.toLowerCase().includes(hint.toLowerCase())){
                    input.value = input.value.trim() ? `${input.value.trim()}\n${hint}` : hint;
                }
            }
            closeRefEditor();
        }
        // ─────────────────────────────────────────────────────────────────────────
        // 参考图编辑（扩图 / 遮罩 / 视角 / 画笔）—— 与画布 smart-canvas.js 同一套交互
        // 2026-11-09 重写：上一版落盘时被截断，这里按 b17 取证重做
        // ─────────────────────────────────────────────────────────────────────────
        const REF_STAGE_PAD = 40;

        function refEditStage(){ return document.getElementById('reStage'); }
        function refRatioValue(key){
            if(key === 'source') return {ratio:1, w:(refEdit?.natW || 1), h:(refEdit?.natH || 1)};
            const [w,h] = String(key || '1:1').split(':').map(Number);
            return {ratio:(w&&h) ? w/h : 1, w, h};
        }
        function refOutpaintSize(){
            if(!refEdit) return {width:1, height:1};
            if(refEdit.customPad) return {...refEdit.customPad};
            if(refEdit.ratioKey === 'source') return {width:refEdit.natW, height:refEdit.natH};
            const [cw, ch] = String(refEdit.ratioKey).split(':').map(Number);
            const natW = refEdit.natW, natH = refEdit.natH;
            let width, height;
            if(cw >= ch){ height = natH; width = Math.round(natH * cw / ch); }
            else { width = natW; height = Math.round(natW * ch / cw); }
            if(width < natW || height < natH){
                // 比例比原图“窄”时，反过来按宽补齐，保证外扩一定 >= 原图
                if(width < natW){ width = natW; height = Math.round(natW * ch / cw); }
                if(height < natH){ height = natH; width = Math.round(natH * cw / ch); }
            }
            return {width, height};
        }
        function clampRefBox(box, pad){
            const natW = refEdit ? refEdit.natW : pad.width, natH = refEdit ? refEdit.natH : pad.height;
            const w = Math.max(natW, pad.width), h = Math.max(natH, pad.height);
            return {x:Math.min(Math.max(0, box?.x || 0), w - natW), y:Math.min(Math.max(0, box?.y || 0), h - natH), w, h};
        }

        function openRefEditor(slot, mode, ev){
            if(ev) ev.stopPropagation();
            // theme.js 给 body 加了 transform:scale()，它会成为 fixed 的包含块 ⇒ 页面一滚动弹窗就跑到视口外。
            // 打开期间把缩放撤掉，弹窗就老老实实居中在可见区域里。
            document.body.classList.add('re-open');
            const ref = refs[slot];
            if(!ref?.url){ toastSafe('先上传一张参考图'); return; }
            refEditSrc = ref.url;
            const img = new Image();
            img.onload = () => {
                refEdit = {slot, mode: mode || 'outpaint', img, natW:img.naturalWidth || 1, natH:img.naturalHeight || 1,
                    ratioKey:'source', angle:{deg:0, elev:0, shot:'mid'}, busy:false};
                reDrawUndo = []; reDrawRedo = []; reTextItems = []; reLabelCounter = 1; reTextSel = ''; reShape = null; refShapeSnapshot = null;
                reOutDrag = null; reAngleDrag = null; reTextDraft = null;
                refEdit.box = clampRefBox({x:0, y:0, w:refEdit.natW, h:refEdit.natH}, refOutpaintSize());
                const overlay = document.getElementById('refEditModal');
                overlay.classList.remove('hidden');
                refEditStage().classList.add('empty');
                bindRefPaint();
                bindRefStage();
                renderRefModeTools(true);
                drawRefStage();
            };
            img.onerror = () => toastSafe('图片加载失败，换一张试试')   // 用 toast 而不是 alert：在 iframe 弹层里 alert 会卡住整个面板;
            img.src = ref.url;
        }
        function closeRefEditor(){
            const overlay = document.getElementById('refEditModal');
            if(overlay) overlay.classList.add('hidden');
            const st = refEditStage();
            if(st){ st.classList.remove('loaded', 'empty', 're-mode-outpaint', 're-mode-mask', 're-mode-angle', 're-mode-brush'); st.style.removeProperty('--re-ratio'); }
            const cur = document.getElementById('reCursor');
            if(cur) cur.style.display = 'none';
            refEdit = null; reShape = null; reOutDrag = null; reAngleDrag = null; reTextDraft = null;
            document.body.classList.remove('re-open');
            // 桥接模式：整个窗口就是这个 iframe，关掉面板必须让外层把 iframe 也收起来
            if(REF_EDITOR_BRIDGE) {
                try { window.parent.postMessage({ type: 'xvai-ref-editor-closed' }, '*'); } catch(err) {}
            }
        }
        function setRefEditMode(mode){
            if(!refEdit) return;
            refEdit.mode = mode;
            reShape = null; reOutDrag = null; reAngleDrag = null;
            const cur = document.getElementById('reCursor');
            if(cur) cur.style.display = 'none';
            renderRefModeTools(true);
            drawRefStage();
        }
        function refModeHint(){
            const hint = document.getElementById('reHint');
            if(!hint || !refEdit) return;
            hint.textContent = ({
                outpaint:'拖动图片调整位置 · 拉边/角改外扩范围 · 白色区域会被补全',
                mask:'涂出要修改的区域，应用后再写提示词生成',
                angle:'选好视角后点「应用」，视角要求会追加到提示词',
                brush:'直接在图上涂画，应用后替换这张参考图'
            })[refEdit.mode] || '';
        }
        function renderRefModeTools(syncStage = true){
            if(!refEdit) return;
            const mode = refEdit.mode;
            document.querySelectorAll('#refEditModal .re-tabs button').forEach(b => b.classList.toggle('active', b.dataset.reMode === mode));
            ['outpaint','mask','brush','angle'].forEach(m => {
                const el = document.getElementById('reTool' + m.charAt(0).toUpperCase() + m.slice(1));
                if(el) el.classList.toggle('hidden', m !== mode);
            });
            const titles = {outpaint:'扩图', mask:'遮罩', angle:'视角', brush:'画笔'};
            const subs = {outpaint:'选择画布比例，拖动图片摆位置，白色区域交给模型补全',
                          mask:'涂出要改的地方，写清要求后生成',
                          angle:'选机位后把视角要求写进提示词，再点生成',
                          brush:'涂画 / 标注后替换这张参考图'};
            document.getElementById('reTitle').textContent = titles[mode] || '编辑参考图';
            document.getElementById('reSub').textContent = subs[mode] || '';
            if(mode === 'outpaint'){
                const box = document.getElementById('reOutpaintChips');
                if(box) box.innerHTML = REF_RATIOS.map(([k, label]) =>
                    `<button type="button" class="re-chip${refEdit.ratioKey === k ? ' active' : ''}" data-re-ratio="${k}">${label}</button>`).join('');
                box?.querySelectorAll('[data-re-ratio]').forEach(btn => btn.onclick = () => {
                    refEdit.ratioKey = btn.dataset.reRatio;
                    refEdit.customPad = null;
                    refEdit.box = clampRefBox({x:0, y:0}, refOutpaintSize());
                    renderRefModeTools(false); drawRefStage();

            }
            if(mode === 'brush'){
                const box = document.getElementById('reBrushTools');

                        `<button type="button" class="re-chip${reBrushTool === k ? ' active' : ''}" data-re-brush="${k}"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i><span>${label}</span></button>`).join('');
                    box.querySelectorAll('[data-re-brush]').forEach(btn => btn.onclick = () => {
                        reBrushTool = btn.dataset.reBrush; reShape = null;
                        renderRefModeTools(false); refModeHint();
                        const cur = document.getElementById('reCursor');
                        if(cur) cur.style.display = (reBrushTool === 'free' && window.matchMedia('(hover:hover)').matches) ? 'block' : 'none';

        function syncRefStageClass(){
            const st = refEditStage();
            if(!st || !refEdit) return;
            ['outpaint','mask','angle','brush'].forEach(m => st.classList.toggle('re-mode-' + m, refEdit.mode === m && !st.classList.contains('empty')));
        }

        function drawRefStage(){
            if(!refEdit) return;
            const st = refEditStage();
            const canvas = document.getElementById('reCanvas');
            const paint = document.getElementById('rePaint');
            const mode = refEdit.mode;
            const sizes = {outpaint: refOutpaintSize(), mask:{width:refEdit.natW, height:refEdit.natH},
                           brush:{width:refEdit.natW, height:refEdit.natH}, angle:{width:refEdit.natW, height:refEdit.natH}};
            const size = sizes[mode];
            if(mode === 'outpaint'){
                refEdit.box = clampRefBox(refEdit.box || {x:0, y:0}, size);
                for(const cv of [canvas, paint]){
                    if(cv.width !== size.width || cv.height !== size.height){ cv.width = size.width; cv.height = size.height; }
                }
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, size.width, size.height);
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, size.width, size.height);
                ctx.drawImage(refEdit.img, refEdit.box.x, refEdit.box.y, refEdit.natW, refEdit.natH);
                const frame = document.getElementById('reOutpaintFrame');
                if(frame){
                    frame.style.left = refEdit.box.x + 'px'; frame.style.top = refEdit.box.y + 'px';
                    frame.style.width = refEdit.natW + 'px'; frame.style.height = refEdit.natH + 'px';
                }
            } else {
                if(canvas.width !== refEdit.natW || canvas.height !== refEdit.natH){ canvas.width = refEdit.natW; canvas.height = refEdit.natH; }
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(refEdit.img, 0, 0, refEdit.natW, refEdit.natH);
                if(paint.width !== refEdit.natW || paint.height !== refEdit.natH){
                    const old = document.createElement('canvas');
                    old.width = paint.width; old.height = paint.height;
                    if(paint.width && paint.height) old.getContext('2d').drawImage(paint, 0, 0);
                    paint.width = refEdit.natW; paint.height = refEdit.natH;
                }
