            st.style.setProperty('--re-ratio', String(size.width / Math.max(1, size.height)));
            st.classList.add('loaded');
            syncRefStageClass();
            layoutRefCanvases(mode === 'outpaint' ? 0 : REF_STAGE_PAD);
            if(mode === 'angle'){ drawRefAngleCard(); syncRefAngleCard(); }
            renderRefTexts();
            drawRefTextsOn(null);
        }
        function layoutRefCanvases(pad = REF_STAGE_PAD){
            if(!refEdit) return;
            const st = refEditStage();
            const canvas = document.getElementById('reCanvas');
            const paint = document.getElementById('rePaint');
            const availW = Math.max(120, st.clientWidth - pad * 2);
            const availH = Math.max(120, st.clientHeight - pad * 2);
            const scale = Math.min(availW / canvas.width, availH / canvas.height, 4);
            const w = Math.round(canvas.width * scale), h = Math.round(canvas.height * scale);
            // 视角模式只用 3D 卡片，底图整层隐藏（否则两张图并排，看着像重复）
            const hideBase = refEdit.mode === 'angle';
            for(const cv of [canvas, paint]){
                cv.style.width = w + 'px'; cv.style.height = h + 'px';
                cv.style.left = Math.round((st.clientWidth - w) / 2) + 'px';
                cv.style.top = Math.round((st.clientHeight - h) / 2) + 'px';
                cv.style.visibility = hideBase ? 'hidden' : 'visible';
            }
            const frame = document.getElementById('reOutpaintFrame');
            if(frame && refEdit.mode === 'outpaint'){
                const box = refEdit.box;
                frame.style.left = Math.round(canvas.offsetLeft + box.x * scale) + 'px';
                frame.style.top = Math.round(canvas.offsetTop + box.y * scale) + 'px';
                frame.style.width = Math.round(refEdit.natW * scale) + 'px';
                frame.style.height = Math.round(refEdit.natH * scale) + 'px';
            }
            if(refEdit.mode === 'angle') syncRefAngleCardSize();
            else if(st.clientHeight) st.style.removeProperty('--re-stage-h');
        }
        function refStagePoint(event){
            const paint = document.getElementById('rePaint');
            const rect = paint.getBoundingClientRect();
            const sx = paint.width / Math.max(1, rect.width), sy = paint.height / Math.max(1, rect.height);
            return {x:(event.clientX - rect.left) * sx, y:(event.clientY - rect.top) * sy};
        }
        function refPaintColor(){
            if(refEdit?.mode === 'mask') return 'rgba(239,68,68,.55)';
            return document.getElementById('reBrushColor')?.value || '#ff2d55';
        }
        function refBrushSize(){
            if(refEdit?.mode === 'mask') return Number(document.getElementById('reMaskSize')?.value || 42);
            return Number(document.getElementById('reBrushSize')?.value || 14);
        }
        function setupRefDrawStyle(ctx){
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.lineWidth = refBrushSize(); ctx.strokeStyle = refPaintColor(); ctx.fillStyle = refPaintColor();
        }
        function refStrokePoint(ctx, from, to){
            setupRefDrawStyle(ctx);
            ctx.beginPath();
            if(from){ ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke(); }
            else { ctx.arc(to.x, to.y, Math.max(1, refBrushSize() / 2), 0, Math.PI * 2); ctx.fill(); }
        }
        function refStrokeAt(event, from){
            const paint = document.getElementById('rePaint');
            if(!paint) return null;
            const ctx = paint.getContext('2d');
            const to = refStagePoint(event);
            refStrokePoint(ctx, from, to);
            return to;
        }
        function refSnapshot(){
            const paint = document.getElementById('rePaint');
            const txt = JSON.stringify(reTextItems);
            return {paint: paint.toDataURL('image/png'), text: txt, label: reLabelCounter};
        }
        // 快照回滚（dataURL 异步解码后覆盖画布）；返回 Promise，保证调用方知道何时是新像素
        function refRestore(canvas, snap){
            return new Promise(resolve => {
                if(!snap || !canvas){ resolve(); return; }
                const ctx = canvas.getContext('2d');
                const img = new Image();
                img.onload = () => { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0); refShapeSnapshot = null; resolve(); };
                img.onerror = () => resolve();
                img.src = snap.paint;
            });
        }
        function refPushHistory(){
            const snap = refSnapshot();
            reDrawUndo.push(snap);
            if(reDrawUndo.length > 30) reDrawUndo.shift();
            reDrawRedo = [];
        }
        function refUndo(){
            if(!reDrawUndo.length) return;
            reDrawRedo.push(refSnapshot());
            const snap = reDrawUndo.pop();
            const paint = document.getElementById('rePaint');
            const ctx = paint.getContext('2d');
            refRestore(paint, snap).then(() => {
                reTextItems = JSON.parse(snap.text || '[]'); reLabelCounter = snap.label || 1;
                renderRefTexts(); drawRefTextsOn(null);
            });
        }
        function refRedo(){
            if(!reDrawRedo.length) return;
            reDrawUndo.push(refSnapshot());
            const snap = reDrawRedo.pop();
            const paint = document.getElementById('rePaint');
            const ctx = paint.getContext('2d');
            refRestore(paint, snap).then(() => {
                reTextItems = JSON.parse(snap.text || '[]'); reLabelCounter = snap.label || 1;
                renderRefTexts(); drawRefTextsOn(null);
            });
        }
        function clearRefPaint(){
            const paint = document.getElementById('rePaint');
            const ctx = paint.getContext('2d');
            ctx.clearRect(0, 0, paint.width, paint.height);
            reTextItems = []; reLabelCounter = 1; reShape = null;
            renderRefTexts();
            rePendingMaskUrl = ''; if(refEdit) refMaskBadge(refEdit.slot);
        }
        function refPaintEmpty(){
            const paint = document.getElementById('rePaint');
            const data = paint.getContext('2d').getImageData(0, 0, paint.width, paint.height).data;
            for(let i = 3; i < data.length; i += 4){ if(data[i] > 0) return false; }
            return !reTextItems.length;
        }
        function refMaskCanvas(src){
            const c = document.createElement('canvas');
            c.width = refEdit ? refEdit.natW : src.width;
            c.height = refEdit ? refEdit.natH : src.height;
            const ctx = c.getContext('2d');
            const scaled = document.createElement('canvas');
            scaled.width = c.width; scaled.height = c.height;
            scaled.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
            const data = scaled.getContext('2d').getImageData(0, 0, c.width, c.height);
            const out = ctx.createImageData(c.width, c.height);
            for(let i = 0; i < data.data.length; i += 4){
                const on = data.data[i + 3] > 8;
                out.data[i] = out.data[i + 1] = out.data[i + 2] = on ? 255 : 0;
                out.data[i + 3] = 255;
            }
            ctx.putImageData(out, 0, 0);
            drawRefTextsOn(c, true);
            return c;
        }
        function drawRefNumberLabel(ctx, x, y){
            if(!ctx) return;
            const r = Math.max(18, refBrushSize() * 2.2);
            ctx.save();
            setupRefDrawStyle(ctx);
            ctx.beginPath(); ctx.arc(x, y, r / 2, 0, Math.PI * 2);
            ctx.fillStyle = refPaintColor(); ctx.fill();
            ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.92)'; ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.font = `800 ${Math.round(r * 0.62)}px system-ui, sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(String.fromCharCode(0x2460 + Math.max(0, reLabelCounter - 1)), x, y);
            ctx.restore();
        }

        // ── 文字工具（DOM 覆盖层，应用时烧进像素）──────────────────────────────
        function renderRefTexts(){
            const st = refEditStage();
            // 逐个删：contenteditable 失焦会触发 blur 回调里再渲染一次，forEach 的静态列表会撞上已被删的节点
            // 先把列表快照下来再删：blur 回调会在删的过程中重跑本函数，实时 querySelector 会和它互相踩
            const stale = st ? Array.prototype.slice.call(st.querySelectorAll('.re-text-item')) : [];
            // try 包住：blur 链里可能有别处先一步删掉同一节点，抛错会打断后面的重绘
            stale.forEach(n => { try { n.remove(); } catch(err) {} });
            const paint = document.getElementById('rePaint');
            if(!st || !paint || !refEdit) return;
            const rect = paint.getBoundingClientRect();
            const stRect = st.getBoundingClientRect();
            const sx = rect.width / Math.max(1, paint.width), sy = rect.height / Math.max(1, paint.height);
            reTextItems.forEach((item, i) => {
                const el = document.createElement('div');
                el.className = 're-text-item';
                el.contentEditable = 'false';
                el.textContent = item.text;
                el.style.left = (rect.left - stRect.left + item.x * sx) + 'px';
                el.style.top = (rect.top - stRect.top + item.y * sy) + 'px';
                el.style.color = item.color || '#ff2d55';
                el.style.fontSize = Math.max(12, (item.size || 28) * sx) + 'px';
                el.dataset.reTextIndex = i;
                el.onclick = e => { e.stopPropagation(); reTextSel = String(i); beginRefTextEdit(i); };
                st.appendChild(el);
            });
        }
        function beginRefTextEdit(index){
            const st = refEditStage();
            const el = st?.querySelector(`.re-text-item[data-re-text-index="${index}"]`);
            if(!el) return;
            el.contentEditable = 'true';
            el.focus();
            document.execCommand?.('selectAll', false, null);
            el.onblur = () => {
                el.contentEditable = 'false';
                reTextItems[index] = {...reTextItems[index], text: el.textContent || ''};
                if(!reTextItems[index].text.trim()) reTextItems.splice(index, 1);
                renderRefTexts(); drawRefTextsOn(null);
            };
        }
        function beginRefText(event){
            const p = refStagePoint(event);
            refPushHistory();
            reTextItems.push({x:p.x, y:p.y, text:'文字', color:refPaintColor(), size:refBrushSize() * 2});
            renderRefTexts();
            setTimeout(() => beginRefTextEdit(reTextItems.length - 1), 30);
        }
        function finishRefText(){
            const active = document.activeElement;
            if(active?.classList?.contains('re-text-item')) active.blur();
        }
        function drawRefTextsOn(target, monochrome){
            if(!refEdit || !reTextItems.length) return;
            const st = refEditStage();
            const paint = document.getElementById('rePaint');
            if(!st || !paint) return;
            const rect = paint.getBoundingClientRect(), stRect = st.getBoundingClientRect();
            const sx = paint.width / Math.max(1, rect.width), sy = paint.height / Math.max(1, rect.height);
            const ctx = target ? target.getContext('2d') : paint.getContext('2d');
            ctx.save();
            reTextItems.forEach(item => {
                const x = target ? item.x : (rect.left - stRect.left + item.x / sx);
                const y = target ? item.y : (rect.top - stRect.top + item.y / sy);
                if(target){
                    ctx.fillStyle = monochrome ? '#fff' : (item.color || '#ff2d55');
                    ctx.font = `800 ${Math.round(Math.max(12, item.size || 28))}px system-ui, sans-serif`;
                    ctx.textBaseline = 'top';
                    ctx.fillText(item.text || '', x, y);
                }
            });
            ctx.restore();
        }

        // ── 指针绑定（只绑一次）────────────────────────────────────────────────
        function capturePointer(el, event){
            try { el.setPointerCapture?.(event.pointerId); } catch(err) { /* 合成事件没有真实指针 */ }
        }
        function syncRefCursorSize(){
            if(!refEdit) return;
            const cur = document.getElementById('reCursor');
            const paint = document.getElementById('rePaint');
            if(!cur || !paint) return;
            const rect = paint.getBoundingClientRect();
            const size = Math.max(4, refBrushSize() * (rect.width / Math.max(1, paint.width)));
            cur.style.width = cur.style.height = size + 'px';
        }
        function refCursorMove(event){
            if(!refEdit || !(refEdit.mode === 'mask' || (refEdit.mode === 'brush' && reBrushTool === 'free'))) return;
            if(window.matchMedia('(hover:none)').matches) return;
            const cur = document.getElementById('reCursor');
            if(!cur) return;
            syncRefCursorSize();
            const size = parseFloat(cur.style.width) || 20;
            cur.style.display = 'block';
            cur.style.left = (event.clientX - size / 2) + 'px';
            cur.style.top = (event.clientY - size / 2) + 'px';
            cur.style.transform = 'none';
        }
        function bindRefPaint(){
            if(refPaintBinding) return;
            refPaintBinding = true;
            const paint = document.getElementById('rePaint');
            if(!paint) return;
            let last = null;
            paint.addEventListener('pointerdown', event => {
                if(!refEdit) return;
                if(!(refEdit.mode === 'mask' || refEdit.mode === 'brush')) return;
                if(event.button !== 0) return;
                event.preventDefault();
                capturePointer(paint, event);
                refPushHistory();
                const tool = refEdit.mode === 'brush' ? reBrushTool : 'free';
                const p = refStagePoint(event);
                if(tool === 'label'){
                    drawRefNumberLabel(paint.getContext('2d'), p.x, p.y);
                    reLabelCounter += 1;
                    last = null;
                    markPendingMask();
                    return;
                }
                if(tool === 'text'){ beginRefText(event); last = null; return; }
                if(tool === 'rect' || tool === 'ellipse'){
                    refShapeSnapshot = refSnapshot();
                    reShape = {tool, from:p, to:p};
                    last = null;
                    return;
                }
                refStrokePoint(paint.getContext('2d'), null, p);
                last = p;
                markPendingMask();
            });
            paint.addEventListener('pointermove', event => {
                refCursorMove(event);
                if(!refEdit) return;
                if(reShape){
                    const ctx = paint.getContext('2d');
                    refRestore(paint, refShapeSnapshot).then(() => {
                        // 回滚是异步的，期间可能已经 pointerup 收尾，这里必须重新判空
                        if(!reShape) return;
                        const p = refStagePoint(event);
                        reShape.to = p;
                        ctx.save(); setupRefDrawStyle(ctx); ctx.globalAlpha = .9;
                        if(reShape.tool === 'rect'){
                            ctx.strokeRect(reShape.from.x, reShape.from.y, p.x - reShape.from.x, p.y - reShape.from.y);
                        } else {
                            const cx = (reShape.from.x + p.x) / 2, cy = (reShape.from.y + p.y) / 2;
                            ctx.beginPath();
                            ctx.ellipse(cx, cy, Math.abs(p.x - reShape.from.x) / 2, Math.abs(p.y - reShape.from.y) / 2, 0, 0, Math.PI * 2);
                            ctx.stroke();
                        }
                        ctx.restore();
                    });
                    return;
                }
                if(!last) return;
                const evts = event.getCoalescedEvents?.() || [event];
                for(const e of evts){
                    const to = refStrokeAt(e, last);
                    if(to) last = to;
                }
                markPendingMask();
            });
            const endStroke = event => {
                if(reShape){
                    // 合成/快速点击可能没派发 pointermove，这里兜底补终点
                    if(event && event.clientX && refEdit){
                        try { reShape.to = refStagePoint(event); } catch(err) { /* 忽略 */ }
                    }
                    const ctx = paint.getContext('2d');
                    const shape = reShape;
                    reShape = null;
                    refRestore(paint, refShapeSnapshot).then(() => {
                        ctx.save(); setupRefDrawStyle(ctx);
                        if(shape.tool === 'rect'){
                            ctx.strokeRect(shape.from.x, shape.from.y, shape.to.x - shape.from.x, shape.to.y - shape.from.y);
                        } else {
                            const cx = (shape.from.x + shape.to.x) / 2, cy = (shape.from.y + shape.to.y) / 2;
                            ctx.beginPath();
                            ctx.ellipse(cx, cy, Math.abs(shape.to.x - shape.from.x) / 2, Math.abs(shape.to.y - shape.from.y) / 2, 0, 0, Math.PI * 2);
                            ctx.stroke();
                        }
                        ctx.restore();
                        markPendingMask();
                    });
                }
                last = null;
            };
            paint.addEventListener('pointerup', event => endStroke(event));
            paint.addEventListener('pointercancel', () => endStroke(null));
            paint.addEventListener('pointerleave', event => {
                const cur = document.getElementById('reCursor');
                if(cur && !last && !reShape) cur.style.display = 'none';
            });
        }
        function bindRefStage(){
            if(window.__refStageBound) return;
            window.__refStageBound = true;
            const st = refEditStage();
            if(!st) return;
            st.addEventListener('pointerdown', event => {
                if(!refEdit) return;
                const tag = (event.target.tagName || '').toLowerCase();
                if(['button','input','textarea','select'].includes(tag)) return;
                if(refEdit.mode === 'outpaint'){
                    if(event.button !== 0) return;
                    const handle = event.target.closest?.('[data-re-oh]');
                    const onImage = ['reCanvas','rePaint','reOutpaintFrame'].includes(event.target.id);
                    if(!handle && !onImage) return;
                    event.preventDefault();
                    capturePointer(st, event);
                    const size = refOutpaintSize();
                    refEdit.box = clampRefBox({x:refEdit.box?.x || 0, y:refEdit.box?.y || 0}, size);
                    reOutDrag = {mode: handle ? handle.dataset.reOh : 'move', sx:event.clientX, sy:event.clientY,
                        start:{...refEdit.box}, natW:refEdit.natW, natH:refEdit.natH, padW:size.width, padH:size.height};
                } else if(refEdit.mode === 'angle'){
                    if(event.button !== 0) return;
                    event.preventDefault();
                    capturePointer(st, event);
                    reAngleDrag = {sx:event.clientX, sy:event.clientY, deg:refEdit.angle.deg, elev:refEdit.angle.elev};
                }
            });
            st.addEventListener('pointermove', event => {
                if(reOutDrag){
                    const dx = event.clientX - reOutDrag.sx, dy = event.clientY - reOutDrag.sy;
                    const s = reOutDrag.start;
                    const natW = reOutDrag.natW, natH = reOutDrag.natH;
                    if(reOutDrag.mode === 'move'){
                        refEdit.box = clampRefBox({x:s.x + dx, y:s.y + dy, w:reOutDrag.padW, h:reOutDrag.padH}, {width:reOutDrag.padW, height:reOutDrag.padH});
                    } else {
                        // 拉边/角：与画布一致，对称外扩
                        const scaleX = natW / Math.max(1, s.w), scaleY = natH / Math.max(1, s.h);
                        let growX = 0, growY = 0;
                        const m = reOutDrag.mode;
                        if(m === 'left' || m === 'right' || m === 'corner') growX = Math.abs(dx) * scaleX / 2;
                        if(m === 'top' || m === 'bottom' || m === 'corner') growY = Math.abs(dy) * scaleY / 2;
                        let w = natW + growX * 2, h = natH + growY * 2;
                        if(m === 'left' || m === 'right') h = Math.max(s.h, natH);
                        if(m === 'top' || m === 'bottom') w = Math.max(s.w, natW);
                        refEdit.box = clampRefBox({x:0, y:0, w, h}, {width:Math.round(w), height:Math.round(h)});
                        refEdit.ratioKey = 'source';
                        // 画布宽高直接跟着外扩走（自定义 pad 优先于比例估算）
                        refEdit.customPad = {width:Math.round(w), height:Math.round(h)};
                        refEdit.box = {x:Math.round((w - natW) / 2), y:Math.round((h - natH) / 2), w:Math.round(w), h:Math.round(h)};
                    }
                    drawRefStage();
                } else if(reAngleDrag){
                    const dx = event.clientX - reAngleDrag.sx, dy = event.clientY - reAngleDrag.sy;
                    const deg = Math.round((reAngleDrag.deg + dx * 0.6) / 5) * 5;
                    const elev = Math.round((reAngleDrag.elev - dy * 0.4) / 5) * 5;
                    refEdit.angle.deg = Math.max(-180, Math.min(180, deg));
                    refEdit.angle.elev = Math.max(-30, Math.min(60, elev));

                    syncRefAngleCard();
                }
            });
            const stopDrag = () => { reOutDrag = null; reAngleDrag = null; };
            st.addEventListener('pointerup', stopDrag);
            st.addEventListener('pointercancel', stopDrag);
            st.addEventListener('pointerup', () => {
                if(!refEdit || refEdit.mode !== 'mask') markPendingMask();
            });
            st.addEventListener('dragover', e => e.preventDefault());
            const range = document.getElementById('reAngleRange');
            if(range) range.addEventListener('input', () => {
                if(!refEdit) return;
                refEdit.angle.deg = Number(range.value) || 0;
                renderRefAngleControls(false);
                syncRefAngleCard();
            });
            const bindAngleRange = (id, apply) => {
                const el = document.getElementById(id);
                if(el) el.addEventListener('input', () => { if(!refEdit) return; apply(el); renderRefAngleControls(false); syncRefAngleCard(); });
            };
            bindAngleRange('reAngleElevRange', el => { refEdit.angle.elev = Number(el.value) || 0; });
            bindAngleRange('reAngleShotRange', el => { refEdit.angle.shot = ANGLE_SHOT_KEYS[Number(el.value)] || 'mid'; });
            window.addEventListener('resize', () => { if(refEdit) { layoutRefCanvases(refEdit.mode === 'outpaint' ? 0 : REF_STAGE_PAD); renderRefTexts(); drawRefTextsOn(null); } });
        }

        // ── 视角：3D 卡片 + 提示词，与画布 imageAnglePrompt 同句式 ─────────────
        function setRefAngleDeg(deg){ if(!refEdit) return; refEdit.angle.deg = deg; renderRefAngleControls(false); syncRefAngleCard(); }
        function setRefAngleElev(elev){ if(!refEdit) return; refEdit.angle.elev = elev; renderRefAngleControls(false); syncRefAngleCard(); }
        function setRefAngleShot(shot){ if(!refEdit) return; refEdit.angle.shot = shot; renderRefAngleControls(false); syncRefAngleCard(); }
        // 滑块是连续的，标签按区间取最近的说法（-30~60 共 90 度）
        function refAngleElevLabel(elev){
            if(elev <= -22) return '仰拍';
            if(elev <= -8) return '略仰';
            if(elev < 8) return '平视';
            if(elev < 45) return '略俯';
            return '俯拍';
        }
        function refAngleLabel(deg){
            const a = Math.abs(deg);
            if(a <= 15) return '正面';
            if(a >= 165) return '背面';
            if(Math.abs(a - 90) <= 15) return deg > 0 ? '右侧面' : '左侧面';
            return deg > 0 ? `右 ${a}°` : `左 ${a}°`;
        }
        function refAngleElevSentence(elev){
            if(elev >= 45) return '从高处俯拍同一主体。';
            if(elev >= 15) return '从略高于主体的角度俯拍同一主体。';
            if(elev <= -15) return '以低机位仰拍同一主体。';
            return '';
        }
        function refAnglePrompt(state = {deg:0, elev:0, shot:'mid'}){
            const deg = Number(state.deg) || 0, elev = Number(state.elev) || 0, shot = state.shot || 'mid';
            const a = Math.abs(deg);
            let head;
            if(a < 5) head = '';
            else if(a >= 175) head = '从正后方展示同一主体。';
            else if(Math.abs(a - 90) <= 5) head = `以 90 度正侧面（${deg > 0 ? '右' : '左'}侧）展示同一主体。`;
            else head = `将镜头绕主体向${deg > 0 ? '右' : '左'}旋转 ${a} 度。`;
            const elevText = refAngleElevSentence(elev);
            const shotText = shot === 'close' ? '将镜头推近，给主体一个特写。'
                           : shot === 'wide' ? '将镜头拉远，拍一个能看到更多周围环境的远景。' : '';
            const keepClothing = !(elev >= 15 || shot !== 'mid');
            const tail = `保持主体${keepClothing ? '、服装' : ''}、配色、光线和风格不变。`;
            const parts = [head || '以正面平视角度展示同一主体。', elevText, shotText, tail].filter(Boolean);
            return parts.join('');
        }
        function renderRefAngleControls(full = true){
            if(!refEdit) return;
            const angle = refEdit.angle;
            const range = document.getElementById('reAngleRange');
            if(range) range.value = String(angle.deg);
            const value = document.getElementById('reAngleValue');
            if(value) value.textContent = refAngleLabel(angle.deg);
            const degLabel = document.getElementById('reAngleDegLabel');
            if(degLabel) degLabel.textContent = `${angle.deg}° / ${angle.elev}° / ${({close:'特写',mid:'中景',wide:'远景'})[angle.shot]}`;
            const elevRange = document.getElementById('reAngleElevRange');
            if(elevRange) elevRange.value = String(angle.elev);
            const elevValue = document.getElementById('reAngleElevValue');
            if(elevValue) elevValue.textContent = refAngleElevLabel(angle.elev);
            const shotRange = document.getElementById('reAngleShotRange');
            if(shotRange) shotRange.value = String(Math.max(0, ANGLE_SHOT_KEYS.indexOf(angle.shot)));
            const shotValue = document.getElementById('reAngleShotValue');
            if(shotValue) shotValue.textContent = ANGLE_SHOT_LABELS[angle.shot] || '中景';
            const azBox = document.getElementById('reAngleAzimuth');
            if(azBox && full){
                azBox.innerHTML = ANGLE_AZIMUTHS.map(({deg, label}) =>
                    `<button type="button" class="re-chip${angle.deg === deg ? ' active' : ''}" data-re-deg="${deg}">${label}</button>`).join('');
                azBox.querySelectorAll('[data-re-deg]').forEach(b => b.onclick = () => setRefAngleDeg(Number(b.dataset.reDeg)));
            } else if(azBox){
                azBox.querySelectorAll('[data-re-deg]').forEach(b => b.classList.toggle('active', Number(b.dataset.reDeg) === angle.deg));
            }
            const preview = document.getElementById('reAnglePreview');
            if(preview) preview.value = refAnglePrompt(angle);
            const badge = document.getElementById('reAngleBadge');
            if(badge) badge.textContent = refAngleLabel(angle.deg);
        }
        function syncRefAngleCardSize(){
            const st = refEditStage();
            const card = document.querySelector('#reAngleCard .re-ac-card');
            if(!st || !card || !refEdit) return;
            // 🚨 必须按卡片自己的 offsetParent 算尺寸：clientWidth 含 padding，而卡片是 absolute 定位，
            // 用舞台的 clientWidth/clientHeight 居中会让卡片偏到右下（padding 40px 直接变成偏移量）
            const host = card.offsetParent || st;
            const boxW = host.clientWidth || st.clientWidth;
            const boxH = host.clientHeight || st.clientHeight;
            const ratio = refEdit.natW / Math.max(1, refEdit.natH);
            const w = Math.round(Math.min(boxW * 0.72, 520));
            // 高度受舞台约束时要反过来压宽度，只夹高度会让卡片变成超宽条、转到侧面就捅出舞台
            const maxH = Math.max(120, boxH * 0.72);
            const h = Math.round(Math.min(w / Math.max(0.35, ratio), maxH));
            const fitW = h < w / Math.max(0.35, ratio) ? Math.round(h * Math.max(0.35, ratio)) : w;
            const w2 = Math.min(w, Math.max(120, fitW));
            const cardH = Math.max(120, h);
            // 🚨 left/top 用百分比会按 offsetParent 解析，一律算像素：相对 offsetParent 居中，而不是相对舞台
            card.style.width = w2 + 'px';
            card.style.height = cardH + 'px';
            card.style.left = Math.round((boxW - w2) / 2) + 'px';
            card.style.top = Math.round((boxH - cardH) / 2) + 'px';
            card.style.marginLeft = '0px';
            card.style.marginTop = '0px';
        }
        function drawRefAngleCard(){
            const url = refEdit?.img?.src || refEditSrc || '';
            const front = document.querySelector('#reAngleCard .re-ac-front img');
            const back = document.querySelector('#reAngleCard .re-ac-back img');
            if(front) front.src = url;
            if(back) back.src = url;
            const card = document.querySelector('#reAngleCard .re-ac-card');
            if(card) card.style.setProperty('--re-card-img', url ? `url("${String(url).replace(/"/g, '%22')}")` : 'none');
            syncRefAngleCardSize();
        }
        function syncRefAngleCard(){
            if(!refEdit) return;
            const card = document.querySelector('#reAngleCard .re-ac-card');
            if(!card) return;
            const deg = Number(refEdit.angle.deg) || 0;
            const elev = Number(refEdit.angle.elev) || 0;
            const shot = refEdit.angle.shot || 'mid';
            const back = Math.abs(deg) > 90;
            // 与画布 syncImageAngleCard 同款：超过 ±90° 后映射到背面 + 镜像角度，避免薄片正对镜头
            const mapped = back ? (deg > 0 ? deg - 180 : deg + 180) : deg;
            const rotY = Math.max(-82, Math.min(82, mapped));
            const rotX = -elev * 0.55;
            const zoom = shot === 'close' ? 1.16 : shot === 'wide' ? 0.62 : 0.9;
            card.dataset.face = back ? 'back' : 'front';
            card.style.transform = `rotateY(${rotY}deg) rotateX(${rotX}deg) scale(${zoom})`;
            const mx = 50 + rotY * 0.4, my = 50 + rotX * 0.8;
            card.style.setProperty('--sheen-x', mx + '%');
            card.style.setProperty('--sheen-y', my + '%');
        }

        // ── 风格 ────────────────────────────────────────────────────────────────
        function stylePromptPrefix(style){
            if(!style) return '';
            return `参考所给图片的风格，生成时保持相同的画风、配色与质感：${style.name}。`;
        }
        function selectStyle(style){
            selectedStyle = style ? {skillId:style.skill_id, name:style.name, urls:(style.images || []).map(i => i.url).filter(Boolean).slice(0, STYLE_REF_LIMIT), scope:style.scope || 'personal'} : null;
            renderStylePanel();
        }
        function toggleStylePanel(ev){
            if(ev?.stopPropagation) ev.stopPropagation();
            const panel = document.getElementById('stylePanel');
            panel?.classList.toggle('hidden');
        }

        async function canvasToBlob(canvas, name){
            return new Promise(resolve => {
                if(!canvas) { resolve(null); return; }
                canvas.toBlob(blob => resolve(blob), 'image/png');
            });
        }
        async function uploadRefBlob(blob, name){
            if(!blob) return null;
            const form = new FormData();
            form.append('files', blob, name || `ref_${Date.now()}.png`);
            try {
                const data = await fetch('/api/ai/upload', {method:'POST', body:form}).then(r => r.json());
                return data?.files?.[0] || null;
            } catch(err) { return null; }
        }
        async function replaceRefImage(slot, file, dim){
            if(!file?.url) return false;
            refs[slot] = {...(refs[slot] || {}), ...file};
            const prev = document.getElementById(`prev${slot}`);
            if(prev){ prev.src = file.url; prev.classList.remove('hidden'); }
            const del = document.getElementById(`del${slot}`);
            if(del) del.classList.remove('hidden');
            if(dim?.width && dim?.height) refDims[slot] = {width:dim.width, height:dim.height};
            // 🚨 参考图变了，之前的遮罩坐标全部失效
            slotMask[slot] = null;
            rePendingMask = null; rePendingMaskUrl = ''; rePendingPreview = '';
            refMaskBadge(slot);
            updateSizeUI();
            if(REF_EDITOR_BRIDGE && window.parent !== window){
                window.parent.postMessage({ type:'xvai-ref-edited', url:file.url, slot }, '*');
            }
            return true;
        }
        if(REF_EDITOR_BRIDGE && REF_EDITOR_BRIDGE.src){
            document.body.style.background = '#0b0f14';
            document.body.classList.add('re-solo');
            // 不挂在 window load 上：页面里有需要鉴权的图片会 401，load 可能永远不触发
            refs[1] = { url:REF_EDITOR_BRIDGE.src, name:'edit.png' };
            // 弹窗原本嵌在 .page-wrap 里，fixed 定位会相对那个容器算，顶部留一条黑边；
            // 桥接模式把它挪到 body 下，inset:0 才是真的整窗
            const bridgeOverlay = document.getElementById('refEditModal');
            if(bridgeOverlay && bridgeOverlay.parentElement !== document.body) document.body.appendChild(bridgeOverlay);
            openRefEditor(1, REF_EDITOR_BRIDGE.mode);
        }
        function toastSafe(text){
            if(!text) return;
            let el = document.getElementById('reToast');
            if(!el){
                el = document.createElement('div');
                el.id = 'reToast';
                el.className = 're-toast';
                document.body.appendChild(el);
            }
            el.textContent = text;
            el.classList.add('show');
            clearTimeout(el._t);
            el._t = setTimeout(() => el.classList.remove('show'), 3200);
        }
        function syncRefCursorSizeSafe(){ syncRefCursorSize(); }

        // 有效遮罩：参考图没被换过 / 清过才算，否则坐标对不上
        function activeInpaintMeta(){
            for(const slot of [1,2,3]){
                const meta = slotMask[slot];
                if(!meta) continue;
                // 🚨 比的是「应用遮罩时那张参考图的地址」：base_url 是后端规范化后的地址，未必和 refs[slot].url 一模一样
                const refUrl = meta.ref_url || meta.base_url;
                if(!refs[slot]?.url || refs[slot].url !== refUrl) { slotMask[slot] = null; refMaskBadge(slot); continue; }
                return meta;
            }
            return null;
        }

        /* ── 提示词「风格」：挑一个风格库里的风格，生图时强行并进参考图 + 提示词前缀 ── */
        const STYLE_REF_LIMIT = 3;
        let styleList = null;
        let styleLoading = false;
        let selectedStyle = null;
        function stylePromptPrefix(style){
            const name = String(style?.name || '');
            return `风格要求${name ? `（${name}）` : ''}：严格参照所附参考图的配色、光线、材质、笔触与整体氛围；主体与场景按下述提示词绘制，不要把参考图里的人物或场景照搬进来。`;
        }
        async function loadStyleList(force){
            if(styleList && !force) return styleList;
            styleLoading = true;
            const out = [];
            for(const scope of ['personal','team']){
                try {
                    const data = await fetch(`/api/style-library?scope=${scope}`).then(r => r.ok ? r.json() : null);
                    for(const style of (data?.styles || [])){
                        if(!style?.skill_id) continue;
                        if(style.status !== 'ready' && style.status !== 'shared') continue;
                        const urls = (style.images || []).map(img => img?.url).filter(Boolean).slice(0, STYLE_REF_LIMIT);
                        if(!urls.length) continue;
                        out.push({skillId:String(style.skill_id), name:String(style.name || '未命名风格'), urls, scope});
                    }
                } catch(e) {}
            }
            styleList = out;
            styleLoading = false;
            return out;
        }
        async function toggleStylePanel(event){
            if(event) event.stopPropagation();
            const panel = document.getElementById('stylePanel');
            if(!panel) return;
            if(panel.style.display !== 'none' && !panel.classList.contains('hidden')){ panel.classList.add('hidden'); return; }
            panel.classList.remove('hidden');
            if(!styleList && !styleLoading){
                panel.innerHTML = '<div class="style-hint">加载中…</div>';
                await loadStyleList();
            }
            renderStylePanel();
        }
        function renderStylePanel(){
            const panel = document.getElementById('stylePanel');
            if(!panel) return;
            const list = styleList || [];
            const rows = [`<button type="button" class="style-row${selectedStyle ? '' : ' active'}" data-style-id=""><span class="style-row n">不使用风格</span></button>`];
            for(const style of list){
                rows.push(`<button type="button" class="style-row${selectedStyle?.skillId === style.skillId ? ' active' : ''}" data-style-id="${escapeHtml(style.skillId)}">
                    <img src="${escapeHtml(style.urls[0])}" alt="">
                    <span><span class="n">${escapeHtml(style.name)}</span><br><span class="m">${style.urls.length} 张参考图 · ${style.scope === 'team' ? '团队' : '个人'}</span></span>
                </button>`);
            }
            if(!list.length) rows.push('<div class="style-hint">还没有可用的风格：先到「资产库 → 风格库」传够 3 张参考图并创建</div>');
            panel.innerHTML = rows.join('');
            panel.querySelectorAll('[data-style-id]').forEach(btn => {
                btn.onclick = () => {
                    const id = btn.dataset.styleId || '';
                    selectedStyle = id ? (styleList || []).find(item => item.skillId === id) || null : null;
                    renderStylePanel();
                    const label = document.getElementById('styleBtn');
                    if(label){
                        label.querySelector('span').textContent = selectedStyle ? selectedStyle.name : '风格';
                        label.classList.toggle('active', !!selectedStyle);
                    }
                    panel.classList.add('hidden');
                };
            });
        }
        document.addEventListener('click', event => {
            const panel = document.getElementById('stylePanel');
            if(!panel || panel.classList.contains('hidden')) return;
            if(event.target.closest('#stylePanel') || event.target.closest('#styleBtn')) return;
            panel.classList.add('hidden');
        });

        async function submitImage(){
            const basePrompt = document.getElementById('promptInput').value.trim();
            if(!basePrompt){ alert(tr('online.promptRequired')); return; }
            const btn = document.getElementById('genBtn'), loader = document.getElementById('loader'), placeholder = document.getElementById('placeholder'), out = document.getElementById('outputImg'), dl = document.getElementById('downloadBtn');
            btn.disabled = true; placeholder.classList.add('hidden'); out.classList.add('hidden'); dl.classList.add('hidden'); loader.classList.remove('hidden');
            try {
                // 遮罩局部重绘：参考图换成「裁切局部图 + 对齐遮罩（+ 其它参考图）」，
                // 后端按 mask 羽化回贴成整图；这条路径不带风格（基准图只能是裁切图）。
                const inpaintMeta = activeInpaintMeta();
                const refList = [];
                let prompt = basePrompt;
                if(inpaintMeta){
                    const skip = new Set([inpaintMeta.crop_url, inpaintMeta.crop_mask_url, inpaintMeta.mask_url, inpaintMeta.base_url]);
                    refList.push({url:inpaintMeta.crop_url, name:'inpaint_crop.png', kind:'image'});
                    refList.push({url:inpaintMeta.crop_mask_url, name:'inpaint_mask.png', kind:'image', role:'mask'});
                    [1,2,3].map(id => refs[id]).filter(Boolean).forEach(ref => {
                        if(!ref.url || skip.has(ref.url)) return;
                        refList.push({url:ref.url, name:ref.name || 'ref.png', kind:ref.kind || 'image'});
                    });
                } else {
                    [1,2,3].map(id => refs[id]).filter(Boolean).forEach(ref => refList.push({url:ref.url, name:ref.name || 'ref.png', kind:ref.kind || 'image'}));
                    // 风格：把风格库的参考图强行并进本次生图 + 提示词前缀，不靠模型自觉
                    if(selectedStyle){
                        const seen = new Set(refList.map(ref => ref.url));
                        for(const url of selectedStyle.urls.slice(0, STYLE_REF_LIMIT)){
                            if(seen.has(url)) continue;
                            seen.add(url);
                            refList.push({url, name:'style-ref.png', kind:'image'});
                        }
                        prompt = `${stylePromptPrefix(selectedStyle)}\n${basePrompt}`;
                    }
                }
                const reqBody = {
                    prompt,
                    provider_id:provider,
                    model:selectedModel,
                    size:(inpaintMeta && inpaintMeta.size) || currentSize(),
                    resolution:inpaintMeta ? '' : (resolution === 'custom' ? '' : resolution),
                    aspect_ratio:(inpaintMeta && inpaintMeta.aspect_ratio) || currentAspectRatio(),
                    n:inpaintMeta ? 1 : outputCount,
                    reference_images:refList
                };
                if(inpaintMeta){
                    reqBody.operation = 'inpaint';
                    reqBody.inpaint = {
                        base_url:inpaintMeta.base_url,
                        base_name:'',
                        mask_url:inpaintMeta.mask_url || '',
                        crop_url:inpaintMeta.crop_url,
                        crop_mask_url:inpaintMeta.crop_mask_url,
                        bbox:(inpaintMeta.bbox || []).slice(0, 4).map(v => Math.round(Number(v) || 0)),
                        base_w:Math.round(Number(inpaintMeta.base_w) || 0),
                        base_h:Math.round(Number(inpaintMeta.base_h) || 0),
                        aspect_ratio:inpaintMeta.aspect_ratio || '',
                        size:inpaintMeta.size || '',
                        feather:Math.round(Number(inpaintMeta.feather) || 0)
                    };
                }
                if(QUALITY_PROTOCOLS.has(providerProtocol(provider))) reqBody.quality = quality;
                const result = await fetch('/api/online-image', {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body:JSON.stringify(reqBody)
                }).then(async r => { if(!r.ok) throw new Error((await r.json()).detail || '生成失败'); return r.json(); });
                currentResult = result; out.src = result.images[0]; out.classList.remove('hidden'); dl.href = result.images[0]; dl.classList.remove('hidden'); renderImageCard(result, true);
            } catch(err) {
                alert(err.message || 'Generation failed'); placeholder.classList.remove('hidden');
            } finally {
                loader.classList.add('hidden'); btn.disabled = false;
            }
        }

        function renderImageCard(data, isNew=false){
            if(!data.images?.[0] || document.getElementById(`history-${data.timestamp}`)) return;
            const card = document.createElement('div');
            card.id = `history-${data.timestamp}`;
            card.dataset.historyTs = data.timestamp;
            card.className = 'masonry-item group relative cursor-zoom-in';
            card.onclick = () => { if(document.body.classList.contains('history-bulk-selecting')) return; openLightbox(data); };
            const multi = Array.isArray(data.images) && data.images.length > 1
                ? `<div class="absolute top-3 right-3 bg-black/60 text-white text-[10px] font-black px-2 py-0.5 rounded-full pointer-events-none">×${data.images.length}</div>` : '';
            card.innerHTML = `<img src="${data.images[0]}" class="w-full h-full object-cover block group-hover:scale-105 transition-transform duration-1000" loading="lazy">${multi}
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 p-6 flex flex-col justify-end"><p class="text-white text-[10px] font-medium line-clamp-2 uppercase tracking-wider">${data.prompt || tr('online.onlineImageFallback')}</p></div>`;
            isNew ? document.getElementById('masonry').prepend(card) : document.getElementById('masonry').appendChild(card);
            lucide.createIcons();
        }
        async function loadHistory(page=0){
            if(isLoading) return; isLoading = true;
            const loader = document.getElementById('loadMoreTrigger');
            if(page === 0){ loader.innerText = tr('online.loadingArchives'); allHistory = await fetch('/api/history?type=online').then(r=>r.json()); document.getElementById('masonry').innerHTML=''; currentIndex=0; }
            const next = allHistory.slice(currentIndex, currentIndex + PAGE_SIZE);
            next.forEach(item => renderImageCard(item)); currentIndex += next.length;
            loader.classList.toggle('hidden', currentIndex >= allHistory.length);
            loader.innerText = tr('online.loadMore'); isLoading = false;
        }
        let lightboxPreview = null;
        function ensureLightboxPreview(){
            if(!lightboxPreview && window.StudioImagePreview){
                lightboxPreview = StudioImagePreview.attach(document.getElementById('lightboxFrame'));
            }
            return lightboxPreview;
        }
        function openLightbox(data){
            currentLightboxData = data;
            const img = document.getElementById('lightboxImg');
            const res = document.getElementById('lightboxRes');
            res.textContent = '...';
            ensureLightboxPreview();
            if(lightboxPreview) lightboxPreview.reset();
            img.onload = () => { res.textContent = img.naturalWidth && img.naturalHeight ? `${img.naturalWidth} x ${img.naturalHeight}` : (data.params?.size || '--'); };
            img.src = data.images[0];
            document.getElementById('lightboxPrompt').textContent = data.prompt || '';
            document.getElementById('lightbox').classList.replace('hidden','flex');
            document.body.style.overflow='hidden';
            lucide.createIcons();
        }
        function closeLightbox(){
            if(lightboxPreview) lightboxPreview.reset();
            document.getElementById('lightbox').classList.replace('flex','hidden');
            document.body.style.overflow='auto';
        }
        function handleOutsideClick(e){ if(e.target.id === 'lightbox') closeLightbox(); }
        async function downloadLightboxImage(e){
            e.stopPropagation();
            const url = currentLightboxData?.images?.[0];
            if(!url) return;
            const res = await fetch(url);
            if(!res.ok) return alert('下载失败');
            const blob = await res.blob();
            const clean = url.split('?')[0];
            const ext = clean.includes('.') ? clean.split('.').pop() : 'png';
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `online-image-${Date.now()}.${ext || 'png'}`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        }
        function zoomImage(){ if(currentResult) openLightbox(currentResult); }
        function applySameStyle(){
            if(!currentLightboxData) return;
            document.getElementById('promptInput').value = currentLightboxData.prompt || '';
            [1,2,3].forEach(id => clearSlot(id));
            (currentLightboxData.params?.reference_images || []).slice(0,3).forEach((ref,i) => {
                refs[i+1] = ref; const prev = document.getElementById(`prev${i+1}`);
                prev.src = ref.url; prev.classList.remove('hidden'); document.getElementById(`del${i+1}`).classList.remove('hidden');
                refToolBar(i+1, true);
                getImageDimensions(ref.url).then(dim => {
                    refDims[i+1] = dim;
                    updateSizeUI();
                }).catch(() => {});
            });
            const savedResolution = String(currentLightboxData.params?.resolution || '').toLowerCase();
            const savedAspectRatio = String(currentLightboxData.params?.aspect_ratio || '').toLowerCase();
            const size = currentLightboxData.params?.size || '1024x1024';
            if(savedAspectRatio === 'auto' && isGrsaiNanoModel()){
                setRatio('auto');
                setResolution(savedResolution || '1k');
                closeLightbox(); window.scrollTo({top:0, behavior:'smooth'});
                return;
            }
            const matchedRatio = Object.keys(SIZE_OPTIONS).find(key => SIZE_OPTIONS[key].some(([value]) => value === size)) || 'square';
            const matchedRes = ['1k','2k','4k'].includes(savedResolution)
                ? savedResolution
                : SIZE_OPTIONS[matchedRatio]?.find(([value]) => value === size)?.[1];
            if(matchedRes) {
                setRatio(matchedRatio, size);
                setResolution(matchedRes);
            } else {
                setResolution('custom');
                const parsed = parseSizeValue(size);
                customWidth = parsed?.width || '';
                customHeight = parsed?.height || '';
                updateSizeUI();
            }
            closeLightbox(); window.scrollTo({top:0, behavior:'smooth'});
        }
        async function deleteHistoryItem(ts, ev){
            ev.stopPropagation();
            if(!confirm(tr('online.deleteConfirm'))) return;
            const res = await fetch('/api/history/delete', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({timestamp:ts})}).then(r=>r.json());
            if(res.success) document.getElementById(`history-${ts}`)?.remove();
        }
        const observer = new IntersectionObserver(entries => { if(entries[0].isIntersecting && currentIndex < allHistory.length) loadHistory(1); }, {threshold:.1});
        window.onload = async () => { applyLanguage(); setRatio('square'); setResolution('1k'); await initModels(); await loadHistory(0); window.HistoryBulkManager?.attach({masonry:'#masonry'}); observer.observe(document.getElementById('loadMoreTrigger')); document.getElementById('loadMoreTrigger').onclick = () => loadHistory(1); };
    </script>
    <div id="reCursor" class="re-cursor" style="display:none"></div>
</body>
