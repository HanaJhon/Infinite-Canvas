<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的积分 · Infinite Canvas</title>
<style>
  :root{--bg:#f7f8fb;--card:#fff;--text:#141821;--dim:#6b7280;--line:#e6e8ef;--accent:#141821;--soft:#f1f3f8;--danger:#e5484d;--gold:#b7791f;--ok:#1a7f4b}
  @media (prefers-color-scheme:dark){:root{--bg:#0b0d12;--card:#151922;--text:#e8ecf4;--dim:#8b94a6;--line:#252b38;--accent:#e8ecf4;--soft:#1b202b;--gold:#e0b266;--ok:#4ade80}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif}
  .wrap{max-width:880px;margin:0 auto;padding:32px 20px 70px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}
  h1{font-size:19px;margin:0}
  .back{font-size:12.5px;color:var(--dim);text-decoration:none;padding:6px 12px;border-radius:8px;border:1px solid var(--line)}
  .back:hover{background:var(--soft)}
  .balance{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .balance .big{font-size:34px;font-weight:900;letter-spacing:-.02em;color:var(--gold);font-variant-numeric:tabular-nums}
  .balance .who{font-size:12.5px;color:var(--dim);margin-top:4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
  .card h2{font-size:13px;margin:0 0 12px;font-weight:800;display:flex;gap:8px;align-items:center}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  /* 🚨 .preset 是 button，别继承上面 button{height:38px}——会被压成一行高、内容溢出卡片 */
  .preset{height:auto;min-height:72px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--soft);cursor:pointer;text-align:center;font:inherit;color:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
  .preset:hover{border-color:var(--gold)}
  .preset.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(183,121,31,.18);background:var(--card)}
  .preset b{display:block;font-size:15px;color:var(--gold)}
  .preset span{font-size:11.5px;color:var(--dim)}
  .pay-list{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
  .pay{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;min-width:150px}
  /* 收款码默认不显示，悬浮（或键盘聚焦）才亮出来，避免页面上一直摊着一堆二维码 */
  .pay img{display:none;width:150px;height:150px;object-fit:contain;border-radius:8px;background:#fff}
  .pay .qr-hint{display:flex;align-items:center;justify-content:center;width:150px;height:150px;margin:0 auto;border-radius:8px;border:1px dashed var(--line);color:var(--dim);font-size:12px}
  .pay:hover img,.pay:focus-within img{display:block}
  .pay:hover .qr-hint,.pay:focus-within .qr-hint{display:none}
  @media (hover:none){.pay img{display:block}.pay .qr-hint{display:none}}
  .pay .lbl{font-size:12px;font-weight:700;margin-bottom:6px}
  .pay a{font-size:12px;color:var(--gold);word-break:break-all}
  input,select{height:38px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:var(--soft);color:var(--text);font-size:13px;outline:none}
  input:focus{border-color:var(--accent)}
  input.grow{flex:1;min-width:180px}
  button{height:38px;padding:0 16px;border:0;border-radius:9px;background:var(--accent);color:var(--bg);font-size:13px;font-weight:700;cursor:pointer}
  button:hover{opacity:.88}
  button.gold{background:var(--gold);color:#fff}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .msg{font-size:12.5px;min-height:18px;margin-top:10px}
  .msg.ok{color:var(--ok)}.msg.err{color:var(--danger)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
  th{font-size:11px;color:var(--dim);letter-spacing:.04em}
  .plus{color:var(--ok);font-weight:800}
  .minus{color:var(--danger);font-weight:800}
  .hint{font-size:12px;color:var(--dim);line-height:1.7}
  .empty{color:var(--dim);font-size:12.5px;padding:10px 0}
</style>
<link rel="stylesheet" href="/static/css/liquid-glass.css?v=1.3.7.1793776698" />
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>我的积分</h1>
    <a class="back" href="/index.html">返回画布</a>
  </div>

  <div class="balance">
    <div>
      <div class="big" id="balance">…</div>
      <div class="who" id="who"></div>
    </div>
    <div class="hint" id="rateHint"></div>
  </div>

  <div class="card">
    <h2>充值</h2>
    <div class="hint" id="topupHint">选择下面的额度，扫码或联系管理员付款后提交申请，管理员确认后积分到账。</div>
    <div class="grid" id="presets" style="margin-top:12px"></div>
    <div class="pay-list" id="payments"></div>
    <div class="row" style="margin-top:14px">
      <input id="reference" class="grow" placeholder="付款凭证（可选，例如订单号 / 转账备注）" />
      <button class="gold" id="submitTopup">提交充值申请</button>
    </div>
    <div class="msg" id="topupMsg"></div>
  </div>

  <div class="card">
    <h2>我的充值申请</h2>
    <div id="myTopups"></div>
  </div>

  <div class="card">
    <h2>积分流水</h2>
    <div id="ledger"></div>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var data = null;
  var selectedPreset = null;

  function api(path, opts) {
    return fetch(path, Object.assign({ credentials: 'same-origin' }, opts || {})).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) throw new Error(d.detail || ('请求失败 ' + r.status));
        return d;
      });
    });
  }

  function fmt(n) {
    var v = Number(n || 0);
    if (!isFinite(v)) v = 0;
    return v.toFixed(2).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1');
  }

  function fmtTime(ts) {
    if (!ts) return '';
    var d = new Date(ts * 1000);
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  var METHOD_LABEL = { wechat: '微信', alipay: '支付宝', paypal: 'PayPal', bank: '银行卡', other: '其它' };

  function renderPresets() {
    var box = $('presets');
    var list = (data.public.presets || []);
    box.innerHTML = '';
    if (!list.length) {
      box.innerHTML = '<div class="empty">管理员还没有配置充值套餐，请直接联系管理员充值。</div>';
      return;
    }
    if (!selectedPreset) selectedPreset = list[0].id;
    list.forEach(function (p) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'preset' + (p.id === selectedPreset ? ' on' : '');
      var own = boundPayment(p.id);
      b.innerHTML = '<b>' + fmt(p.credits) + ' 积分</b><span>' + (p.label || '') + '</span>'
        + '<span style="display:block;margin-top:4px">￥' + fmt(p.price_cny) + (p.price_usd ? ' / $' + fmt(p.price_usd) : '') + '</span>';
      if (own) {
        var tag = document.createElement('span');
        tag.style.cssText = 'display:block;margin-top:4px;font-size:11px;opacity:.72';
        tag.textContent = own.kind === 'link' ? '点我直接去付款 →' : '点我出专属收款码';
        b.appendChild(tag);
      }
      b.onclick = function () {
        selectedPreset = p.id;
        renderPresets();
        renderPayments(true);
        // 绑了链接的套餐：点一下直接跳去付款；绑了二维码的就在下面出码
        if (own && own.kind === 'link' && own.value) window.open(own.value, '_blank', 'noopener');
      };
      box.appendChild(b);
    });
  }

  // 当前套餐绑定的专属收款方式（没绑就用全部收款方式）
  function boundPayment(presetId) {
    var payId = ((data.public.presets || []).filter(function (p) { return p.id === presetId; })[0] || {}).pay_id;
    if (!payId) return null;
    return (data.public.payments || []).filter(function (m) { return m.id === payId; })[0] || null;
  }

  var DEFAULT_TOPUP_HINT = '选择下面的额度，扫码或联系管理员付款后提交申请，管理员确认后积分到账。';
  // 老板 2026-11-13：静态状态不要直接铺出收款码/链接，点了套餐才显示
  var payVisible = false;

  function renderPayments(show) {
    if (show !== undefined) payVisible = !!show;
    var box = $('payments');
    var hint = $('topupHint');
    var own = boundPayment(selectedPreset);
    if (hint) {
      hint.textContent = payVisible && own
        ? '当前套餐已选定专属收款方式：' + (own.kind === 'qr' ? '扫码付款后提交申请。' : '已在新标签页打开付款页面，付完回来提交申请。')
        : DEFAULT_TOPUP_HINT;
    }
    box.innerHTML = '';
    if (!payVisible) return;
    var list = own ? [own] : (data.public.payments || []);
    if (!list.length) {
      box.innerHTML = '<div class="empty">管理员还没有上传收款二维码，请联系管理员付款。</div>';
      return;
    }
    list.forEach(function (m) {
      var boxEl = document.createElement('div');
      boxEl.className = 'pay';
      boxEl.tabIndex = 0;   // 键盘也能「悬浮」出收款码
      var lbl = document.createElement('div');
      lbl.className = 'lbl';
      lbl.textContent = (METHOD_LABEL[m.method] || m.method) + ' · ' + (m.label || '');
      boxEl.appendChild(lbl);
      if (m.kind === 'qr' && m.value) {
        var img = document.createElement('img');
        img.src = m.value;
        img.alt = m.label || '';
        boxEl.appendChild(img);
        var qrHint = document.createElement('div');
        qrHint.className = 'qr-hint';
        qrHint.textContent = '悬浮查看收款码';
        boxEl.appendChild(qrHint);
      } else {
        var a = document.createElement('a');
        a.href = m.value;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = '打开收款链接';
        boxEl.appendChild(a);
      }
      if (m.note) {
        var note = document.createElement('div');
        note.className = 'hint';
        note.textContent = m.note;
        boxEl.appendChild(note);
      }
      box.appendChild(boxEl);
    });
  }

  function renderTopups() {
    var box = $('myTopups');
    var list = data.topups || [];
    if (!list.length) { box.innerHTML = '<div class="empty">还没有提交过充值申请</div>'; return; }
    var tb = document.createElement('table');
    tb.innerHTML = '<thead><tr><th>时间</th><th>额度</th><th>支付</th><th>状态</th></tr></thead>';
    var body = document.createElement('tbody');
    list.forEach(function (r) {
      var tr = document.createElement('tr');
      tr.innerHTML = '<td>' + fmtTime(r.created_at) + '</td>'
        + '<td>' + fmt(r.credits) + ' 积分（￥' + fmt(r.price_cny) + '）</td>'
        + '<td>' + (METHOD_LABEL[r.method] || r.method) + '</td>'
        + '<td>' + (r.status === 'pending' ? '等待确认' : r.status === 'approved' ? '<span class="plus">已到账</span>' : '<span class="minus">已驳回</span>') + '</td>';
      body.appendChild(tr);
    });
    tb.appendChild(body);
    box.innerHTML = '';
    box.appendChild(tb);
  }

  function renderLedger() {
    var box = $('ledger');
    var list = data.ledger || [];
    if (!list.length) { box.innerHTML = '<div class="empty">还没有积分变动</div>'; return; }
    var tb = document.createElement('table');
    tb.innerHTML = '<thead><tr><th>时间</th><th>变动</th><th>原因</th><th>余额</th></tr></thead>';
    var body = document.createElement('tbody');
    list.forEach(function (e) {
      var tr = document.createElement('tr');
      var delta = Number(e.delta || 0);
      tr.innerHTML = '<td>' + fmtTime(e.created_at) + '</td>'
        + '<td class="' + (delta >= 0 ? 'plus' : 'minus') + '">' + (delta >= 0 ? '+' : '') + fmt(delta) + '</td>'
        + '<td>' + (e.reason || e.kind || '') + '</td>'
        + '<td>' + fmt(e.balance) + '</td>';
      body.appendChild(tr);
    });
    tb.appendChild(body);
    box.innerHTML = '';
    box.appendChild(tb);
  }

  function renderAll() {
    $('balance').textContent = fmt(data.balance) + ' 积分';
    $('who').textContent = (data.user.seq ? '#' + data.user.seq + ' · ' : '') + (data.user.name || '')
      + (data.user.id ? ' · ID ' + data.user.id : '');
    var rate = data.public.rate || {};
    $('rateHint').innerHTML = '当前汇率：1 积分 = ￥' + fmt(rate.credit_per_cny) + ' / $' + fmt(rate.credit_per_usd)
      + (rate.note ? '<br>' + rate.note : '')
      + '<br>' + (data.public.auto_deduct ? '运行模型时会自动扣积分' : '当前不自动扣积分')
      + (data.public.enforce_balance ? '（余额不足将拦截）' : '（余额不足不拦截）');
    renderPresets();
    renderPayments(false);
    renderTopups();
    renderLedger();
  }

  function load() {
    return api('/api/credits/me').then(function (d) {
      data = d;
      renderAll();
    }).catch(function (e) {
      $('balance').textContent = '—';
      $('topupMsg').textContent = e.message;
      $('topupMsg').className = 'msg err';
    });
  }

  $('submitTopup').onclick = function () {
    if (!selectedPreset) { alert('请先选择一个充值额度'); return; }
    var preset = (data.public.presets || []).filter(function (p) { return p.id === selectedPreset; })[0];
    var methods = data.public.payments || [];
    var own = boundPayment(selectedPreset);
    var method = own ? own.method : 'other';
    if (own) {
      // 套餐绑定了专属收款方式就不用再问用哪个渠道
    } else if (methods.length) {
      var names = methods.map(function (m) { return METHOD_LABEL[m.method] || m.method; }).join(' / ');
      var picked = prompt('用哪种方式付款？\n' + names, METHOD_LABEL[methods[0].method] || methods[0].method);
      if (picked === null) return;
      var hit = methods.filter(function (m) { return (METHOD_LABEL[m.method] || m.method) === picked; })[0];
      method = hit ? hit.method : methods[0].method;
    }
    var msg = $('topupMsg');
    msg.textContent = '提交中…';
    msg.className = 'msg';
    api('/api/credits/topups', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        preset_id: selectedPreset,
        method: method,
        reference: $('reference').value.trim()
      })
    }).then(function () {
      $('reference').value = '';
      msg.textContent = '已提交，管理员确认后「' + fmt(preset.credits) + '」积分会到账';
      msg.className = 'msg ok';
      load();
    }).catch(function (e) {
      msg.textContent = e.message;
      msg.className = 'msg err';
    });
  };

  load();
})();
</script>
</body>
</html>
