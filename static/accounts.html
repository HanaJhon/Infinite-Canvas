<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>账号与积分管理 · Infinite Canvas</title>
<style>
  :root{--bg:#f7f8fb;--card:#fff;--text:#141821;--dim:#6b7280;--line:#e6e8ef;--accent:#141821;--soft:#f1f3f8;--danger:#e5484d;--gold:#b7791f;--ok:#1a7f4b}
  @media (prefers-color-scheme:dark){:root{--bg:#0b0d12;--card:#151922;--text:#e8ecf4;--dim:#8b94a6;--line:#252b38;--accent:#e8ecf4;--soft:#1b202b;--gold:#e0b266;--ok:#4ade80}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:32px 20px 60px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
  h1{font-size:19px;margin:0}
  .back{font-size:12.5px;color:var(--dim);text-decoration:none;padding:6px 12px;border-radius:8px;border:1px solid var(--line)}
  .back:hover{background:var(--soft)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
  .card h2{font-size:13px;margin:0 0 12px;color:var(--dim);font-weight:700;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input,select{height:38px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:var(--soft);color:var(--text);font-size:13px;outline:none;min-width:120px}
  input:focus,select:focus{border-color:var(--accent)}
  input.grow{flex:1}
  button{height:38px;padding:0 16px;border:0;border-radius:9px;background:var(--accent);color:var(--bg);font-size:13px;font-weight:700;cursor:pointer}
  button:hover{opacity:.88}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:600;height:32px;padding:0 12px;font-size:12.5px}
  button.danger{background:transparent;border:1px solid var(--line);color:var(--danger);font-weight:600;height:32px;padding:0 12px;font-size:12.5px}
  button.gold{background:rgba(183,121,31,.12);border:1px solid rgba(183,121,31,.35);color:var(--gold);font-weight:700;height:32px;padding:0 12px;font-size:12.5px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.04em}
  tr:last-child td{border-bottom:0}
  .badge{display:inline-block;padding:2px 7px;border-radius:999px;background:var(--soft);font-size:10.5px;font-weight:700;color:var(--dim)}
  .badge.admin{background:rgba(20,24,33,.9);color:#fff}
  .seq{font-variant-numeric:tabular-nums;color:var(--dim);font-weight:700}
  .uid{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--dim)}
  .uid-chip{height:21px;padding:0 8px;border-radius:6px;border:1px solid var(--line);background:var(--soft);color:var(--dim);font-family:ui-monospace,Consolas,monospace;font-size:10.5px;font-weight:700;cursor:copy;letter-spacing:.01em}
  .uid-chip:hover{border-color:var(--accent);color:var(--text);opacity:1}
  .credits{font-variant-numeric:tabular-nums;font-weight:800;color:var(--gold);white-space:nowrap}
  .credits small{font-weight:600;color:var(--dim);font-size:10.5px;margin-left:3px}
  .ops{display:flex;gap:6px;flex-wrap:wrap}
  .msg{margin-top:10px;font-size:12.5px;min-height:18px}
  .msg.err{color:var(--danger)}
  .msg.ok{color:var(--ok)}
  .muted{color:var(--dim);font-size:12px}
  .empty{padding:18px 0;text-align:center;color:var(--dim);font-size:12.5px}
</style>
<link rel="stylesheet" href="/static/css/liquid-glass.css?v=1.3.7.1793776698" />
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>账号与积分管理</h1>
    <div style="display:flex;gap:8px">
      <a class="back" href="/credits-admin.html">积分与计费</a>
      <a class="back" href="/index.html">返回画布</a>
    </div>
  </div>

  <div class="card">
    <h2>新增账号</h2>
    <div class="row">
      <input id="newName" class="grow" placeholder="账号（2-24 位，中英文/数字/_ -）" />
      <input id="newPw" type="password" placeholder="密码（至少 6 位）" />
      <input id="newEmail" placeholder="邮箱（选填）" />
      <input id="newCredits" type="number" step="0.01" placeholder="初始积分" style="width:120px" />
      <button id="addBtn">创建</button>
    </div>
    <div class="msg" id="addMsg"></div>
    <p class="muted" style="margin:10px 0 0">新账号的画布与 Agent 记录从空白开始，互不影响；工作流库与团队资产库是共享的。</p>
  </div>

  <div class="card">
    <h2>所有账号 <span class="muted" id="countHint" style="font-weight:400"></span></h2>
    <div class="row" style="margin-bottom:12px">
      <input id="search" class="grow" placeholder="搜索：账号名 / 账号 ID / 序号（如 3 或 u_ab12…）" />
      <button class="ghost" id="clearSearch">清空</button>
    </div>
    <table>
      <thead>
        <tr>
          <th style="width:56px">序号</th>
          <th>账号</th>
          <th style="width:78px">角色</th>
          <th style="width:120px">积分余额</th>
          <th style="width:250px">操作</th>
        </tr>
      </thead>
      <tbody id="tbody"><tr><td colspan="5" class="muted">加载中…</td></tr></tbody>
    </table>
  </div>

  <div class="card">
    <h2>充值申请 <span class="muted" id="topupHint" style="font-weight:400"></span></h2>
    <div id="topupList"><div class="empty">加载中…</div></div>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var me = null;
  var allUsers = [];
  var rate = { credit_per_cny: 1, credit_per_usd: 1, note: '' };

  function api(path, opts) {
    return fetch(path, Object.assign({ credentials: 'same-origin' }, opts || {}))
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) {
          if (!r.ok) throw new Error(d.detail || ('请求失败 ' + r.status));
          return d;
        });
      });
  }

  function post(path, body) {
    return api(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    });
  }

  function setMsg(node, text, kind) {
    node.textContent = text || '';
    node.className = 'msg' + (kind ? ' ' + kind : '');
  }

  function fmtCredits(v) {
    var n = Number(v || 0);
    if (!isFinite(n)) n = 0;
    return n.toFixed(2).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1');
  }

  function fmtTime(ts) {
    if (!ts) return '';
    var d = new Date(ts * 1000);
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function matches(u, q) {
    if (!q) return true;
    var s = q.toLowerCase().trim();
    if (!s) return true;
    if (String(u.name || '').toLowerCase().indexOf(s) >= 0) return true;
    if (String(u.id || '').toLowerCase().indexOf(s) >= 0) return true;
    if (String(u.seq || '') === s) return true;
    if (String(u.seq || '').indexOf(s) === 0) return true;
    if (String(u.email || '').toLowerCase().indexOf(s) >= 0) return true;
    if (String(u.phone || '').indexOf(s) >= 0) return true;
    return false;
  }

  function adjust(u, mode) {
    var label = mode === 'set' ? '设定「' + u.name + '」的积分余额为：'
      : mode === 'add' ? '给「' + u.name + '」增加多少积分？'
      : '从「' + u.name + '」扣减多少积分？';
    var raw = prompt(label, mode === 'set' ? fmtCredits(u.credits) : '10');
    if (raw === null) return;
    var amount = Number(raw);
    if (!isFinite(amount)) { alert('请输入数字'); return; }
    post('/api/credits/users/' + u.id + '/adjust', { mode: mode, amount: amount, reason: '管理员操作' })
      .then(function (d) {
        setMsg($('addMsg'), '', '');
        flash('「' + u.name + '」当前积分：' + fmtCredits(d.balance));
        load();
      })
      .catch(function (e) { alert(e.message); });
  }

  var flashTimer = 0;
  function flash(text) {
    var hint = $('countHint');
    hint.textContent = text;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { updateCount(); }, 2600);
  }

  function updateCount() {
    var shown = allUsers.filter(function (u) { return matches(u, $('search').value); }).length;
    $('countHint').textContent = '（共 ' + allUsers.length + ' 个' + (shown !== allUsers.length ? '，筛出 ' + shown : '') + '）';
  }

  function render() {
    var tb = $('tbody');
    var q = $('search').value;
    var users = allUsers.filter(function (u) { return matches(u, q); });
    updateCount();
    if (!users.length) {
      tb.innerHTML = '<tr><td colspan="5" class="empty">没有匹配的账号</td></tr>';
      return;
    }
    tb.innerHTML = '';
    users.forEach(function (u) {
      var tr = document.createElement('tr');

      var tdSeq = document.createElement('td');
      tdSeq.className = 'seq';
      tdSeq.textContent = u.seq || '-';
      tr.appendChild(tdSeq);

      var tdName = document.createElement('td');
      var nameLine = document.createElement('div');
      nameLine.textContent = u.name;
      if (u.id === me.id) {
        var you = document.createElement('span');
        you.className = 'badge';
        you.style.marginLeft = '6px';
        you.textContent = '我';
        nameLine.appendChild(you);
      }
      tdName.appendChild(nameLine);
      var sub = document.createElement('div');
      sub.className = 'uid';
      sub.textContent = u.id + (u.email ? ' · ' + u.email : '') + (u.phone ? ' · ' + u.phone : '');
      tdName.appendChild(sub);
      tr.appendChild(tdName);

      var tdRole = document.createElement('td');
      var b = document.createElement('span');
      b.className = 'badge' + (u.role === 'admin' ? ' admin' : '');
      b.textContent = u.role === 'admin' ? '管理员' : '成员';
      tdRole.appendChild(b);
      tr.appendChild(tdRole);

      var tdCredits = document.createElement('td');
      var c = document.createElement('span');
      c.className = 'credits';
      c.textContent = fmtCredits(u.credits) + ' 积分';
      tdCredits.appendChild(c);
      tr.appendChild(tdCredits);

      var tdOps = document.createElement('td');
      var ops = document.createElement('div');
      ops.className = 'ops';

      var addBtn = document.createElement('button');
      addBtn.className = 'gold';
      addBtn.textContent = '充值';
      addBtn.onclick = function () { adjust(u, 'add'); };
      ops.appendChild(addBtn);

      var subBtn = document.createElement('button');
      subBtn.className = 'ghost';
      subBtn.textContent = '扣减';
      subBtn.onclick = function () { adjust(u, 'sub'); };
      ops.appendChild(subBtn);

      var setBtn = document.createElement('button');
      setBtn.className = 'ghost';
      setBtn.textContent = '设为';
      setBtn.onclick = function () { adjust(u, 'set'); };
      ops.appendChild(setBtn);

      var pwBtn = document.createElement('button');
      pwBtn.className = 'ghost';
      pwBtn.textContent = '重置密码';
      pwBtn.onclick = function () {
        var pw = prompt('给「' + u.name + '」设置新密码（至少 6 位）：');
        if (!pw) return;
        post('/api/auth/users/' + u.id + '/password', { password: pw })
          .then(function () { alert('已重置，该账号需要重新登录'); })
          .catch(function (e) { alert(e.message); });
      };
      ops.appendChild(pwBtn);

      if (u.id !== me.id) {
        var delBtn = document.createElement('button');
        delBtn.className = 'danger';
        delBtn.textContent = '删除';
        delBtn.onclick = function () {
          if (!confirm('删除账号「' + u.name + '」？\n该账号的画布和 Agent 记录会一并删除，无法恢复。')) return;
          api('/api/auth/users/' + u.id, { method: 'DELETE' })
            .then(load).catch(function (e) { alert(e.message); });
        };
        ops.appendChild(delBtn);
      }

      tdOps.appendChild(ops);
      tr.appendChild(tdOps);
      tb.appendChild(tr);
    });
  }

  var PAY_LABEL = { wechat: '微信', alipay: '支付宝', paypal: 'PayPal', bank: '银行卡', other: '其它' };

  function copyText(text) {
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function () {});
      return;
    }
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  function renderTopups(list) {
    var box = $('topupList');
    var pending = list.filter(function (r) { return r.status === 'pending'; });
    $('topupHint').textContent = pending.length ? '（待处理 ' + pending.length + ' 笔）' : '（暂无待处理）';
    if (!list.length) {
      box.innerHTML = '<div class="empty">还没有充值申请</div>';
      return;
    }
    box.innerHTML = '';
    list.slice(0, 30).forEach(function (r) {
      var row = document.createElement('div');
      row.style.cssText = 'display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)';

      var main = document.createElement('div');
      main.style.cssText = 'flex:1;min-width:260px';

      var uid = r.user_id || r.uid || '';
      var who = document.createElement('div');
      who.style.cssText = 'display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px';

      var nameEl = document.createElement('b');
      nameEl.textContent = (r.user_seq ? '#' + r.user_seq + ' ' : '') + (r.user_name || '未命名用户');
      who.appendChild(nameEl);

      var idEl = document.createElement('button');
      idEl.type = 'button';
      idEl.className = 'uid-chip';
      idEl.textContent = 'ID ' + (uid || '—');
      idEl.title = '点击复制用户 ID';
      idEl.onclick = function () {
        copyText(uid);
        idEl.textContent = '已复制';
        setTimeout(function () { idEl.textContent = 'ID ' + (uid || '—'); }, 1200);
      };
      who.appendChild(idEl);
      main.appendChild(who);

      var detail = document.createElement('div');
      detail.style.cssText = 'font-size:12.5px;line-height:1.6';
      detail.textContent = '申请 ' + fmtCredits(r.credits) + ' 积分'
        + ' · ' + (r.preset_label || '自定义额度')
        + (r.price_cny ? '（￥' + r.price_cny + '）' : '')
        + ' · ' + (PAY_LABEL[r.method] || r.method || '未选支付方式')
        + (r.reference ? ' · 凭证：' + r.reference : '');
      main.appendChild(detail);

      var meta = document.createElement('div');
      meta.className = 'muted';
      meta.textContent = fmtTime(r.created_at) + ' · ' + (r.status === 'pending' ? '待确认' : r.status === 'approved' ? '已到账' : '已驳回');
      main.appendChild(meta);
      row.appendChild(main);

      if (r.status === 'pending') {
        var okBtn = document.createElement('button');
        okBtn.className = 'gold';
        okBtn.textContent = '批准到账';
        okBtn.onclick = function () {
          post('/api/credits/topups/' + r.id + '/approve', {}).then(load).catch(function (e) { alert(e.message); });
        };
        row.appendChild(okBtn);

        var noBtn = document.createElement('button');
        noBtn.className = 'danger';
        noBtn.textContent = '驳回';
        noBtn.onclick = function () {
          post('/api/credits/topups/' + r.id + '/reject', {}).then(load).catch(function (e) { alert(e.message); });
        };
        row.appendChild(noBtn);
      }
      box.appendChild(row);
    });
  }

  function loadTopups() {
    return api('/api/credits/topups').then(function (d) { renderTopups(d.requests || []); })
      .catch(function (e) { $('topupList').innerHTML = '<div class="empty">' + e.message + '</div>'; });
  }

  function load() {
    return Promise.all([api('/api/auth/users'), loadTopups(), api('/api/credits/settings').catch(function () { return null; })])
      .then(function (res) {
        allUsers = (res[0].users || []).slice().sort(function (a, b) { return (a.seq || 0) - (b.seq || 0); });
        if (res[2] && res[2].settings && res[2].settings.rate) rate = res[2].settings.rate;
        render();
      })
      .catch(function (e) {
        $('tbody').innerHTML = '<tr><td colspan="5" class="muted">' + e.message + '</td></tr>';
      });
  }

  $('search').addEventListener('input', function () { render(); });
  $('clearSearch').onclick = function () { $('search').value = ''; render(); };

  $('addBtn').onclick = function () {
    var name = $('newName').value.trim();
    var pw = $('newPw').value;
    if (!name || !pw) { setMsg($('addMsg'), '请填写账号和密码', 'err'); return; }
    var creditsValue = Number($('newCredits').value || 0);
    if (!isFinite(creditsValue)) creditsValue = 0;
    post('/api/auth/users', {
      name: name,
      password: pw,
      email: $('newEmail').value.trim(),
      credits: creditsValue
    }).then(function (d) {
      setMsg($('addMsg'), '已创建「' + name + '」（序号 ' + (d.user && d.user.seq) + '，积分 ' + fmtCredits(d.user && d.user.credits) + '）', 'ok');
      $('newName').value = ''; $('newPw').value = ''; $('newEmail').value = ''; $('newCredits').value = '';
      load();
    }).catch(function (e) { setMsg($('addMsg'), e.message, 'err'); });
  };

  api('/api/auth/me').then(function (d) {
    me = d.user;
    if (!me || me.role !== 'admin') {
      document.querySelector('.wrap').innerHTML =
        '<p style="color:#e5484d">只有管理员可以访问这个页面。</p>';
      return;
    }
    load();
  }).catch(function () { location.replace('/login.html'); });
})();
</script>
</body>
</html>
