<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png?v=1.3.9" type="image/png">
    <title>Infinite Canvas for Lochou</title>
    <style>
        html.studio-route-booting body {
            visibility: hidden !important;
        }
    </style>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
                document.documentElement.classList.add('studio-route-booting');
            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/tailwindcss-cdn.js?v=1.3.9.1767196800"></script>
    <script src="/static/js/theme.js?v=1.3.9.1794556649"></script>
    <script src="/static/js/i18n.js?v=1.3.9.1794585976"></script>
    <style>
        @import url('/static/vendor/css/fonts.css?v=1.3.9.1767196800');

        /* 本地 Tailwind 工具类兜底：CDN 慢/未就绪时也能立刻给图标尺寸，避免首屏左侧栏空白 */
        .w-1\.5 { width: 0.375rem; }
        .h-1\.5 { height: 0.375rem; }
        .w-4 { width: 1rem; }
        .h-4 { height: 1rem; }
        .w-5 { width: 1.25rem; }
        .h-5 { height: 1.25rem; }
        .flex-shrink-0 { flex-shrink: 0; }
        .rounded-full { border-radius: 9999px; }
        .mb-12 { margin-bottom: 3rem; }
        .transition-colors { transition-property: color, background-color, border-color, fill, stroke; transition-duration: 150ms; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
        .animate-pulse { animation: studio-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes studio-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

        :root {
            --accent: #000000;
            --fluid-ease: cubic-bezier(0.3, 0, 0, 1);
            --bg: #ffffff;
            --sidebar-bg: #ffffff;
            --stage-bg: #fcfcfc;
            --border: #f2f2f2;
            --stage-border: #f0f0f0;
            --text: #121212;
            --muted: #999;
            --nav-hover-bg: #fafafa;
            --monitor-bg: rgba(255, 255, 255, 0.7);
            --monitor-border: rgba(0, 0, 0, 0.05);
            --monitor-shadow: rgba(0, 0, 0, 0.04);
            --divider: rgba(0, 0, 0, 0.1);
            --scrollbar: #d8d8d8;
            --scrollbar-hover: #c0c0c0;
            --author-name: #000;
            --social-icon: #ccc;
        }

        html.theme-dark,
        body.theme-dark {
            --bg: #0f141d;
            --sidebar-bg: #0f141d;
            --stage-bg: #111722;
            --border: #242d3b;
            --stage-border: #2a3444;
            --text: #e5e9f0;
            --muted: #8f9aab;
            --nav-hover-bg: #171d29;
            --monitor-bg: rgba(23, 29, 41, 0.82);
            --monitor-border: rgba(255, 255, 255, 0.08);
            --monitor-shadow: rgba(0, 0, 0, 0.3);
            --divider: rgba(255, 255, 255, 0.15);
            --scrollbar: #334155;
            --scrollbar-hover: #475569;
            --author-name: #e5e9f0;
            --social-icon: #64748b;
        }

        /* 极简滚动条 */
        html,
        body {
            overscroll-behavior: auto;
            height: 100%;
            overflow: hidden;
        }

        *::-webkit-scrollbar {
            width: 10px !important;
            height: 10px !important;
            background: transparent !important;
        }

        *::-webkit-scrollbar-track {
            background: transparent !important;
            border: none !important;
        }

        *::-webkit-scrollbar-thumb {
            background-color: var(--scrollbar) !important;
            border: 3px solid transparent !important;
            border-right-width: 3px !important;
            background-clip: padding-box !important;
            border-radius: 10px !important;
            min-height: 36px;
        }

        *::-webkit-scrollbar-thumb:hover {
            background-color: var(--scrollbar-hover) !important;
        }

        *::-webkit-scrollbar-corner {
            background: transparent !important;
        }

        * {
            scrollbar-width: thin !important;
            scrollbar-color: var(--scrollbar) transparent !important;
        }

        body {
            background: var(--bg);
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            height: 100vh;
            color: var(--text);
            transition: background 0.3s, color 0.3s;
        }

        .app-shell {
            display: flex;
            width: 100%;
            height: 100vh;
            background: var(--bg);
            position: relative;
            transition: background 0.3s;
        }

        /* 侧边栏 */
        .sidebar {
            width: 80px;
            min-width: 80px;
            height: 100vh;
            max-height: 100vh;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 1px solid var(--border);
            padding: 40px 0;
            transition: width 0.5s var(--fluid-ease) 0.5s, background 0.3s, border-color 0.3s;
            z-index: 50;
            overflow: hidden;
        }

        .sidebar:hover {
            width: 220px;
            transition-delay: 0s;
        }

        body.studio-scale-host .sidebar {
            height: calc(100vh / var(--studio-ui-scale, 1));
            max-height: calc(100vh / var(--studio-ui-scale, 1));
            zoom: var(--studio-ui-scale, 1);
        }

        /* 首次加载时与 iframe 的 0.5s 淡入同步播放，避免侧栏"焊死"在原地造成视觉断层 */
        @keyframes sidebar-enter {
            from { opacity: 0; transform: translateX(-6px); }
            to { opacity: 1; transform: translateX(0); }
        }
        html:not(.studio-route-booting) .sidebar {
            animation: sidebar-enter 0.5s var(--fluid-ease);
        }

        /* 侧栏 logo：使用启动器同款图标（static/images/logo.png） */
        .logo-ring {
            position: relative;
            width: 36px;
            height: 36px;
            border: 0;
            border-radius: 11px;
            background: transparent;
            padding: 0;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex: 0 0 auto;
            /* 仅保留 hover 真正会用到的属性过渡，避免 transition: all 因首屏属性补齐被意外触发 */
            transition: background-color .18s, box-shadow .2s;
        }

        /* 品牌图形不参与旋转：转动会让图形看起来是歪的，改用轻微抬升 */
        .logo-ring .logo-mark {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 11px;
            object-fit: contain;
            transition: transform .35s var(--fluid-ease), box-shadow .25s;
        }

        .sidebar:hover .logo-ring .logo-mark {
            transform: scale(1.06);
        }

        .logo-ring:hover,
        .logo-ring:focus-visible {
            background: var(--nav-hover-bg);
            box-shadow: 0 0 0 4px rgba(148, 163, 184, .16), 0 10px 24px rgba(15, 23, 42, .08);
            outline: none;
        }

        .logo-ring:hover .logo-mark,
        .logo-ring:focus-visible .logo-mark {
            transform: scale(1.08);
        }

        .logo-ring:active .logo-mark {
            transform: scale(.94);
        }

        /* 队列忙碌指示：常态隐藏，排队时亮蓝点（沿用原 #logo-dot 的语义） */
        #logo-dot {
            position: absolute;
            right: -1px;
            bottom: -1px;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            box-shadow: 0 0 0 2px var(--sidebar-bg);
            opacity: 0;
            transform: scale(.6);
            pointer-events: none;
            transition: transform .16s ease, background-color .16s ease, opacity .16s ease, box-shadow .16s ease;
        }

        .logo-ring.is-queue-busy #logo-dot {
            opacity: 1;
            transform: scale(1);
        }

        /* 导航项 */
        .nav-item {
            position: relative;
            width: 48px;
            height: 48px;
            flex: 0 0 48px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            border-radius: 18px;
            cursor: pointer;
            /* 只对 width 做带延迟的过渡（侧栏悬停展开效果）；background/color 不参与过渡，避免 active 切换时底色"流动" */
            transition: width 0.3s var(--fluid-ease) 0.5s;
            color: var(--muted);
            overflow: hidden;
            padding-left: 14px;
        }

        .sidebar:hover .nav-item {
            width: 190px;
            transition-delay: 0s;
        }

        .nav-item:hover {
            background: var(--nav-hover-bg);
            color: var(--text);
        }

        .nav-item.active {
            background: var(--accent);
            color: #fff;
        }

        html.theme-dark .nav-item.active,
        body.theme-dark .nav-item.active {
            background: #f1f5f9;
            color: #0f172a;
        }

        .nav-text {
            opacity: 0;
            margin-left: 16px;
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            transition: opacity 0.3s 0.5s;
        }

        .sidebar:hover .nav-text {
            opacity: 1;
            transition-delay: 0.1s;
        }

        .nav-fold-toggle {
            position: relative;
            width: 48px;
            height: 36px;
            flex: 0 0 36px;
            margin: 0 0 6px;
            padding-left: 14px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: transparent;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            cursor: pointer;
            overflow: hidden;
            transition: width 0.3s var(--fluid-ease) 0.5s, background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        .sidebar:hover .nav-fold-toggle {
            width: 190px;
            transition-delay: 0s;
        }

        .nav-fold-toggle:hover {
            background: var(--nav-hover-bg);
            color: var(--text);
            border-color: var(--stage-border);
        }

        .nav-fold-icon {
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
            transition: transform 0.25s var(--fluid-ease);
        }

        .nav-fold-toggle[aria-expanded="false"] .nav-fold-icon {
            transform: rotate(-90deg);
        }

        .nav-fold-group {
            width: 100%;
            flex: 0 0 auto;
            max-height: 720px;
            opacity: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: max-height 0.3s var(--fluid-ease), opacity 0.2s ease;
        }

        .nav-fold-group.is-collapsed {
            max-height: 0;
            opacity: 0;
            pointer-events: none;
        }

        .sidebar nav {
            width: 100%;
            min-height: 0;
            flex: 1 1 auto;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 0 6px;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: rgba(148, 163, 184, .34) transparent;
        }

        .sidebar::-webkit-scrollbar { width: 4px !important; }
        .sidebar::-webkit-scrollbar-track { background: transparent !important; }
        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, .34) !important;
            border: 0 !important;
            border-radius: 999px !important;
        }

        .sidebar nav::-webkit-scrollbar { width: 4px !important; }
        .sidebar nav::-webkit-scrollbar-track { background: transparent !important; }
        .sidebar nav::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, .34) !important;
            border: 0 !important;
            border-radius: 999px !important;
        }

        .sidebar nav > * {
            flex-shrink: 0;
        }

        /* 主舞台区 */
        .stage {
            flex: 1;
            background: var(--stage-bg);
            margin: 16px;
            border-radius: 32px;
            overflow: hidden;
            border: 1px solid var(--stage-border);
            position: relative;
            transition: background 0.3s, border-color 0.3s;
        }

        body.studio-scale-host .stage {
            margin: max(10px, calc(16px * var(--studio-ui-scale, 1)));
            border-radius: max(20px, calc(32px * var(--studio-ui-scale, 1)));
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            transform: scale(1.02);
            filter: blur(4px);
            transition: all 0.5s var(--fluid-ease);
            pointer-events: none;
        }

        iframe.active {
            opacity: 1;
            transform: scale(1);
            filter: blur(0);
            pointer-events: auto;
        }

        /* 左下角监视器 */
        .nano-monitor {
            position: absolute;
            bottom: 24px;
            left: 24px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--monitor-bg);
            backdrop-filter: blur(12px);
            padding: 7px 12px;
            border-radius: 12px;
            border: 1px solid var(--monitor-border);
            box-shadow: 0 4px 20px var(--monitor-shadow);
            font-family: monospace;
            transition: all 0.4s var(--fluid-ease);
        }

        .nano-monitor.is-busy {
            background: #000;
            color: #fff;
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        .stat-group {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text);
        }

        .stat-group:first-child {
            gap: 8px;
        }

        .nano-monitor.is-busy .stat-group {
            color: #fff;
        }

        .divider {
            width: 1px;
            height: 12px;
            background: var(--divider);
        }

        .is-busy .divider {
            background: rgba(255, 255, 255, 0.2);
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            margin-right: 2px;
            flex: 0 0 auto;
        }

        .spinner-nano {
            width: 10px;
            height: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .is-busy .spinner-nano { display: block; }
        .is-busy .pulse-dot { display: none; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .label-nano {
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.5;
            font-size: 9px;
        }

        /* 作者组件 */
        .author-box {
            width: 100%;
            height: 60px;
            flex: 0 0 60px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .dx-letter {
            position: absolute;
            font-size: 14px;
            font-weight: 800;
            color: var(--text);
            /* 只过渡 hover 时真正改的 transform/opacity，避免 all 触发延迟 */
            transition: transform 0.5s var(--fluid-ease) 0.4s, opacity 0.5s var(--fluid-ease) 0.4s;
            z-index: 10;
        }

        .letter-d { transform: translateX(-8px); }
        .letter-x { transform: translateX(8px); }

        .sidebar:hover .letter-d {
            transform: translateX(-120px);
            opacity: 0;
            transition-delay: 0s;
        }

        .sidebar:hover .letter-x {
            transform: translateX(120px);
            opacity: 0;
            transition-delay: 0s;
        }

        .author-content-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.4s var(--fluid-ease) 0s;
            pointer-events: none;
        }

        .sidebar:hover .author-content-wrap {
            opacity: 1;
            transform: scale(1);
            transition-delay: 0.2s;
            pointer-events: auto;
        }

        .author-name-lite {
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--author-name);
        }

        .social-row-lite { display: flex; gap: 12px; }

        .social-icon-lite {
            color: var(--social-icon);
            transition: color 0.2s, transform 0.2s;
        }

        .social-icon-lite:hover {
            color: var(--text);
            transform: translateY(-1px);
        }

        .side-actions {
            margin-top:auto;
            margin-bottom:12px;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:8px;
            width:100%;
            flex:0 0 auto;
        }

        .side-pill {
            width:44px;
            height:36px;
            border-radius:999px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            /* 只过渡 hover/激活会改的属性，避免 all 触发延迟 */
            transition: width 0.3s var(--fluid-ease) 0.5s, gap 0.3s var(--fluid-ease) 0.5s, background-color 0.2s, color 0.2s, border-color 0.2s;
            flex-shrink: 0;
            overflow:hidden;
            gap:8px;
            position:relative;
        }

        .sidebar:hover .side-pill {
            width: 170px;
            transition-delay: 0s;
        }

        /* 侧栏底部的积分余额：收起时只留数字（一眼看到），展开时「图标 + 积分余额 + 数字」 */
        .side-credit-amount {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: -0.01em;
            font-variant-numeric: tabular-nums;
            color: inherit;
            white-space: nowrap;
            overflow: hidden;
        }
        .sidebar:not(:hover) .side-credit-pill svg { display: none; }
        .sidebar:not(:hover) .side-credit-amount { font-size: 10px; }

        .side-pill:hover {
            background: var(--nav-hover-bg);
            color: var(--text);
            border-color: var(--stage-border);
        }

        .side-pill.active {
            background: var(--text);
            color: var(--bg);
            border-color: var(--text);
        }

        .side-pill.update-available {
            border-color:#22c55e;
            color:#16a34a;
            overflow:visible;
        }

        html.theme-dark .side-pill.update-available,
        body.theme-dark .side-pill.update-available {
            border-color:#86efac;
            color:#86efac;
        }

        .side-pill.update-available::after {
            content:"NEW";
            position:absolute;
            top:-7px;
            right:-9px;
            min-width:28px;
            height:16px;
            padding:0 5px;
            border-radius:999px;
            background:#22c55e;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#fff;
            font-size:9px;
            font-weight:900;
            letter-spacing:.02em;
            box-shadow:0 6px 16px rgba(34,197,94,.28), 0 0 0 3px rgba(34,197,94,.12);
            pointer-events:none;
        }

        html.theme-dark .side-pill.update-available::after,
        body.theme-dark .side-pill.update-available::after {
            background:#4ade80;
            color:#052e16;
            box-shadow:0 6px 16px rgba(74,222,128,.22), 0 0 0 3px rgba(74,222,128,.12);
        }

        .side-pill svg { width: 16px; height: 16px; flex:0 0 auto; }
        .settings-fold-chevron {
            width: 13px !important;
            height: 13px !important;
            margin-left: -2px;
            opacity: 0;
            max-width: 0;
            overflow: hidden;
            transition: opacity 0.3s 0.5s, max-width 0.3s var(--fluid-ease) 0.5s, transform .22s var(--fluid-ease);
        }
        .sidebar:hover .settings-fold-chevron,
        .sidebar.is-pinned .settings-fold-chevron {
            opacity: .72;
            max-width: 16px;
            transition-delay: .15s, .15s, 0s;
        }
        .settings-fold-toggle[aria-expanded="true"] .settings-fold-chevron {
            transform: rotate(180deg);
        }
        .settings-fold-group {
            width: 100%;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            transition: max-height .28s var(--fluid-ease), opacity .18s ease;
        }
        .settings-fold-group:not(.is-collapsed) {
            max-height: 132px;
            opacity: 1;
            pointer-events: auto;
        }
        .side-pill-text {
            opacity:0;
            max-width:0;
            font-size:12px;
            font-weight:800;
            letter-spacing:.02em;
            white-space:nowrap;
            overflow:hidden;
            transition: opacity 0.3s 0.5s, max-width 0.3s var(--fluid-ease) 0.5s;
        }
        .sidebar:hover .side-pill-text {
            opacity:1;
            max-width:120px;
            transition-delay:.15s;
        }
        /* 折叠态去除 gap，避免图标被推偏 */
        .side-pill { gap:0; }
        .sidebar:hover .side-pill { gap:8px; }

        .project-version-badge {
            width:44px;
            min-height:18px;
            padding:0 4px;
            border-radius:999px;
            border:1px solid var(--border);
            background:var(--nav-hover-bg);
            color:var(--muted);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:9px;
            font-weight:800;
            line-height:1;
            white-space:nowrap;
            overflow:hidden;
            cursor:pointer;
            transition:width 0.3s var(--fluid-ease) 0.5s, color .2s, border-color .2s, background-color .2s;
        }
        .project-version-badge:hover { color:var(--text); border-color:var(--accent, #6366f1); }
        .project-version-badge.checking { opacity:.6; animation:badge-pulse 1s ease-in-out infinite; }
        @keyframes badge-pulse { 0%,100%{opacity:.5;} 50%{opacity:1;} }

        .sidebar:hover .project-version-badge {
            width:170px;
            transition-delay:0s;
        }

        .project-version-full { display:none; }
        .sidebar:hover .project-version-compact { display:none; }
        .sidebar:hover .project-version-full { display:inline; }

        .update-now-btn {
            display:none;
            width:56px;

            --mhome-muted: #6b7280;
            --mhome-line: rgba(15, 23, 42, .06);
            --mhome-shadow: 0 6px 22px rgba(15, 23, 42, .06);
        }
        html.theme-dark body.mobile-portrait,
        body.theme-dark.mobile-portrait {
            --mhome-bg: #0e1014;
            --mhome-card: #171a20;
            --mhome-ink: #e8ecf4;
            --mhome-muted: #97a0b0;
            --mhome-line: rgba(255, 255, 255, .07);
            --mhome-shadow: 0 6px 22px rgba(0, 0, 0, .35);
        }
        html.studio-ui-scaled body.mobile-portrait {
            width: 100% !important;
            height: 100vh !important;
            min-height: 100vh !important;
            transform: none !important;
        }
        html.studio-ui-scaled body.mobile-portrait > .app-shell { height: 100vh !important; }
        body.mobile-portrait .sidebar { display: none !important; }
        body.mobile-portrait .app-shell { height: 100vh; display: block; }
        body.mobile-portrait .stage,
        body.mobile-portrait.studio-scale-host .stage {
            margin: 0 !important;
            border: 0 !important;
            border-radius: 0 !important;
            background: var(--mhome-bg);
            /* 让出底部标签栏，舞台整体变矮，iframe 铺满剩下的区域 */
            height: calc(100vh - 62px - env(safe-area-inset-bottom, 0px));
        }
        /* 竖屏不需要那颗悬浮胶囊（底部标签栏已经能回到小抽AI）。
           胶囊是 theme.js 挂到 <html> 上的（不是 body 的子元素），所以用兄弟选择器。 */
        body.mobile-portrait #xvai-entry,
        body.mobile-portrait ~ #xvai-entry { display: none !important; }

        body.mobile-portrait .mhome {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 20px 16px 26px;
            box-sizing: border-box;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: var(--mhome-bg);
            color: var(--mhome-ink);
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s var(--fluid-ease);
        }
        body.mobile-portrait.mhome-on .mhome { opacity: 1; pointer-events: auto; }

        .mhome-logo {
            width: 46px; height: 46px; border-radius: 14px; flex: 0 0 auto;
            background: #101114; object-fit: contain; padding: 6px; box-sizing: border-box;
        }
        .mhome-title { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.2px; }
        .mhome-sub { margin: 4px 0 0; font-size: 12.5px; color: var(--mhome-muted); }

        .mhome-cards { display: flex; flex-direction: column; gap: 14px; }
        .mhome-card {
            position: relative;
            background: var(--mhome-card);
            border: 1px solid var(--mhome-line);
            border-radius: 22px;
            padding: 18px 18px 16px;
            box-shadow: var(--mhome-shadow);
            cursor: pointer;
            transition: transform .16s var(--fluid-ease), box-shadow .16s var(--fluid-ease);
        }
        .mhome-card:hover { box-shadow: 0 10px 28px rgba(15, 23, 42, .1); }
        .mhome-card:active { transform: scale(.985); }
        .mhome-icon {
            width: 56px; height: 56px; border-radius: 18px;

            color: var(--card-accent);

        .mhome-btn {

        /* 2026-11-13：一级页面改成「我的」（资料卡 + 设置列表，老板要求） */
        .mhome-profile {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px;
            box-sizing: border-box;
            border-radius: 18px;
            background: var(--mhome-card);

        }
        .mhome-avatar {
            flex: 0 0 auto;

            height: 52px;
            border-radius: 50%;

            align-items: center;
            justify-content: center;

            color: #fff;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
        }
        .mhome-profile-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .mhome-profile-name { font-size: 16px; font-weight: 650; color: var(--mhome-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .mhome-profile-role { font-size: 12px; color: var(--mhome-muted); }
        .mhome-group {
            display: flex;
            flex-direction: column;
            border-radius: 18px;
            background: var(--mhome-card);
            box-shadow: var(--mhome-shadow);
            overflow: hidden;
        }
        .mhome-row {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            min-height: 50px;
            padding: 0 16px;
            box-sizing: border-box;
            border: 0;
            background: transparent;
            color: var(--mhome-ink);
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .mhome-row + .mhome-row { border-top: 1px solid var(--mhome-line); }
        .mhome-row:active { background: rgba(99, 102, 241, .07); }
        .mhome-row svg { flex: 0 0 auto; width: 18px; height: 18px; color: #6366f1; }
        .mhome-row > span { flex: 1 1 auto; min-width: 0; }
        .mhome-row-value { flex: 0 0 auto; font-size: 12.5px; font-weight: 500; color: var(--mhome-muted); }
        .mhome-chev { flex: 0 0 auto; font-size: 18px; font-weight: 400; line-height: 1; color: #c3c8d2; }
        .mhome-switch {
            position: relative;
            flex: 0 0 auto;
            width: 42px;
            height: 24px;
            border-radius: 999px;
            background: #e2e5ee;
            transition: background .16s;
        }
        .mhome-switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 3px rgba(15, 23, 42, .22);
            transition: transform .16s;
        }
        .mhome-switch.on { background: #6366f1; }
        .mhome-switch.on::after { transform: translateX(18px); }
        .mhome-row.is-danger {
            justify-content: center;
            border-radius: 18px;
            background: var(--mhome-card);
            box-shadow: var(--mhome-shadow);
            color: #e5484d;
            font-weight: 600;
        }
        .mhome-row.is-danger > span { flex: 0 0 auto; }
        body.mobile-portrait .mobile-tabs {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            z-index: 60;
            display: flex;
            height: calc(62px + env(safe-area-inset-bottom, 0px));

    <script>
        function generateUUID() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                try { return crypto.randomUUID(); } catch (e) { }
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        const CID = localStorage.getItem("client_id") || generateUUID();
        localStorage.setItem("client_id", CID);
        const ACTIVE_PAGE_KEY = 'studio_active_page';
        const LOCAL_NAV_COLLAPSED_KEY = 'studio_local_nav_collapsed';
        const SIDEBAR_SETTINGS_COLLAPSED_KEY = 'studio_sidebar_settings_collapsed';
        const SIDEBAR_PINNED_KEY = 'studio_sidebar_pinned';
        const DEFAULT_PAGE_ID = 'canvas';
        const PAGE_IDS = ['online','xvai','canvas','asset-manager','api-settings','accounts','credits'];
        const LOCAL_PAGE_IDS = [];
        const PROJECT_URL = 'https://github.com/HanaJhon/Infinite-Canvas';
        let appInfo = { version:'', repo_url:PROJECT_URL, version_url:'' };
        let updateConnectivityResult = null;
        let projectUpdateRunning = false;
        let projectUpdateAbort = null;  // 当前更新请求的 AbortController，便于用户中途取消
        // 更新源：本分支只跟自有仓库比对。原 ModelScope 备份源指向上游，已禁用。
        // UPDATE_SOURCE_MODELSCOPE_ENABLED 置 true 且后端填好常量后，下方逻辑会自动恢复双源。
        const UPDATE_SOURCE_MODELSCOPE_ENABLED = false;
        let updateSource = 'github';
        let projectUpdateNotes = null;

        function setSidebarPinned(pinned, options = {}) {
            const sidebar = document.getElementById('studioSidebar');
            const logo = document.getElementById('sidebarLogoToggle');
            if(!sidebar) return;
            pauseScaleInFrames();
            sidebar.classList.toggle('is-pinned', pinned);
            if(!pinned) {
                sidebar.classList.add('is-collapsing');
                window.setTimeout(() => sidebar.classList.remove('is-collapsing'), 360);
            } else {
                sidebar.classList.remove('is-collapsing');
            }
            if(logo) {
                logo.setAttribute('aria-pressed', pinned ? 'true' : 'false');
                logo.title = pinned ? '收起导航栏' : '固定导航栏';
            }
            if(!options.skipRemember) localStorage.setItem(SIDEBAR_PINNED_KEY, pinned ? '1' : '0');
        }

        function toggleSidebarPinned(event) {
            event?.preventDefault?.();
            event?.stopPropagation?.();
            const sidebar = document.getElementById('studioSidebar');
            setSidebarPinned(!sidebar?.classList.contains('is-pinned'));
        }

        function restoreSidebarPinned() {
            setSidebarPinned(localStorage.getItem(SIDEBAR_PINNED_KEY) === '1', { skipRemember:true });
        }

        function setLocalNavCollapsed(collapsed, options = {}) {
            const group = document.getElementById('local-nav-group');
            const toggle = document.getElementById('local-nav-toggle');
            if(group) group.classList.toggle('is-collapsed', collapsed);
            if(toggle) {
                toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
                toggle.title = collapsed ? '展开本地功能' : '折叠本地功能';
            }
            if(!options.skipRemember) localStorage.setItem(LOCAL_NAV_COLLAPSED_KEY, collapsed ? '1' : '0');
        }

        function toggleLocalNav() {
            const group = document.getElementById('local-nav-group');
            setLocalNavCollapsed(!group?.classList.contains('is-collapsed'));
        }

        function restoreLocalNav(id) {
            const savedCollapsed = localStorage.getItem(LOCAL_NAV_COLLAPSED_KEY) === '1';
            setLocalNavCollapsed(savedCollapsed && !LOCAL_PAGE_IDS.includes(id), { skipRemember:true });
        }

        function setSidebarSettingsCollapsed(collapsed, options = {}) {
            const group = document.getElementById('settings-fold-group');
            const toggle = document.getElementById('settings-fold-toggle');
            if(group) group.classList.toggle('is-collapsed', collapsed);
            if(toggle) {
                toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
                toggle.title = collapsed ? '展开更多设置' : '收起更多设置';
            }
            if(!options.skipRemember) localStorage.setItem(SIDEBAR_SETTINGS_COLLAPSED_KEY, collapsed ? '1' : '0');
        }

        function toggleSidebarSettings() {
            const group = document.getElementById('settings-fold-group');
            setSidebarSettingsCollapsed(!group?.classList.contains('is-collapsed'));
        }

        function restoreSidebarSettings(id) {
            const savedCollapsed = localStorage.getItem(SIDEBAR_SETTINGS_COLLAPSED_KEY) !== '0';
            setSidebarSettingsCollapsed(savedCollapsed && id !== 'comfyui-settings', { skipRemember:true });
        }

        function resetStudioRootScroll() {
            try {
                window.scrollTo(0, 0);
                document.documentElement.scrollTop = 0;
                document.body.scrollTop = 0;
            } catch(e) {}
        }

        function switchUI(el, id, options = {}) {
            resetStudioRootScroll();
            if(!PAGE_IDS.includes(id)) id = DEFAULT_PAGE_ID;
            document.querySelectorAll('.nav-item,.side-pill').forEach(n => n.classList.remove('active'));
            if(el) el.classList.add('active');
            // 竖屏：切到具体功能页就收一级页面（首页由 mobileTabGo('home') 再打开）
            document.body.classList.remove('mhome-on');
            mobileSetTabActive(id);
            document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
            const target = document.getElementById('frame-' + id);
            target.classList.add('active');
            if (!target.src) target.src = target.dataset.src;
            if(!options.skipRemember) localStorage.setItem(ACTIVE_PAGE_KEY, id);
            // sync theme to newly activated iframe
            syncThemeToFrame(target);
            syncLanguageToFrame(target);
            syncScaleToFrame(target);
            if(LOCAL_PAGE_IDS.includes(id)) {
                setLocalNavCollapsed(false, { skipRemember:true });
            } else {
                setLocalNavCollapsed(localStorage.getItem(LOCAL_NAV_COLLAPSED_KEY) === '1', { skipRemember:true });
            }
            if(id === 'comfyui-settings') {
                setSidebarSettingsCollapsed(false, { skipRemember:true });
            }
            // 切换到画布时通知刷新工作流列表（防止在 comfyui-settings 修改后画布未及时更新）
            if (id === 'canvas' && target.src) {
                try { target.contentWindow?.postMessage({ type: 'canvas-focus' }, '*'); } catch(e) {}
            }
            resetStudioRootScroll();
        }

        function forwardStudioApiChange(data) {
            if(!data || !['providers-changed','workflows-changed','comfy-instances-changed'].includes(data.type)) return;
            document.querySelectorAll('iframe').forEach(iframe => {
                try {
                    if (iframe && iframe.contentWindow) iframe.contentWindow.postMessage(data, '*');
                } catch(e) {}
            });
        }

        window.addEventListener('message', event => {
            if (event.origin && event.origin !== location.origin) return;
            if(event.data && event.data.type === 'credits-changed') { refreshSideCredits(); return; }
            forwardStudioApiChange(event.data);
        });

        // ── 侧栏底部积分余额（老板 m21940）：每 15 秒 + 切回窗口 + 子页面通知 时刷新
        const SIDE_CREDIT_POLL_MS = 5000;
        let sideCreditTimer = null;
        function formatSideCredits(value){
            const n = Number(value || 0);
            if(!isFinite(n)) return '—';
            return String(Math.round(n * 100) / 100);
        }
        function refreshSideCredits(){
            const el = document.getElementById('sideCreditAmount');
            const pill = document.getElementById('sideCreditPill');
            return fetch('/api/credits/balance', { credentials:'same-origin' })
                .then(r => (r.ok ? r.json() : null))
                .then(d => {
                    if(!d) return;
                    const text = formatSideCredits(d.balance);
                    if(el) el.textContent = text;
                    if(pill) pill.title = '积分余额 ' + text + ' · 点击查看明细';
                })
                .catch(() => {});
        }
        function openCreditsPage(){ location.href = '/credits.html'; }
        function startSideCredits(){
            refreshSideCredits();
            if(sideCreditTimer) return;
            sideCreditTimer = setInterval(refreshSideCredits, SIDE_CREDIT_POLL_MS);
        }
        window.addEventListener('focus', () => { refreshSideCredits(); });
        document.addEventListener('visibilitychange', () => { if(!document.hidden) refreshSideCredits(); });
        try { startSideCredits(); } catch(e) {}

        try {
            const studioApiChannel = new BroadcastChannel('studio-api');
            studioApiChannel.onmessage = event => forwardStudioApiChange(event.data);
        } catch(e) {}

        // 竖屏（高 > 宽）= 手机形态：侧边栏整体换成一级页面 + 底部标签栏（老板 2026-11-13）
        // 一级页面里可进的三个功能页，和底部四个标签一一对应（画布竖屏放不下，不给入口）
        const MOBILE_TAB_PAGES = ['xvai', 'online', 'asset-manager'];
        // 从「我的」里进的壳内页：没有自己的标签，但也不该被顶回一级页面
        const MOBILE_SHELL_PAGES = [...MOBILE_TAB_PAGES, 'credits', 'accounts'];

        function mobileSetTabActive(id) {
            const target = (id === 'credits' || id === 'accounts') ? 'home' : (id || 'home');
            document.querySelectorAll('#mobileTabs .mtab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.tab === target);
            });
        }

        function showMobileHome() {
            document.body.classList.add('mhome-on');
            document.querySelectorAll('.stage iframe').forEach(f => f.classList.remove('active'));
            mobileSetTabActive('home');
            renderMobileMe();
        }

        function hideMobileHome() {
            document.body.classList.remove('mhome-on');
        }

        // 「我的」页：资料卡 + 设置入口（老板 2026-11-13）
        function syncMobileToggles() {
            const dark = window.StudioTheme ? window.StudioTheme.get() === 'dark' : document.documentElement.classList.contains('theme-dark');
            const sw = document.getElementById('mhomeThemeSwitch');
            if(sw) sw.classList.toggle('on', !!dark);
            const lang = document.getElementById('mhomeLangValue');
            if(lang) lang.textContent = (window.StudioI18n && window.StudioI18n.lang && window.StudioI18n.lang() === 'en') ? 'English' : '中文';
            const ver = document.getElementById('mhomeVersion');
            if(ver) ver.textContent = appInfo && appInfo.version ? versionLabel(appInfo.version) : '—';
        }

        function renderMobileMe() {
            syncMobileToggles();
            fetch('/api/app-info', { cache: 'no-store' })
                .then(r => r.ok ? r.json() : null)
                .then(d => {
                    if(!d || !d.version) return;
                    appInfo = { ...appInfo, ...d };
                    syncMobileToggles();
                })
                .catch(() => {});
            fetch('/api/auth/me', { credentials: 'same-origin' })
                .then(r => r.ok ? r.json() : null)
                .then(d => {
                    const u = d && d.user;
                    if(!u) return;
                    const name = String(u.name || '').trim() || '账号';
                    const nameEl = document.getElementById('mhomeName');
                    if(nameEl) nameEl.textContent = name;
                    const avatar = document.getElementById('mhomeAvatar');
                    if(avatar) avatar.textContent = name.slice(0, 1).toUpperCase();
                    const role = document.getElementById('mhomeRole');
                    if(role) {
                        const parts = [u.role === 'admin' ? '管理员' : '成员'];
                        if(u.seq) parts.unshift('#' + u.seq);
                        if(typeof u.credits === 'number') parts.push(Math.round(u.credits * 100) / 100 + ' 积分');
                        role.textContent = parts.join(' · ');
                    }
                    const credits = document.getElementById('mhomeCredits');
                    if(credits && typeof u.credits === 'number') credits.textContent = Math.round(u.credits * 100) / 100;
                    const isAdmin = u.role === 'admin';
                    const acc = document.getElementById('mhomeRowAccount');
                    if(acc) acc.style.display = isAdmin ? '' : 'none';
                    const api = document.getElementById('mhomeRowApi');
                    if(api) api.style.display = isAdmin ? '' : 'none';
                })
                .catch(() => {});
        }

        // 账号 / 积分是壳内页面：整页跳转会连底部标签栏一起丢掉（老板 2026-11-13）
        function mobileOpenShellPage(id) {
            const proxy = document.createElement('button');
            proxy.dataset.page = id;
            switchUI(proxy, id);
        }
        function mobileOpenCredits() { mobileOpenShellPage('credits'); }
        function mobileOpenAccounts() { mobileOpenShellPage('accounts'); }

        function mobileOpenApi() {
            // 侧边栏没有 api-settings 的 nav-item，沿用账号弹层里的临时按钮做法
            const proxy = document.createElement('button');
            proxy.dataset.page = 'api-settings';
            switchUI(proxy, 'api-settings');
        }

        function mobileToggleTheme() {
            toggleTheme();
            setTimeout(syncMobileToggles, 80);
        }

        function mobileToggleLang() {
            toggleLanguage();
            setTimeout(syncMobileToggles, 80);
        }

        function mobileCheckUpdate() { checkForUpdates(true); }

        function mobileLogout() {
            const ask = (window.StudioI18n && window.StudioI18n.lang && window.StudioI18n.lang() === 'en')
                ? 'Sign out now?' : '要退出登录吗？';
            if(!confirm(ask)) return;
            fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' })
                .catch(() => {})
                .then(() => location.replace('/login.html'));
        }

        function mobileTabGo(page) {
            if(!page || page === 'home') { showMobileHome(); return; }
            const el = document.querySelector(`.nav-item[onclick*="'${page}'"]`);
            switchUI(el, page);
        }

        function syncPortraitNav() {
            const portrait = window.innerHeight > window.innerWidth;
            document.body.classList.toggle('mobile-portrait', portrait);
            const item = document.getElementById('nav-xvai');
            if(item) item.style.display = portrait ? '' : 'none';
            // 竖屏是手机形态，无限画布的大画布放不下：隐藏入口
            const canvasItem = document.getElementById('nav-canvas');
            if(canvasItem) canvasItem.style.display = portrait ? 'none' : '';
            const page = localStorage.getItem(ACTIVE_PAGE_KEY);
            if(portrait) {
                // 竖屏首次进来（还停在画布等横屏页）→ 先给一级页面
                if(!MOBILE_SHELL_PAGES.includes(page)) showMobileHome();
                else mobileSetTabActive(page);
            } else {
                hideMobileHome();
                if(page === 'xvai' || !PAGE_IDS.includes(page) || !document.querySelector('.stage iframe.active')) {
                    // 横屏后竖屏专属入口消失 / 之前停在一级页面上（没有激活的 iframe），
                    // 别把用户留在空舞台或看不见的页面上
                    switchUI(document.getElementById('nav-canvas'), 'canvas');
                }
            }
        }
        let portraitNavTimer = 0;
        window.addEventListener('resize', () => {
            clearTimeout(portraitNavTimer);
            portraitNavTimer = setTimeout(syncPortraitNav, 120);
        });
        window.addEventListener('orientationchange', () => syncPortraitNav());

        function restoreActivePage() {
            syncPortraitNav();
            restoreSidebarPinned();
            const id = PAGE_IDS.includes(localStorage.getItem(ACTIVE_PAGE_KEY)) ? localStorage.getItem(ACTIVE_PAGE_KEY) : DEFAULT_PAGE_ID;
            restoreLocalNav(id);
            restoreSidebarSettings(id);
            const trigger = document.querySelector(`[onclick*="'${id}'"],[onclick*='"${id}"']`);
            switchUI(trigger, id, { skipRemember:true });
            // switchUI 会收起一级页面，恢复完当前页要再按竖屏状态摆一次
            syncPortraitNav();
            document.documentElement.classList.remove('studio-route-booting');
        }
        document.addEventListener('DOMContentLoaded', restoreActivePage, { once:true });

        async function syncStatus() {
            try {
                const res = await fetch(`/api/queue_status?client_id=${CID}`);
                const data = await res.json();
                const monitor = document.getElementById('nano-monitor');
                const queueVal = document.getElementById('queue-val');
                const logoDot = document.getElementById('logo-dot');
                const logoToggle = document.getElementById('sidebarLogoToggle');
                const total = data.total || 0;
                const pos = data.position || 0;
                if (pos > 0) {
                    monitor?.classList.add('is-busy');
                    if (queueVal) queueVal.innerText = `${pos}/${total}`;
                    if (logoDot) logoDot.style.backgroundColor = '#3b82f6';
                    logoToggle?.classList.add('is-queue-busy');
                } else {
                    monitor?.classList.remove('is-busy');
                    if (queueVal) queueVal.innerText = total > 0 ? total : '0';
                    if (logoDot) logoDot.style.backgroundColor = 'var(--text)';
                    logoToggle?.classList.remove('is-queue-busy');
                }
            } catch (e) { }
        }

        const host = window.location.host;
        if (host) {
            const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
            const ws = new WebSocket(`${protocol}://${host}/ws/stats?client_id=${CID}`);
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'stats') {
                    const ov = document.getElementById('online-val');
                    if (ov) ov.innerText = data.online_count;
                } else if (data.type === 'cloud_status') {
                    const iframe = document.querySelector('iframe.active');
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.postMessage(data, '*');
                    }
                } else if (data.type === 'canvas_updated') {
                    const iframe = document.querySelector('iframe.active');
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.postMessage(data, '*');
                    }
                } else if (data.type === 'asset_library_updated') {
                    document.querySelectorAll('iframe').forEach(iframe => {

        function versionParts(value) {
            return String(value || '').match(/\d+/g)?.map(Number) || [];
        }

        function compareVersions(a, b) {
            const aa = versionParts(a);
            const bb = versionParts(b);
            const len = Math.max(aa.length, bb.length);
            for(let i = 0; i < len; i++){
                const diff = (aa[i] || 0) - (bb[i] || 0);
                if(diff) return diff;
            }
            return String(a || '').trim() === String(b || '').trim() ? 0 : 1;
        }

        function compactVersion(value) {
            const text = String(value || '').trim();
            const parts = text.match(/\d+/g) || [];
            if(parts.length >= 3) return `${parts[1]}.${parts[2]}`;
            return text.replace(/^v/i, '') || '-';
        }

        function versionLabel(value, mode = 'full') {
            const text = String(value || '').trim();
            if(!text) return 'v-';
            return mode === 'compact' ? `v${compactVersion(text)}` : `v${text.replace(/^v/i, '')}`;
        }

        function setProjectVersionBadge(version) {
            const badge = document.getElementById('project-version-badge');

                const compactSpan = document.createElement('span');
                compactSpan.className = 'project-version-compact';
                compactSpan.textContent = versionLabel(version, 'compact');
                const fullSpan = document.createElement('span');
                fullSpan.className = 'project-version-full';
                fullSpan.textContent = full;
                badge.append(compactSpan, fullSpan);
            } else {
                badge.textContent = 'v-';
            }
            badge.title = window.StudioI18n?.lang?.() === 'en'
                ? `Current version: ${full} · click to check for updates`
                : `当前版本：${full} · 点击检测更新`;
        }

        function describeNetworkError(err, isEn){
            const msg = String(err?.message || err || '');
            const isNetwork = (err instanceof TypeError) || /Failed to fetch|NetworkError|ERR_|timed? ?out|超时|无法连接|GitHub|HTTP 4|HTTP 5/i.test(msg);
            if(isNetwork){
                return isEn
                    ? 'Cannot reach the selected update source. Check your network, proxy, or DNS, then try again.'
                    : '无法连接当前选择的更新源。请检查网络、代理或 DNS 后重试。';
            }
            return msg || (isEn ? 'Update failed' : '更新失败');

        function updateSourceLabel(source = updateSource) {
            return source === 'modelscope' ? 'ModelScope' : 'GitHub';

        function setUpdateSource(source) {
            // ModelScope 源禁用时强制 GitHub，避免误拉上游代码覆盖本分支改造
            updateSource = (UPDATE_SOURCE_MODELSCOPE_ENABLED && source === 'modelscope') ? 'modelscope' : 'github';

        function sourceConnectivityStats(source, results = []) {
            const sourceItems = (results || []).filter(item => item.source === source);
            const required = sourceItems.filter(item => item.required);
            const okRequired = required.length ? required.every(item => item.ok) : false;
            const okItems = sourceItems.filter(item => item.ok);
            const avg = okItems.length
                ? Math.round(okItems.reduce((sum, item) => sum + Number(item.elapsed_ms || 0), 0) / okItems.length)
                : 999999;
            return {source, ok:okRequired, avg, okItems:okItems.length, total:sourceItems.length};
        }

        function bestUpdateSourceFromConnectivity(data) {
            const results = data?.results || [];
            const github = sourceConnectivityStats('github', results);
            if(!UPDATE_SOURCE_MODELSCOPE_ENABLED) {
                return github.ok ? 'github' : updateSource;
            }
            const ms = sourceConnectivityStats('modelscope', results);
            if(github.ok && ms.ok) return ms.avg < github.avg ? 'modelscope' : 'github';
            if(ms.ok) return 'modelscope';
            if(github.ok) return 'github';
            return updateSource;
        }

        function renderConnectivityList(results = []) {
            const allItems = results.length ? results : updateConnectivityTargets().map(item => ({...item, pending:false, untouched:true}));
            const renderInto = (list, source) => {
                if(!list) return;
                list.replaceChildren();
                const items = allItems.filter(item => item.source === source || (source === 'github' && item.source === 'reference'));
                items.forEach(item => {
                const row = document.createElement('div');
                row.className = `connectivity-row ${item.pending ? 'pending' : item.untouched ? '' : item.ok ? 'ok' : 'fail'}`;
                const indicator = document.createElement('span');
                indicator.className = 'connectivity-indicator';
                const meta = document.createElement('div');
                const name = document.createElement('div');
                name.className = 'connectivity-name';
                name.textContent = updateTargetLabel(item.name);
                const url = document.createElement('div');
                url.className = 'connectivity-url';
                url.textContent = item.url || '';
                meta.append(name, url);
                const status = document.createElement('div');
                status.className = 'connectivity-status';
                status.textContent = item.untouched ? updateUiText('待测试', 'Not tested') : updateStatusLabel(item);
                row.append(indicator, meta, status);
                if(item.error && !item.timed_out) {
                    const error = document.createElement('div');
                    error.className = 'connectivity-error';
                    error.textContent = String(item.error).slice(0, 220);
                    row.append(error);
                }
                list.append(row);
            });

            renderInto(document.querySelector('[data-connectivity-source="github"]'), 'github');

                renderInto(document.querySelector('[data-connectivity-source="modelscope"]'), 'modelscope');

            );

                            : '测试会检测本仓库 HanaJhon/Infinite-Canvas 的连通性，确认可访问后再更新。',

                            ? 'The test checks both GitHub and ModelScope. Choose the faster reachable source before updating.'
                            : 'The test checks connectivity to HanaJhon/Infinite-Canvas before updating.'
                    )
                );

                setUpdateSummary(
                    'fail',

                        'The page is updated, but the backend is still the old version and cannot find the connectivity-test API. Restart the service and try again.'
                    )
                );
            } else if((updateConnectivityResult.sources || {})[updateSource]?.ok || (updateSource === 'github' && updateConnectivityResult.ok)) {
                const google = (updateConnectivityResult.results || []).find(item => item.name === 'Google 连通性');
                const sourceResults = (updateConnectivityResult.results || []).filter(item => item.source === updateSource);
                const fastest = sourceResults.filter(item => item.ok).sort((a, b) => (a.elapsed_ms || 999999) - (b.elapsed_ms || 999999))[0];
                setUpdateSummary(
                    google?.ok ? 'ok' : 'warn',

                );

                    )
                );

            renderConnectivityList(updateConnectivityResult?.results || []);
        }

        function computeConnectivitySources(results) {
            const out = {};
            for(const source of ['github', ...(UPDATE_SOURCE_MODELSCOPE_ENABLED ? ['modelscope'] : [])]) {
                const reqAll = (results || []).filter(it => it.source === source && it.required);
                out[source] = {
                    ok: reqAll.length > 0 && reqAll.every(it => it.ok),
                    required: reqAll.map(it => it.name),
                };
            }
            return out;
        }

        function setSourceBadge(badge, state, text) {
            if(!badge) return;
            badge.classList.remove('ok', 'bad');
            if(state) badge.classList.add(state);
            badge.textContent = text;
        }

        function renderSourceBadgesLive(results) {
            document.querySelectorAll('[data-update-source]').forEach(card => {
                const source = card.dataset.updateSource || 'github';
                const badge = card.querySelector('.update-source-badge');
                if(!badge) return;
                const items = (results || []).filter(it => it.source === source);
                if(!items.length) return;
                const done = items.filter(it => !it.pending && !it.untouched);
                if(done.length < items.length) {
                    setSourceBadge(badge, '', updateUiText(`检测中 ${done.length}/${items.length}`, `${done.length}/${items.length}`));
                    return;
                }
                const stats = sourceConnectivityStats(source, results);
                setSourceBadge(badge, stats.ok ? 'ok' : 'bad',
                    stats.ok ? updateUiText('可用', 'Available') : updateUiText('不可用', 'Unavailable'));
            });
        }

        let connectivityTesting = false;
        async function runUpdateConnectivityTest() {
            if(connectivityTesting) return; // 防止重复点击导致状态错乱
            const isEn = window.StudioI18n?.lang?.() === 'en';
            const btn = document.getElementById('connectivity-test-btn');
            const text = document.getElementById('connectivity-test-text');
            connectivityTesting = true;
            if(btn) btn.disabled = true;
            if(text) text.textContent = isEn ? 'Testing...' : '检测中...';
            updateConnectivityResult = null;

            const targets = updateConnectivityTargets();
            // 实时状态数组：先全部置为「检测中」，每条探测完成立即刷新对应行
            const live = targets.map(item => ({...item, pending:true, untouched:false}));
            let backendMissing = false;
            const applyResult = (name, patch) => {
                const i = live.findIndex(x => x.name === name);
                if(i < 0) return;
                live[i] = {...live[i], pending:false, untouched:false, ...patch};
                renderConnectivityList(live);
                renderSourceBadgesLive(live);
            };

            const probeOne = async (t) => {
                // 客户端兜底超时：5s 探测 + 1s 网络余量，超时即报「超时」，不会永远卡在「检测中」
                const ac = new AbortController();
                const killer = setTimeout(() => ac.abort(), 6000);
                try {
                    const res = await fetch(`/api/update-connectivity/probe?name=${encodeURIComponent(t.name)}`, { cache:'no-store', signal:ac.signal });
                    const data = await res.json().catch(() => ({}));
                    // 旧后端没有单条探测接口 → 404 Not Found，标记后回退到整体接口
                    if(res.status === 404 && (data.detail === 'Not Found' || data.detail === undefined)) {
                        backendMissing = true;
                        return;
                    }
                    if(res.ok) {
                        applyResult(t.name, { ok:!!data.ok, status:data.status || 0, elapsed_ms:data.elapsed_ms || 0, error:data.error || '', timed_out:!!data.timed_out });
                    } else {
                        applyResult(t.name, { ok:false, error:data.detail || (isEn ? 'Failed' : '失败') });
                    }
                } catch(e) {
                    if(e && e.name === 'AbortError') {
                        applyResult(t.name, { ok:false, timed_out:true, error:isEn ? 'Timed out (over 5s)' : '连接超时（超过 5s）' });
                    } else {
                        applyResult(t.name, { ok:false, error:describeNetworkError(e, isEn) });
                    }
                } finally {
                    clearTimeout(killer);
                }
            };

            try {
                setUpdateSummary('warn', isEn ? 'Testing connectivity' : '正在测试连通性', isEn ? 'Probing each endpoint — results stream in live.' : '正在逐条检测各节点，结果实时显示。');
                renderConnectivityList(live);
                renderSourceBadgesLive(live);
                await Promise.all(targets.map(probeOne));

                if(backendMissing) {
                    // 兜底：尝试旧的整体接口
                    try {
                        const res = await fetch('/api/update-connectivity', { cache:'no-store' });
                        const data = await res.json().catch(() => ({}));
                        if(res.ok && Array.isArray(data.results)) {
                            updateConnectivityResult = data;
                            setUpdateSource(bestUpdateSourceFromConnectivity(data));
                            return;
                        }
                    } catch(e) {}
                    const message = isEn
                        ? 'The backend has not loaded the new connectivity-test API yet. Restart the backend service, then test again.'
                        : '后端还没有加载新的连通性测试接口。请重启服务后再测试。';
                    updateConnectivityResult = {
                        ok:false,
                        backend_missing:true,
                        results:targets.map(item => ({...item, ok:false, elapsed_ms:0, error:message })),
                    };
                    return;
                }

                const results = live.map(({pending, untouched, ...rest}) => rest);
                const sources = computeConnectivitySources(results);
                updateConnectivityResult = { results, sources, ok:sources.github.ok };
                setUpdateSource(bestUpdateSourceFromConnectivity(updateConnectivityResult));
            } finally {
                connectivityTesting = false;
                if(btn) btn.disabled = false;
                refreshProjectUpdateModalText();
            }
        }

        async function confirmProjectUpdate() {
            const isEn = window.StudioI18n?.lang?.() === 'en';
            const btn = document.getElementById('update-now-btn');
            const text = document.getElementById('update-now-text');
            const confirmBtn = document.getElementById('project-update-confirm-btn');
            const confirmText = document.getElementById('project-update-confirm-text');
            const testBtn = document.getElementById('connectivity-test-btn');
            const oldText = text?.textContent || '';
            projectUpdateRunning = true;
            if(btn) btn.disabled = true;
            if(confirmBtn) confirmBtn.disabled = true;
            if(testBtn) testBtn.disabled = true;
            if(text) text.textContent = isEn ? 'Updating...' : '更新中...';
            if(confirmText) confirmText.textContent = isEn ? 'Updating...' : '更新中...';
            const sourceName = updateSourceLabel();
            setUpdateSummary('warn', isEn ? 'Updating' : '正在更新', isEn ? `Downloading files from ${sourceName} and creating a local backup.` : `正在从 ${sourceName} 下载文件，并创建本地备份。`);
            // 客户端兜底超时：即使后端异常挂起，UI 也能恢复，不会永远停在「更新中」
            const ac = new AbortController();
            const killer = setTimeout(() => ac.abort(), 300000);
            try {
                const res = await fetch('/api/update-from-github', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({ auto_restart:true, restart_delay:3, source:updateSource, fallback:true }),
                    signal:ac.signal
                });
                const data = await res.json().catch(() => ({}));
                if(!res.ok) throw new Error(data.detail || (isEn ? 'Update failed' : '更新失败'));
                if(data.update_notes) setProjectUpdateNotes(data.update_notes);
                const restarting = data.restart_scheduled;
                const usedLabel = data.source_label || (data.source === 'modelscope' ? 'ModelScope' : 'GitHub');
                const fallbackNote = data.fallback_used
                    ? (isEn
                        ? ` (${sourceName} was unreachable, so it fell back to ${usedLabel})`
                        : `（${sourceName} 不可用，已自动兜底切换到 ${usedLabel}）`)
                    : '';
                setUpdateSummary(
                    'ok',
                    isEn ? 'Update complete' : '更新完成',
                    (restarting
                        ? (isEn
                            ? `Updated ${data.count || 0} files. The backend will restart in about 3 seconds; this page will reload when it returns.`
                            : `已更新 ${data.count || 0} 个文件。后端将在约 3 秒后自动重启，本页面会在恢复后自动刷新。`)
                        : (isEn
                            ? `Updated ${data.count || 0} files. Please restart the backend, then refresh this page.`
                            : `已更新 ${data.count || 0} 个文件。请重启后端，然后刷新页面。`)) + fallbackNote
                );
                document.getElementById('github-entry-btn')?.classList.remove('update-available');
                btn?.classList.remove('show');
                setProjectVersionBadge(data.version || document.getElementById('github-entry-btn')?.dataset.remoteVersion || appInfo.version);
                if(restarting) waitForBackendAndReload();
            } catch(e) {
                const msg = (e && e.name === 'AbortError')
                    ? (isEn ? 'Update timed out. Switch source or check your network, then retry.' : '更新超时。请切换下载源或检查网络后重试。')
                    : describeNetworkError(e, isEn);
                setUpdateSummary('fail', isEn ? 'Update failed' : '更新失败', msg);
            } finally {
                clearTimeout(killer);
                projectUpdateRunning = false;
                if(btn) btn.disabled = false;
                if(confirmBtn) confirmBtn.disabled = false;
                if(testBtn) testBtn.disabled = false;
                if(text) text.textContent = oldText || (isEn ? 'Update' : '一键更新');
                if(confirmText) confirmText.textContent = isEn ? 'Start update' : '开始更新';
                refreshUpdateButtonText();
            }
        }
        async function waitForBackendAndReload() {
            const deadline = Date.now() + 90 * 1000;
            await new Promise(r => setTimeout(r, 4000));
            while(Date.now() < deadline) {
                try {
                    const r = await fetch('/api/app-info', { cache:'no-store' });
                    if(r.ok) { location.reload(); return; }
                } catch {}
                await new Promise(r => setTimeout(r, 1500));
            }
        }
        async function rollbackProjectUpdate() {
            const isEn = window.StudioI18n?.lang?.() === 'en';
            try {
                const list = await fetch('/api/update-backups').then(r => r.json());
                const backups = list.backups || [];
                if(!backups.length){ alert(isEn ? 'No backups available.' : '没有可用的备份'); return; }
                const lines = backups.slice(0, 10).map((b, i) => {
                    const d = new Date((b.created_at || 0) * 1000);
                    const ts = d.toLocaleString();
                    const versions = b.from_version
                        ? `  [${b.from_version}${b.target_version ? ` -> ${b.target_version}` : ''}]`
                        : '';
                    const notes = Array.isArray(b.update_notes?.items)
                        ? b.update_notes.items.map(item => String(item?.text || '').trim()).filter(Boolean).slice(0, 3)
                        : [];
                    const changeText = notes.length
                        ? `\n   更新内容：${notes.join('；')}`
                        : (b.affected_file_count ? `\n   影响文件：${b.affected_file_count} 个` : '');
                    return `${i + 1}. ${b.name}${versions}  (${b.file_count} files, ${ts})${changeText}`;
                });
                const promptMsg = (isEn
                    ? 'Select a backup to restore (enter the number):\n'
                    : '选择要还原的备份（输入序号）：\n') + lines.join('\n');
                const answer = prompt(promptMsg, '1');
                const idx = Number(answer) - 1;
                if(!(idx >= 0 && idx < backups.length)) return;
                const target = backups[idx];
                if(!confirm(isEn ? `Restore "${target.name}"? Backend will restart.` : `要还原 "${target.name}" 吗？后端会自动重启。`)) return;
                const res = await fetch('/api/update-rollback', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({ name:target.name, auto_restart:true, restart_delay:3 })
                });
                const data = await res.json().catch(() => ({}));
                if(!res.ok) throw new Error(data.detail || (isEn ? 'Rollback failed' : '回滚失败'));
                alert(isEn
                    ? `Restored ${data.count || 0} files. A safety restore point was created, and the backend is restarting.`
                    : `已还原 ${data.count || 0} 个文件，当前版本已自动保存为新的恢复点。后端正在重启。`);
                if(data.restart_scheduled) waitForBackendAndReload();
            } catch(e) {
                alert((isEn ? 'Rollback failed: ' : '回滚失败：') + describeNetworkError(e, isEn));
            }
        }
        window.rollbackProjectUpdate = rollbackProjectUpdate;

        async function checkForUpdates(manual = false) {
            const isEn = window.StudioI18n?.lang?.() === 'en';
            const badge = document.getElementById('project-version-badge');
            if(manual && badge) badge.classList.add('checking');
            try {
                const info = await fetch('/api/app-info', { cache:'no-store' }).then(r => r.json()).catch(() => ({}));
                appInfo = {...appInfo, ...info};
                let current = String(appInfo.version || '').trim();
                setProjectVersionBadge(current);
                let best = null;
                let reachable = false;
                let serverChecked = false;
                // 优先走后端检测：服务端用系统代理检测远端版本，避免浏览器跨域/被墙
                try {
                    const r = await fetch('/api/check-update', { cache:'no-store' });
                    if(r.ok) {
                        const d = await r.json();
                        serverChecked = true;
                        reachable = !!d.reachable;
                        if(d.current) { current = String(d.current).trim(); setProjectVersionBadge(current); }
                        if(d.latest?.version) best = {source:d.latest.source, version:d.latest.version, update_notes:d.latest.update_notes || d.update_notes || null};
                    }
                } catch(e) {}
                // 兜底：旧后端无 /api/check-update 时，浏览器直接拉取远端 VERSION
                if(!serverChecked) {
                    const sources = appInfo.sources || {};
                    const candidates = [
                        {source:'github', url:sources.github?.version_url || appInfo.version_url || ''},
                        ...(UPDATE_SOURCE_MODELSCOPE_ENABLED ? [{source:'modelscope', url:sources.modelscope?.version_url || ''}] : []),
                    ].filter(item => item.url);
                    for(const item of candidates) {
                        try {
                            const remoteText = await fetch(`${item.url}${item.url.includes('?') ? '&' : '?'}t=${Date.now()}`, { cache:'no-store' }).then(r => r.ok ? r.text() : '');
                            const remote = String(remoteText || '').trim().split(/\r?\n/)[0].trim();
                            if(remote){ reachable = true; if(!best || compareVersions(remote, best.version) > 0) best = {source:item.source, version:remote}; }
                        } catch(e) {}
                    }
                }
                const hasUpdate = !!(current && best?.version && compareVersions(best.version, current) > 0);
                if(hasUpdate) {
                    if(best.source === 'modelscope') setUpdateSource('modelscope');
                    setProjectUpdateNotes(best.update_notes || null);
                    showUpdateNotice(current, best.version);
                }
                if(manual) {
                    if(hasUpdate) {
                        openProjectUpdateModal();
                    } else if(reachable) {
                        alert(isEn ? `You are on the latest version (${versionLabel(current)}).` : `已是最新版本（${versionLabel(current)}）。`);
                    } else {
                        alert(isEn ? 'Could not reach the update source. Check your network/proxy and try again.' : '无法连接更新源，请检查网络或代理后重试。');
                    }
                }
            } catch(e) {
                // 离线包里没有网络时保持安静，不影响本地使用。
                if(manual) alert(isEn ? 'Update check failed.' : '检测更新失败。');
            } finally {
                if(badge) badge.classList.remove('checking');
            }
        }
    </script>

<!-- 账号菜单（2026-10-27 多账号） -->
<!-- 左侧栏的「账号」pill：显示当前账号，点开可进账号管理 / API 设置 / 退出登录。
     原来这里是「API 设置」pill，老板要求把位置让给账号管理（API 设置挪进菜单，功能不丢）。 -->
<style>
  #accountPop{position:fixed;z-index:99999;min-width:176px;display:none;
    background:var(--bg,#fff);border:1px solid var(--border,#e6e8ef);border-radius:12px;
    box-shadow:0 16px 40px rgba(16,24,40,.18);padding:6px;}
  #accountPop.on{display:block;}
  #accountPop .acc-head{padding:8px 10px 9px;border-bottom:1px solid var(--border,#e6e8ef);margin-bottom:4px;}
  #accountPop .acc-name{font:700 12.5px/1.3 "Microsoft YaHei UI",system-ui;color:var(--text,#141821);}
  #accountPop .acc-role{font:600 10px/1.3 "Microsoft YaHei UI",system-ui;color:var(--muted,#6b7280);margin-top:2px;}
  #accountPop button{display:block;width:100%;text-align:left;padding:9px 10px;border:0;border-radius:8px;
    background:transparent;color:var(--text,#141821);cursor:pointer;
    font:500 12.5px/1.3 "Microsoft YaHei UI",system-ui;}
  #accountPop button:hover{background:var(--hover,#f1f3f8);}
  #accountPop button.danger{color:#e5484d;}
</style>
<div id="accountPop">
  <div class="acc-head">
    <div class="acc-name" id="accPopName">…</div>
    <div class="acc-role" id="accPopRole"></div>
  </div>
  <button type="button" id="accPopCredits">我的积分</button>
  <button type="button" id="accPopManage">账号管理</button>
  <button type="button" id="accPopApi">API 设置</button>
  <button type="button" class="danger" id="accPopLogout">退出登录</button>
</div>
<script>
(function () {
  var pill = document.getElementById('accountPill');
  var pop = document.getElementById('accountPop');
  if (!pill || !pop) return;

  var me = null;

  function place() {
    var r = pill.getBoundingClientRect();
    pop.style.left = Math.round(r.right + 10) + 'px';
    pop.style.top = Math.round(Math.max(8, r.top - 8)) + 'px';
  }

  function fill(user) {
    me = user;
    document.getElementById('accPopName').textContent = user.name || '未登录';
    var roleText = user.role === 'admin' ? '管理员' : '成员';
    if (user.seq) roleText = '#' + user.seq + ' · ' + roleText;
    if (typeof user.credits === 'number') roleText += ' · ' + (Math.round(user.credits * 100) / 100) + ' 积分';
    document.getElementById('accPopRole').textContent = roleText;
    var txt = document.getElementById('accountPillText');
    if (txt) txt.textContent = user.name || '账号';
    // 2026-10-27：账号管理 与 API 设置 只给管理员
    var isAdmin = user.role === 'admin';
    document.getElementById('accPopManage').style.display = isAdmin ? '' : 'none';
    document.getElementById('accPopApi').style.display = isAdmin ? '' : 'none';
  }

  fetch('/api/auth/me', { credentials: 'same-origin' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) { if (d && d.user) fill(d.user); })
    .catch(function () {});

  pill.addEventListener('click', function (e) {
    e.stopPropagation();
    place();
    pop.classList.toggle('on');
  });

  document.addEventListener('click', function () { pop.classList.remove('on'); });

  document.getElementById('accPopManage').addEventListener('click', function () {
    location.href = '/accounts.html';
  });

  document.getElementById('accPopCredits').addEventListener('click', function () {
    location.href = '/credits.html';
  });

  // API 设置：复用页面原有的 switchUI（就是原来那个 pill 干的事）
  document.getElementById('accPopApi').addEventListener('click', function () {
    pop.classList.remove('on');
    try {
      if (typeof window.switchUI === 'function') {
        // switchUI 期望的是被点的按钮，这里临时造一个指向 api-settings 的
        var proxy = document.createElement('button');
        proxy.dataset.page = 'api-settings';
        window.switchUI(proxy, 'api-settings');
      } else {
        location.href = '/static/api-settings.html';
      }
    } catch (err) {
      location.href = '/static/api-settings.html';
    }
  });

  document.getElementById('accPopLogout').addEventListener('click', function () {
    fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' })
      .catch(function () {})
      .then(function () { location.replace('/login.html'); });
  });
})();
</script>
