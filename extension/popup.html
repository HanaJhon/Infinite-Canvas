<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>无限画布素材采集</title>
  <link rel="stylesheet" href="ui.css">
  <script src="theme.js"></script>
</head>
<body class="page-popup">
  <header class="bar">
    <div class="bar-title">素材采集</div>
    <div class="bar-user" id="userLabel">检查中…</div>
  </header>

  <main>
    <button id="captureBtn" class="btn primary block">采集当前页图片</button>
    <button id="openCaptureBtn" class="btn block">打开采集窗口</button>
    <button id="openOptionsBtn" class="btn block">设置 / 登录</button>
    <p class="msg" id="msg"></p>
    <p class="hint">右键网页图片选「采集到无限画布素材库」，或把图片拖到页面中间的投放区。</p>
  </main>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
